---
# Backup server and client on one node (lab mode): rest-server in Docker inside the test container,
# the restic client backing up a sample declaration and the host essentials to it.
driver:
  name: docker
platforms:
  - name: backup-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Anonymous volume: removed with the container, so every run starts clean.
      - /var/lib/docker
    command: ""
    groups: [backup, container_hosts]
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  playbooks:
    prepare: ../default/prepare.yml
  inventory:
    group_vars:
      all:
        firewall_mgmt_cidrs: [10.10.0.0/24]
        backup_password_seed: test-only-backup-seed-0123456789abcdef0123
        backup_server_allow_single_node: true
        backup_allow_single_server: true
        backup_server_memory_limit: 256m
        # Nested overlay filesystems are not always possible; vfs works everywhere.
        container_runtime_daemon_extra:
          storage-driver: vfs
          # The test container's own file limit is lower than the production default.
          default-ulimits: {}
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
