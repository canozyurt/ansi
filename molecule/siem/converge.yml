---
- name: Prepare the lab node
  hosts: all
  become: true
  environment:
    https_proxy: "{{ lookup('ansible.builtin.env', 'MOLECULE_HTTPS_PROXY') }}"
    no_proxy: "127.0.0.1,localhost"
  vars:
    molecule_https_proxy: "{{ lookup('ansible.builtin.env', 'MOLECULE_HTTPS_PROXY') }}"
  tasks:
    - name: Install the container runtime
      ansible.builtin.include_role:
        name: container_runtime

    - name: Route image pulls through the test proxy
      when: molecule_https_proxy | length > 0
      block:
        - name: Create the Docker service drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/system/docker.service.d
            state: directory
            mode: "0755"

        - name: Set the proxy for dockerd
          ansible.builtin.copy:
            content: |
              [Service]
              Environment="HTTPS_PROXY={{ molecule_https_proxy }}"
            dest: /etc/systemd/system/docker.service.d/proxy.conf
            mode: "0644"
          register: converge_docker_proxy

        - name: Restart Docker with the proxy
          ansible.builtin.systemd_service:
            name: docker
            state: restarted
            daemon_reload: true
          when: converge_docker_proxy.changed  # noqa: no-handler

    - name: Install the lab stand-ins for Keycloak discovery and Alertmanager
      ansible.builtin.copy:
        src: files/fake_services.py
        dest: /usr/local/bin/fake-services
        mode: "0755"

    - name: Run the stand-ins as a service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Lab stand-ins for Keycloak discovery and Alertmanager
          [Service]
          ExecStart=/usr/bin/python3 /usr/local/bin/fake-services
          Restart=always
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/fake-services.service
        mode: "0644"

    - name: Start the stand-ins
      ansible.builtin.systemd_service:
        name: fake-services
        state: started
        enabled: true
        daemon_reload: true

- name: Deploy the SIEM
  ansible.builtin.import_playbook: ../../playbooks/siem.yml
