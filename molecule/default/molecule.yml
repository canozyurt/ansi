---
# Runs the baseline and container host playbooks on every supported OS in systemd containers.
# Containers are privileged so nftables can be loaded into the container's own network namespace;
# settings that would reach the host kernel (sysctl, auditd, clock) are written but not applied (see converge.yml).
# Collections are installed beforehand: ansible-galaxy collection install -r requirements.yml
driver:
  name: docker
platforms:
  - name: debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups: [mgmt, container_hosts]
  - name: ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups: [app, container_hosts]
  - name: ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups: [data, container_hosts]
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  inventory:
    group_vars:
      all:
        firewall_mgmt_cidrs: [10.10.0.0/24, "fd00:10::/64"]
        firewall_rules:
          - { name: https, port: 443, sources: [any] }
          - { name: node-exporter, port: 9100, sources: [10.10.0.0/24] }
        firewall_published_container_ports:
          - { port: 443 }
        rbac_model_group_assignments:
          infra-team: [platform-admin]
          sre: [operator]
      container_hosts:
        os_hardening_ip_forward: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
