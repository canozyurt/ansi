---
# Each task is tagged with the checklist items it proves (tools/checklist.py reads these tags).
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read chrony configuration
      ansible.builtin.slurp:
        src: /etc/chrony/chrony.conf
      register: verify_chrony
      tags: [chk_log_03]

    - name: Time sync uses the configured sources and logs clock changes
      ansible.builtin.assert:
        that:
          - "'time.cloudflare.com' in (verify_chrony.content | b64decode)"
          - "'logchange' in (verify_chrony.content | b64decode)"
      tags: [chk_log_03]

    - name: Read the automatic update settings
      ansible.builtin.slurp:
        src: /etc/apt/apt.conf.d/20auto-upgrades
      register: verify_auto_upgrades
      tags: [chk_hrd_04]

    - name: Security updates install automatically
      ansible.builtin.assert:
        that: "'Unattended-Upgrade \"1\"' in (verify_auto_upgrades.content | b64decode)"
      tags: [chk_hrd_04]

    - name: Read audit rules
      ansible.builtin.slurp:
        src: /etc/audit/rules.d/50-compliance.rules
      register: verify_audit_rules
      tags: [chk_log_01]

    - name: Audit rules cover identity, privilege and SSH changes and are immutable
      ansible.builtin.assert:
        that:
          - "'-k identity' in (verify_audit_rules.content | b64decode)"
          - "'-k scope' in (verify_audit_rules.content | b64decode)"
          - "'-k sshd' in (verify_audit_rules.content | b64decode)"
          - "(verify_audit_rules.content | b64decode | trim).endswith('-e 2')"
      tags: [chk_log_01]

    - name: Read sysctl hardening
      ansible.builtin.slurp:
        src: /etc/sysctl.d/90-compliance.conf
      register: verify_sysctl
      tags: [chk_hrd_01]

    - name: Kernel hardening values are set
      ansible.builtin.assert:
        that:
          - "'kernel.randomize_va_space = 2' in (verify_sysctl.content | b64decode)"
          - "'net.ipv4.conf.all.accept_redirects = 0' in (verify_sysctl.content | b64decode)"
          - "'fs.suid_dumpable = 0' in (verify_sysctl.content | b64decode)"
      tags: [chk_hrd_01]

    - name: Check sudo configuration
      ansible.builtin.command: visudo -c
      changed_when: false
      tags: [chk_hrd_01]

    - name: Read effective sshd settings
      ansible.builtin.command: /usr/sbin/sshd -T -C user=nobody,host=localhost,addr=127.0.0.1
      register: verify_sshd
      changed_when: false
      tags: [chk_iam_06]

    - name: SSH allows no passwords and no root login
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in verify_sshd.stdout_lines"
          - "'permitrootlogin no' in verify_sshd.stdout_lines"
          - "'kbdinteractiveauthentication no' in verify_sshd.stdout_lines"
          - "'x11forwarding no' in verify_sshd.stdout_lines"
          - "'loglevel VERBOSE' in verify_sshd.stdout_lines"
          - verify_sshd.stdout_lines | select('match', '^ciphers .*cbc') | list | length == 0
      tags: [chk_iam_06]

    - name: Read the loaded firewall
      ansible.builtin.command: nft list table inet compliance
      register: verify_nft
      changed_when: false
      tags: [chk_net_01, chk_net_02]

    - name: Inbound traffic is denied by default and SSH is limited to management networks
      ansible.builtin.assert:
        that:
          - "'hook input priority filter; policy drop;' in verify_nft.stdout"
          - "'ip saddr @mgmt_v4 tcp dport 22 accept' in verify_nft.stdout"
          - "'10.10.0.0/24' in verify_nft.stdout"
          - "'tcp dport 443 accept' in verify_nft.stdout"
          - "'ip saddr 10.10.0.0/24 tcp dport 9100 accept' in verify_nft.stdout"
      tags: [chk_net_01, chk_net_02]

- name: Verify container hosts
  hosts: container_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Read the Docker daemon configuration
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: verify_daemon
      tags: [chk_hrd_03]

    - name: Docker daemon follows the CIS Docker Benchmark settings
      vars:
        verify_daemon_json: "{{ verify_daemon.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - not verify_daemon_json['icc']
          - verify_daemon_json['no-new-privileges']
          - verify_daemon_json['live-restore']
          - not verify_daemon_json['userland-proxy']
          - verify_daemon_json['log-driver'] == 'journald'
      tags: [chk_hrd_03]

    - name: Docker files are audited
      ansible.builtin.stat:
        path: /etc/audit/rules.d/60-docker.rules
      register: verify_docker_rules
      failed_when: not verify_docker_rules.stat.exists
      tags: [chk_hrd_03]
