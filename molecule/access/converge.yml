---
- name: Converge the baseline the access roles build on
  hosts: vpn:bastion:dns
  become: true
  pre_tasks:
    - name: Read the throwaway SSH user CA from the bastion
      ansible.builtin.slurp:
        src: /root/test_user_ca.pub
      delegate_to: "{{ groups['bastion'][0] }}"
      run_once: true
      register: converge_test_ca

    - name: Trust the throwaway CA
      ansible.builtin.set_fact:
        ssh_hardening_trusted_user_ca_keys: ["{{ converge_test_ca.content | b64decode | trim }}"]
  roles:
    - role: common
    - role: ssh_hardening
    - role: firewall

# The plays of playbooks/access.yml; the audit probe has no systemd and gets session_audit only.
- name: Record admin sessions and map SSH certificate principals
  hosts: vpn:bastion:dns:audit_probe
  become: true
  roles:
    - role: session_audit
    - role: admin_login

- name: Deploy the WireGuard VPN gateway
  hosts: vpn
  become: true
  roles:
    - role: wireguard_gateway

- name: Deploy the SSH jump host
  hosts: bastion
  become: true
  roles:
    - role: bastion

- name: Deploy the internal DNS resolver
  hosts: dns
  become: true
  roles:
    - role: dns_resolver

- name: Point the hosts at the internal resolver
  hosts: vpn:bastion:dns
  become: true
  roles:
    - role: dns_client
