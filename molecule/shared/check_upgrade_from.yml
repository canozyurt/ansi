---
# Shared by the *-upgrade scenarios: fail early and clearly when roles/versions has no previous
# release for the service (tools/release.py fills versions_upgrade_from when a release is cut).
- name: Check that versions_upgrade_from names the previous release
  hosts: all
  gather_facts: false
  tasks:
    - name: Load the pinned versions
      ansible.builtin.include_role:
        name: versions
        public: true

    - name: The previous release is pinned for every image of the service
      ansible.builtin.assert:
        that: check_upgrade_from_keys | reject('in', versions_upgrade_from) | list | length == 0
        fail_msg: >-
          versions_upgrade_from has no entry for {{ check_upgrade_from_keys | reject('in', versions_upgrade_from) | join(', ') }}.
          Cut a release with tools/release.py first (it copies the released versions into versions_upgrade_from).
        quiet: true
      tags: [chk_chg_07]
