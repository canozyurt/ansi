---
- name: Prepare the container hosts
  hosts: all
  become: true
  tasks:
    - name: Install the container runtime
      ansible.builtin.include_role:
        name: container_runtime

# Same as playbooks/postgres.yml, plus the test proxy for the Patroni download.
- name: Deploy the PostgreSQL cluster
  hosts: postgres
  become: true
  environment:
    https_proxy: "{{ lookup('ansible.builtin.env', 'MOLECULE_HTTPS_PROXY') }}"
    no_proxy: "127.0.0.1,localhost,postgres-ha-1,postgres-ha-2,postgres-ha-3"
  tasks:
    - name: Deploy each cluster this host belongs to
      ansible.builtin.include_role:
        name: postgres_cluster
      loop: "{{ postgres_clusters | selectattr('group', 'in', group_names) | list }}"
      loop_control:
        loop_var: postgres_cluster
        label: "{{ postgres_cluster.name }}"
