---
- name: Verify the upgraded backup server still meets its checklist items
  ansible.builtin.import_playbook: ../backup/verify.yml

- name: Verify the upgrade
  hosts: all
  become: true
  gather_facts: false
  vars:
    bundle: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/versions/defaults/main.yml') | from_yaml }}"
  tasks:
    - name: Inspect the upgraded container
      community.docker.docker_container_info:
        name: rest-server
      register: verify_upgraded
      tags: [chk_chg_07]

    - name: The rest-server container runs the version pinned by this release
      ansible.builtin.assert:
        that:
          - verify_upgraded.container.Config.Image == bundle.versions_images.rest_server
          - verify_upgraded.container.State.Running
      tags: [chk_chg_07]

    - name: List the sample snapshots through the upgraded server
      ansible.builtin.command:
        argv: [/usr/local/sbin/compliant-backup, snapshots, --name, sample, --json]
      register: verify_snapshots
      changed_when: false
      tags: [chk_chg_07, chk_bck_01]

    - name: The snapshots taken before the upgrade are still served
      ansible.builtin.assert:
        that: verify_snapshots.stdout | from_json | length >= 1
        fail_msg: "{{ verify_snapshots.stdout }}"
      tags: [chk_chg_07, chk_bck_01]

    - name: Read the pre-upgrade file list
      ansible.builtin.stat:
        path: /var/lib/compliant-backup-server/pre-upgrade-files.txt
      register: verify_file_list
      tags: [chk_chg_07]

    - name: The repositories were recorded before the version change
      ansible.builtin.assert:
        that: verify_file_list.stat.exists and verify_file_list.stat.size > 0
      tags: [chk_chg_07]
