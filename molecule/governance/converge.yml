---
- name: Converge
  hosts: all
  become: true
  environment:
    https_proxy: "{{ lookup('ansible.builtin.env', 'MOLECULE_HTTPS_PROXY') }}"
    no_proxy: "127.0.0.1,localhost"
  vars:
    molecule_https_proxy: "{{ lookup('ansible.builtin.env', 'MOLECULE_HTTPS_PROXY') }}"
    converge_ca_dir: /etc/molecule-ca
  pre_tasks:
    - name: Install the container runtime
      ansible.builtin.include_role:
        name: container_runtime

    - name: Route image pulls through the test proxy
      when: molecule_https_proxy | length > 0
      block:
        - name: Create the Docker service drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/system/docker.service.d
            state: directory
            mode: "0755"

        - name: Set the proxy for dockerd
          ansible.builtin.copy:
            content: |
              [Service]
              Environment="HTTPS_PROXY={{ molecule_https_proxy }}"
            dest: /etc/systemd/system/docker.service.d/proxy.conf
            mode: "0644"
          register: converge_docker_proxy

        - name: Restart Docker with the proxy
          ansible.builtin.systemd_service:
            name: docker
            state: restarted
            daemon_reload: true
          when: converge_docker_proxy.changed  # noqa: no-handler

    - name: Install Python libraries for certificate handling
      ansible.builtin.apt:
        name: [python3-cryptography]
        state: present

    - name: Create the test CA directory
      ansible.builtin.file:
        path: "{{ converge_ca_dir }}"
        state: directory
        mode: "0755"

    - name: Generate the test CA key
      community.crypto.openssl_privatekey:
        path: "{{ converge_ca_dir }}/ca.key"
        type: ECC
        curve: secp384r1
        mode: "0600"

    - name: Create the test CA signing request
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ converge_ca_dir }}/ca.key"
        common_name: Molecule governance test CA
        basic_constraints: [CA:TRUE]
        basic_constraints_critical: true
        key_usage: [keyCertSign, cRLSign]
        key_usage_critical: true
      register: converge_ca_csr
      changed_when: false

    - name: Self-sign the test CA
      community.crypto.x509_certificate:
        path: "{{ converge_ca_dir }}/ca.crt"
        csr_content: "{{ converge_ca_csr.csr }}"
        privatekey_path: "{{ converge_ca_dir }}/ca.key"
        provider: selfsigned
        mode: "0644"

    - name: Trust the test CA on the host (the status page checks use the host trust store)
      ansible.builtin.copy:
        src: "{{ converge_ca_dir }}/ca.crt"
        dest: /usr/local/share/ca-certificates/molecule-test-ca.crt
        remote_src: true
        mode: "0644"
      register: converge_ca_trust

    - name: Update the host trust store
      ansible.builtin.command: update-ca-certificates
      when: converge_ca_trust.changed  # noqa: no-handler
      changed_when: true

    - name: Generate the test endpoint key
      community.crypto.openssl_privatekey:
        path: "{{ converge_ca_dir }}/endpoint.key"
        type: ECC
        curve: secp384r1
        mode: "0600"

    - name: Create the test endpoint signing request
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ converge_ca_dir }}/endpoint.key"
        common_name: endpoint.test.internal
        subject_alt_name: [DNS:endpoint.test.internal, IP:127.0.0.1]
      register: converge_endpoint_csr
      changed_when: false

    - name: Sign the test endpoint certificate
      community.crypto.x509_certificate:
        path: "{{ converge_ca_dir }}/endpoint.crt"
        csr_content: "{{ converge_endpoint_csr.csr }}"
        provider: ownca
        ownca_path: "{{ converge_ca_dir }}/ca.crt"
        ownca_privatekey_path: "{{ converge_ca_dir }}/ca.key"
        ownca_not_after: +90d
        mode: "0644"

    - name: Install the test HTTPS endpoint
      ansible.builtin.copy:
        dest: /usr/local/bin/test-https-endpoint
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          """Answers 200 on /health over TLS (stands in for a public service)."""
          import http.server
          import ssl

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  code = 200 if self.path == "/health" else 404
                  body = b'{"status":"UP"}' if code == 200 else b"not found"
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.minimum_version = ssl.TLSVersion.TLSv1_2
          ctx.load_cert_chain("{{ converge_ca_dir }}/endpoint.crt", "{{ converge_ca_dir }}/endpoint.key")
          server = http.server.ThreadingHTTPServer(("127.0.0.1", 9443), Handler)
          server.socket = ctx.wrap_socket(server.socket, server_side=True)
          server.serve_forever()

    - name: Run the test HTTPS endpoint as a service
      ansible.builtin.copy:
        dest: /etc/systemd/system/test-https-endpoint.service
        mode: "0644"
        content: |
          [Unit]
          Description=Test HTTPS endpoint for the status page
          [Service]
          ExecStart=/usr/local/bin/test-https-endpoint
          Restart=always
          [Install]
          WantedBy=multi-user.target

    - name: Start the test HTTPS endpoint
      ansible.builtin.systemd_service:
        name: test-https-endpoint
        state: started
        enabled: true
        daemon_reload: true

    - name: Start a throwaway PostgreSQL for the GRC tool
      community.docker.docker_container:
        name: postgres
        image: docker.io/library/postgres:17
        network_mode: host
        env:
          POSTGRES_DB: grc
          POSTGRES_USER: grc
          POSTGRES_PASSWORD: test-only-db-password
        state: started

    - name: Wait for PostgreSQL
      ansible.builtin.wait_for:
        port: 5432
        timeout: 120

  roles:
    - role: status_page
    - role: grc
