---
- name: Prepare the test host
  ansible.builtin.import_playbook: ../default/prepare.yml

- name: Check that the previous release is known
  ansible.builtin.import_playbook: ../shared/check_upgrade_from.yml
  vars:
    check_upgrade_from_keys: [wazuh_indexer, wazuh_manager, wazuh_dashboard]

# Indexer, manager, dashboard and agent move together: the agent of the previous release has the
# manager's version (agents may not be newer than the manager).
- name: Install the previous release
  ansible.builtin.import_playbook: ../siem/converge.yml
  vars:
    wazuh_indexer_image: "{{ versions_upgrade_from.wazuh_indexer }}"
    wazuh_manager_image: "{{ versions_upgrade_from.wazuh_manager }}"
    wazuh_dashboard_image: "{{ versions_upgrade_from.wazuh_dashboard }}"
    wazuh_agent_version: "{{ versions_upgrade_from.wazuh_manager.split(':') | last }}-1"
