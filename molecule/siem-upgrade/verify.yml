---
- name: Verify the upgraded SIEM still meets its checklist items
  ansible.builtin.import_playbook: ../siem/verify.yml

- name: Verify the upgrade
  hosts: all
  become: true
  gather_facts: false
  vars:
    bundle: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/versions/defaults/main.yml') | from_yaml }}"
  tasks:
    - name: Inspect the upgraded containers
      community.docker.docker_container_info:
        name: "{{ item.container }}"
      loop:
        - { container: wazuh-indexer, image: "{{ bundle.versions_images.wazuh_indexer }}" }
        - { container: wazuh-manager, image: "{{ bundle.versions_images.wazuh_manager }}" }
        - { container: wazuh-dashboard, image: "{{ bundle.versions_images.wazuh_dashboard }}" }
      loop_control:
        label: "{{ item.container }}"
      register: verify_upgraded
      tags: [chk_chg_07]

    - name: Every container runs the version pinned by this release
      ansible.builtin.assert:
        that:
          - item.container.Config.Image == item.item.image
          - item.container.State.Running
        fail_msg: "{{ item.item.container }} runs {{ item.container.Config.Image | default('nothing') }}, expected {{ item.item.image }}"
      loop: "{{ verify_upgraded.results }}"
      loop_control:
        label: "{{ item.item.container }}"
      tags: [chk_chg_07]

    - name: Read the installed agent version
      ansible.builtin.command:
        argv: [dpkg-query, "--showformat=${Version}", --show, wazuh-agent]
      register: verify_agent_version
      changed_when: false
      tags: [chk_chg_07]

    - name: The agent was upgraded to the pinned package and is still held
      ansible.builtin.assert:
        that: verify_agent_version.stdout == bundle.versions_packages.wazuh_agent
        fail_msg: "wazuh-agent {{ verify_agent_version.stdout }}, expected {{ bundle.versions_packages.wazuh_agent }}"
      tags: [chk_chg_07]

    - name: Find the manager's pre-upgrade archive
      ansible.builtin.find:
        paths: /var/backups/wazuh-manager
        patterns: wazuh-manager-*.tar.gz
      register: verify_manager_backup
      tags: [chk_chg_07, chk_bck_01]

    - name: The manager state was archived before the version change
      ansible.builtin.assert:
        that: verify_manager_backup.matched >= 1
      tags: [chk_chg_07, chk_bck_01]
