---
- name: Verify the upgraded service still meets its checklist items
  ansible.builtin.import_playbook: ../garage/verify.yml

- name: Verify the upgrade
  hosts: all
  become: true
  gather_facts: false
  vars:
    bundle: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/versions/defaults/main.yml') | from_yaml }}"
  tasks:
    - name: Inspect the upgraded containers
      community.docker.docker_container_info:
        name: "{{ item.container }}"
      loop:
        - { container: s3-lab-garage, image: "{{ bundle.versions_images.garage }}" }
        - { container: s3-lab-garage-tls, image: "{{ bundle.versions_images.haproxy }}" }
      loop_control:
        label: "{{ item.container }}"
      register: verify_upgraded
      tags: [chk_chg_07]

    - name: Every container runs the version pinned by this release
      ansible.builtin.assert:
        that:
          - item.container.Config.Image == item.item.image
          - item.container.State.Running
        fail_msg: "{{ item.item.container }} runs {{ item.container.Config.Image | default('nothing') }}, expected {{ item.item.image }}"
      loop: "{{ verify_upgraded.results }}"
      loop_control:
        label: "{{ item.item.container }}"
      tags: [chk_chg_07]

    - name: Read the object stored before the upgrade
      ansible.builtin.command:
        argv: [/usr/local/bin/s3_probe.py, GET, https://127.0.0.1:3900/orders-files/upgrade-marker.txt, garage,
               /opt/garage/s3-lab/tls/tls.crt]
      environment:
        AWS_ACCESS_KEY_ID: GK3bcabd5f1d6668823225ba40
        AWS_SECRET_ACCESS_KEY: e6dcf76321bc8f746c960f556d695cc092876274a43767f65aac250e5e1362a8
      register: verify_get
      changed_when: false
      tags: [chk_chg_07]

    - name: The object survived the upgrade
      ansible.builtin.assert:
        that: verify_get.stdout == '200 written-before-upgrade'
        fail_msg: "{{ verify_get.stdout }}"
      tags: [chk_chg_07]

    - name: Find the metadata snapshots
      ansible.builtin.find:
        paths: /opt/garage/s3-lab/snapshots
        recurse: true
        file_type: file
      register: verify_snapshots
      tags: [chk_chg_07, chk_bck_01]

    - name: A metadata snapshot was taken before the version change
      ansible.builtin.assert:
        that: verify_snapshots.matched > 0
      tags: [chk_chg_07, chk_bck_01]
