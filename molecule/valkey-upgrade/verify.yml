---
- name: Verify the upgraded service still meets its checklist items
  ansible.builtin.import_playbook: ../valkey/verify.yml

- name: Verify the upgrade
  hosts: all
  become: true
  gather_facts: false
  vars:
    bundle: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/versions/defaults/main.yml') | from_yaml }}"
  tasks:
    - name: Inspect the upgraded containers
      community.docker.docker_container_info:
        name: "{{ item.container }}"
      loop:
        - { container: cache-lab-valkey, image: "{{ bundle.versions_images.valkey }}" }
        - { container: cache-lab-sentinel, image: "{{ bundle.versions_images.valkey }}" }
        - { container: cache-lab-exporter, image: "{{ bundle.versions_images.redis_exporter }}" }
      loop_control:
        label: "{{ item.container }}"
      register: verify_upgraded
      tags: [chk_chg_07]

    - name: Every container runs the version pinned by this release
      ansible.builtin.assert:
        that:
          - item.container.Config.Image == item.item.image
          - item.container.State.Running
        fail_msg: "{{ item.item.container }} runs {{ item.container.Config.Image | default('nothing') }}, expected {{ item.item.image }}"
      loop: "{{ verify_upgraded.results }}"
      loop_control:
        label: "{{ item.item.container }}"
      tags: [chk_chg_07]

    - name: Read the marker key written before the upgrade
      community.docker.docker_container_exec:
        container: cache-lab-valkey
        argv: [valkey-cli, --tls, --cacert, /tls/ca-bundle.crt, -h, 127.0.0.1, --no-auth-warning,
               -p, "6379", --user, admin, GET, "upgrade:marker"]
        env: { REDISCLI_AUTH: test-only-valkey-admin-pw }
      register: verify_marker
      changed_when: false
      tags: [chk_chg_07]

    - name: The data survived the upgrade
      ansible.builtin.assert:
        that: verify_marker.stdout | trim == 'written-before-upgrade'
      tags: [chk_chg_07]

    - name: Find the pre-upgrade RDB snapshot
      ansible.builtin.stat:
        path: /opt/valkey/cache-lab/backup/dump.rdb
      register: verify_rdb
      tags: [chk_chg_07, chk_bck_01]

    - name: A snapshot was taken before the version change
      ansible.builtin.assert:
        that: verify_rdb.stat.exists and verify_rdb.stat.size > 0
      tags: [chk_chg_07, chk_bck_01]
