---
- name: Verify the upgraded service still meets its checklist items
  ansible.builtin.import_playbook: ../forgejo/verify.yml

- name: Verify the upgrade
  hosts: all
  become: true
  gather_facts: false
  vars:
    bundle: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/versions/defaults/main.yml') | from_yaml }}"
  tasks:
    - name: Inspect the upgraded containers
      community.docker.docker_container_info:
        name: "{{ item.container }}"
      loop:
        - { container: forgejo, image: "{{ bundle.versions_images.forgejo }}" }
      loop_control:
        label: "{{ item.container }}"
      register: verify_upgraded
      tags: [chk_chg_07]

    - name: Every container runs the version pinned by this release
      ansible.builtin.assert:
        that:
          - item.container.Config.Image == item.item.image
          - item.container.State.Running
        fail_msg: "{{ item.item.container }} runs {{ item.container.Config.Image | default('nothing') }}, expected {{ item.item.image }}"
      loop: "{{ verify_upgraded.results }}"
      loop_control:
        label: "{{ item.item.container }}"
      tags: [chk_chg_07]

    - name: Find the pre-upgrade dump
      ansible.builtin.stat:
        path: /var/backups/forgejo/forgejo-dump.tar.gz
      register: verify_forgejo_dump
      tags: [chk_chg_07]

    - name: Forgejo was dumped before the new version migrated the database
      ansible.builtin.assert:
        that:
          - verify_forgejo_dump.stat.exists
          - verify_forgejo_dump.stat.size > 1000
      tags: [chk_chg_07]
