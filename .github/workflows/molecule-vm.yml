---
# Molecule on the self-hosted test runner (a disposable VM with Docker). Runs every scenario on the default
# platform image, one job at a time, without waiting for the lint job. Manual or on push to claude/* branches.
name: Molecule (self-hosted)

on:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/molecule-vm.yml"
      - "roles/**"
      - "molecule/**"
      - "playbooks/**"
      - "plugins/**"
      - "requirements*.yml"
      - "requirements-dev.txt"
  workflow_dispatch:
    inputs:
      distro:
        description: Platform image for the service scenarios
        default: ubuntu2404

permissions:
  contents: read

env:
  MOLECULE_DISTRO: ${{ inputs.distro || 'ubuntu2404' }}
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  scenario:
    name: Molecule ${{ matrix.scenario }}
    runs-on: self-hosted
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario:
          - default
          - keycloak
          - keycloak-upgrade
          - monitoring
          - monitoring-upgrade
          - edge
          - edge-upgrade
          - backup
          - backup-upgrade
          - openbao
          - openbao-upgrade
          - access
          - security_scanning
          - governance
          - governance-upgrade
          - forgejo
          - forgejo-upgrade
          - postgres
          - postgres-upgrade
          - siem
          - siem-upgrade
          - registry
          - registry-upgrade
          - mail_relay
          - valkey
          - valkey-upgrade
          - rabbitmq
          - rabbitmq-upgrade
          - garage
          - garage-upgrade
          - keycloak-ha
          - openbao-ha
          - postgres-ha
    steps:
      # The test containers run Docker inside, on anonymous volumes; drop what earlier jobs left behind.
      - name: Free disk space from earlier scenarios
        run: |
          docker container prune -f >/dev/null
          docker volume prune -af >/dev/null
          df -h / | tail -1

      - uses: actions/checkout@v4

      - name: Runner environment
        run: |
          . /etc/os-release && echo "$PRETTY_NAME"
          python3 --version
          docker version --format 'docker {{.Server.Version}}'
          nproc; free -h | head -2; df -h / | tail -1

      # The runner's own Python may be newer than ansible-core supports; uv brings the CI version.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"

      - name: Install tools in a virtualenv
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install -q -r requirements-dev.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Check the upgrade path exists
        id: upgrade_path
        run: |
          rc=0
          python3 tools/release.py has-upgrade-path "${{ matrix.scenario }}" || rc=$?
          case "$rc" in
            0) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "::notice::${{ matrix.scenario }}: no previous release in versions_upgrade_from yet; skipped"
               echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - name: molecule test -s ${{ matrix.scenario }}
        if: steps.upgrade_path.outputs.skip != 'true'
        run: molecule test -s ${{ matrix.scenario }} --destroy never

      # Containers are kept on failure so the failed units can be read before the cleanup step.
      - name: Failed systemd units in the test containers
        if: failure()
        run: |
          for c in $(docker ps --format '{{.Names}}'); do
            echo "::group::$c"
            docker exec "$c" systemctl --failed --no-legend --plain 2>/dev/null | awk '{print $1}' | while read -r unit; do
              [ -n "$unit" ] || continue
              echo "--- $unit"
              docker exec "$c" journalctl -u "$unit" --no-pager -n 40 2>/dev/null || true
            done
            # Certificates the services present and the bundles they trust (fingerprints only).
            docker exec "$c" sh -c 'command -v openssl >/dev/null || exit 0
              for f in $(find /opt /etc/compliant-infra -name tls.crt -o -name ca-bundle.crt 2>/dev/null); do
                echo "--- $f"
                awk "/BEGIN/{c=\"openssl x509 -noout -subject -fingerprint -sha256\"} {print | c} /END/{close(c)}" "$f"
              done' 2>/dev/null || true
            # Service containers inside the test container: their recent errors.
            docker exec "$c" sh -c 'command -v docker' >/dev/null 2>&1 || { echo "::endgroup::"; continue; }
            for s in $(docker exec "$c" docker ps -a --format '{{.Names}}' 2>/dev/null); do
              echo "--- container $s"
              docker exec "$c" docker logs --tail 300 "$s" 2>&1 | grep -iE 'error|fatal|panic|fail' | tail -n 15 || true
            done
            echo "::endgroup::"
          done
          # Mandatory access control denials on the runner host (its profiles also apply in the containers).
          echo "::group::AppArmor denials on the runner"
          journalctl -k --since "-30 min" --no-pager 2>/dev/null | grep 'apparmor="DENIED"' | tail -n 20 || true
          echo "::endgroup::"

      - name: Clean up leftover containers
        if: always()
        run: |
          if command -v molecule >/dev/null; then molecule destroy -s ${{ matrix.scenario }} || true; fi
          docker container prune -f >/dev/null
          docker volume prune -af >/dev/null
