---
# Molecule on the self-hosted test runner (a disposable VM with Docker). Runs every scenario on the default
# platform image, one job at a time, without waiting for the lint job. Manual or on push to claude/* branches.
name: Molecule (self-hosted)

on:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/molecule-vm.yml"
      - "roles/**"
      - "molecule/**"
      - "playbooks/**"
      - "plugins/**"
      - "requirements*.yml"
      - "requirements-dev.txt"
  workflow_dispatch:
    inputs:
      distro:
        description: Platform image for the service scenarios
        default: ubuntu2404

permissions:
  contents: read

concurrency:
  group: molecule-vm-${{ github.ref }}
  cancel-in-progress: true

env:
  MOLECULE_DISTRO: ${{ inputs.distro || 'ubuntu2404' }}
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  scenario:
    name: Molecule ${{ matrix.scenario }}
    runs-on: self-hosted
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario:
          - default
          - keycloak
          - keycloak-upgrade
          - monitoring
          - monitoring-upgrade
          - edge
          - edge-upgrade
          - backup
          - backup-upgrade
          - openbao
          - openbao-upgrade
          - access
          - security_scanning
          - governance
          - governance-upgrade
          - forgejo
          - forgejo-upgrade
          - postgres
          - postgres-upgrade
          - siem
          - siem-upgrade
          - registry
          - registry-upgrade
          - mail_relay
          - valkey
          - valkey-upgrade
          - rabbitmq
          - rabbitmq-upgrade
          - garage
          - garage-upgrade
          - keycloak-ha
          - openbao-ha
          - postgres-ha
    steps:
      - uses: actions/checkout@v4

      - name: Runner environment
        run: |
          . /etc/os-release && echo "$PRETTY_NAME"
          python3 --version
          docker version --format 'docker {{.Server.Version}}'
          nproc; free -h | head -2; df -h / | tail -1

      - name: Install tools in a virtualenv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r requirements-dev.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Check the upgrade path exists
        id: upgrade_path
        run: |
          rc=0
          python3 tools/release.py has-upgrade-path "${{ matrix.scenario }}" || rc=$?
          case "$rc" in
            0) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "::notice::${{ matrix.scenario }}: no previous release in versions_upgrade_from yet; skipped"
               echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - name: molecule test -s ${{ matrix.scenario }}
        if: steps.upgrade_path.outputs.skip != 'true'
        run: molecule test -s ${{ matrix.scenario }}

      - name: Clean up leftover containers
        if: always()
        run: |
          molecule destroy -s ${{ matrix.scenario }} || true
          docker container prune -f >/dev/null
