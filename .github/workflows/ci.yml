---
# Every pull request must pass this workflow before merge (CHG-01, CHG-06, EVD-01).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # weekly re-run catches upstream image and package changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and checklist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      # SEC-01: whole git history, with the allowlist for placeholders in .gitleaks.toml.
      - name: Secret scan of the git history (gitleaks) [chk_sec_01]
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

      - name: Vault variables are encrypted [chk_sec_01]
        run: python3 tools/vault_check.py

      - name: Versions, collections and downloads are pinned [chk_chg_05]
        run: python3 tools/pins.py

      - name: Container policy (non-root, no capabilities, read-only, limits) [chk_hrd_02]
        run: python3 tools/container_policy.py --report

      - name: Inventories keep environments apart [chk_chg_04]
        run: python3 tools/inventory_lint.py

      - name: Every adopted tool is reviewed for licence, SSO, audit log and HA [chk_evd_04]
        run: python3 tools/tool_registry.py

      # IAM-03 / IAM-09: access goes to roles (IdP groups), never to a username; the role matrix matches the code.
      - name: No access granted to individual users [chk_iam_03]
        run: python3 tools/rbac_lint.py --report

      - name: Role matrix matches the role mappings in the code [chk_iam_09]
        run: |
          python3 tools/role_matrix.py
          { echo "## Role matrix (IAM-09)"; python3 tools/role_matrix.py --md | grep '^|'; } >> "$GITHUB_STEP_SUMMARY"

      # Documents every release must keep current: DR runbooks and rebuild order (HA-02), the
      # shared-responsibility matrix against ISO 27017 (DAT-03), every upgrade scenario in CI (CHG-07).
      - name: Release documents are complete [chk_ha_02] [chk_dat_03] [chk_chg_07]
        run: python3 tools/release.py check

      - name: Self-tests of the CI gates
        run: python3 -m unittest discover -s tools/tests -v

      - name: yamllint
        run: yamllint -s .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: ansible-playbook --syntax-check playbooks/site.yml

      # EVD-01: fails when a status claims more than the code backs, and when a Core item marked
      # verified has no tagged verify task. Core items marked implemented without a test are warnings
      # until Molecule runs again; then add --strict-core (see compliance/checklist.yml, EVD-01).
      - name: Checklist status matches the code; Core items have tests [chk_evd_01]
        run: python3 tools/checklist.py check

      - name: Checklist coverage report
        run: |
          {
            echo "## Compliance checklist"
            python3 tools/checklist.py report --md
            echo "## Test coverage"
            python3 tools/checklist.py coverage --md
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Image SBOM and vulnerability scan
    needs: lint
    runs-on: ubuntu-24.04
    env:
      # Pinned tools (CHG-05). Trivy comes from roles/versions (pinned by digest); syft is CI-only.
      SYFT_IMAGE: docker.io/anchore/syft:v1.18.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install PyYAML==6.0.2

      - name: List the pinned images
        run: |
          python3 tools/pins.py --list-images > images.txt
          trivy=$(python3 -c 'import yaml; print(yaml.safe_load(open("roles/versions/defaults/main.yml"))["versions_images"]["trivy"])')
          echo "TRIVY_IMAGE=$trivy" >> "$GITHUB_ENV"
          cat images.txt

      - name: SBOM of every pinned image and of the repository (syft) [chk_chg_05]
        run: |
          mkdir -p sbom
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs=/tmp --env=HOME=/tmp -v "$PWD:/work" -w /work "$SYFT_IMAGE" \
            dir:/work --exclude ./sbom --exclude ./trivy -o spdx-json=/work/sbom/repository.spdx.json
          while read -r image; do
            out="sbom/$(echo "$image" | tr '/:@' '___').spdx.json"
            docker run --rm --user "$(id -u):$(id -g)" --tmpfs=/tmp --env=HOME=/tmp -v "$PWD:/work" "$SYFT_IMAGE" \
              "registry:$image" -o "spdx-json=/work/$out"
          done < images.txt

      # Vulnerabilities (CRITICAL blocks unless waived in compliance/vuln-waivers.yml) and secrets baked
      # into image layers (SEC-01). Images are pulled from their registries, no Docker daemon access.
      - name: Scan pinned images for vulnerabilities and secrets (Trivy) [chk_chg_05] [chk_sec_01]
        run: |
          mkdir -p trivy
          while read -r image; do
            out="trivy/$(echo "$image" | tr '/:@' '___').json"
            docker run --rm -v trivy-cache:/root/.cache/trivy -v "$PWD:/work" "$TRIVY_IMAGE" \
              image --image-src remote --scanners vuln,secret --format json --output "/work/$out" "$image"
          done < images.txt

      - name: Gate on CRITICAL findings and secrets (waivers with reason and expiry) [chk_chg_05]
        run: python3 tools/trivy_gate.py trivy/*.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the SBOMs and scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-image-scan-${{ github.sha }}
          path: |
            sbom/
            trivy/
            images.txt
          retention-days: 90

  molecule:
    name: Molecule ${{ matrix.platform }}
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [debian12, ubuntu2204, ubuntu2404]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Converge, idempotence and verify (CHG-06)
        run: molecule test --platform-name ${{ matrix.platform }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  # Every service scenario on every supported OS (CHG-06): the scenarios take their platform image from
  # MOLECULE_DISTRO (molecule/<scenario>/molecule.yml), so the matrix below is the shared platform list.
  molecule-services:
    name: Molecule ${{ matrix.scenario }} (${{ matrix.distro }})
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [debian12, ubuntu2204, ubuntu2404]
        scenario:
          - keycloak
          - keycloak-upgrade
          - monitoring
          - monitoring-upgrade
          - edge
          - edge-upgrade
          - backup
          - backup-upgrade
          - openbao
          - openbao-upgrade
          - access
          - security_scanning
          - governance
          - governance-upgrade
          - forgejo
          - forgejo-upgrade
          - postgres
          - postgres-upgrade
          - siem
          - siem-upgrade
          - registry
          - registry-upgrade
          - mail_relay
          - valkey
          - valkey-upgrade
          - rabbitmq
          - rabbitmq-upgrade
          - garage
          - garage-upgrade
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      # An upgrade scenario needs the previous release in versions_upgrade_from (CHG-07); until the
      # first release that includes the service, there is nothing to upgrade from.
      - name: Check the upgrade path exists
        id: upgrade_path
        run: |
          rc=0
          python3 tools/release.py has-upgrade-path "${{ matrix.scenario }}" || rc=$?
          case "$rc" in
            0) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "::notice::${{ matrix.scenario }}: no previous release in versions_upgrade_from yet; skipped"
               echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - name: Deploy, idempotence and verify [chk_chg_06]
        if: steps.upgrade_path.outputs.skip != 'true'
        run: molecule test -s ${{ matrix.scenario }}
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
