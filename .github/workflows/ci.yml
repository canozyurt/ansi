---
# Every pull request must pass this workflow before merge (CHG-01, CHG-06, EVD-01).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # weekly re-run catches upstream image and package changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and checklist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Secret scan (SEC-01)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source /repo --redact --verbose

      - name: yamllint
        run: yamllint -s .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: ansible-playbook --syntax-check playbooks/site.yml

      - name: Checklist status matches the code (EVD-01)
        run: python3 tools/checklist.py check

      - name: Checklist coverage report
        run: |
          {
            echo "## Compliance checklist"
            python3 tools/checklist.py report --md
          } >> "$GITHUB_STEP_SUMMARY"

  molecule:
    name: Molecule ${{ matrix.platform }}
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [debian12, ubuntu2204, ubuntu2404]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Converge, idempotence and verify (CHG-06)
        run: molecule test --platform-name ${{ matrix.platform }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  molecule-services:
    name: Molecule ${{ matrix.scenario }}
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - keycloak
          - keycloak-upgrade
          - monitoring
          - monitoring-upgrade
          - edge
          - edge-upgrade
          - backup
          - openbao
          - openbao-upgrade
          - access
          - security_scanning
          - governance
          - forgejo
          - forgejo-upgrade
          - postgres
          - postgres-upgrade
          - siem
          - registry
          - mail_relay
          - valkey
          - rabbitmq
          - garage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      # An upgrade scenario needs the previous release in versions_upgrade_from (CHG-07); until the
      # first release that includes the service, there is nothing to upgrade from.
      - name: Check the upgrade path exists
        id: upgrade_path
        run: |
          rc=0
          python3 tools/release.py has-upgrade-path "${{ matrix.scenario }}" || rc=$?
          case "$rc" in
            0) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "::notice::${{ matrix.scenario }}: no previous release in versions_upgrade_from yet; skipped"
               echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - name: Deploy, idempotence and verify
        if: steps.upgrade_path.outputs.skip != 'true'
        run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
