---
# Every pull request must pass this workflow before merge (CHG-01, CHG-06, EVD-01).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # weekly re-run catches upstream image and package changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and checklist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Secret scan (SEC-01)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source /repo --redact --verbose

      - name: yamllint
        run: yamllint -s .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: ansible-playbook --syntax-check playbooks/site.yml

      - name: Checklist status matches the code (EVD-01)
        run: python3 tools/checklist.py check

      - name: Checklist coverage report
        run: |
          {
            echo "## Compliance checklist"
            python3 tools/checklist.py report --md
          } >> "$GITHUB_STEP_SUMMARY"

  molecule:
    name: Molecule ${{ matrix.platform }}
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [debian12, ubuntu2204, ubuntu2404]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Converge, idempotence and verify (CHG-06)
        run: molecule test --platform-name ${{ matrix.platform }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  molecule-services:
    name: Molecule ${{ matrix.scenario }}
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: [keycloak, keycloak-upgrade, monitoring, edge, backup, openbao, openbao-upgrade, access, security_scanning]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Deploy, idempotence and verify
        run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
