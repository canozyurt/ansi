---
# Benchmark scans in CI (HRD-01, HRD-03), weekly and on changes to the hardening roles: the host
# baseline is applied to a test container of each supported release (molecule/audits), then the
# OpenSCAP CIS Level 1 scan (roles/cis_audit) and the CIS Docker Benchmark check (roles/docker_bench)
# run there with the same scripts as on the hosts. Results go to the job summary; the evidence
# (XCCDF/ARF/HTML, docker-bench JSON) is kept as a build artifact. A failed scan fails the job;
# failed rules are reported, not fatal, because the test container is not a full host (no separate
# partitions, no bootloader). Production hosts are scanned weekly by the timers; their results are
# alerted on (CISScoreDropped, CISRuleRegressed, DockerBenchWarnings) and archived in the evidence store.
#
# Ubuntu 24.04 (CIS) and the Docker benchmark need the release pins in roles/versions
# (versions_tools.scap_security_guide, versions_tools.docker_bench_security; see the comment there):
# until their SHA-256 sums are recorded those jobs fail with that message. Not run yet (not tested).
name: Audits

on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - roles/cis_audit/**
      - roles/docker_bench/**
      - roles/common/**
      - roles/os_hardening/**
      - roles/ssh_hardening/**
      - roles/container_runtime/**
      - molecule/audits/**
      - .github/workflows/audits.yml

permissions:
  contents: read

jobs:
  cis:
    name: CIS scan ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [debian12, ubuntu2204, ubuntu2404]
    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      MOLECULE_DOCKER_BENCH: "false"
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          # Galaxy sometimes cuts a download short or times out, so try three times.
          for i in 1 2 3; do ansible-galaxy collection install -r requirements.yml && break; [ "$i" = 3 ] && exit 1; sleep 20; done

      - name: Apply the baseline and run the OpenSCAP CIS scan [chk_hrd_01]
        run: |
          molecule create -s audits
          molecule prepare -s audits
          molecule converge -s audits
          molecule verify -s audits

      - name: Collect the evidence [chk_hrd_01]
        if: always()
        run: |
          mkdir -p evidence
          docker cp "audits-${MOLECULE_DISTRO}:/var/lib/compliance-evidence/." evidence/ || true
          {
            echo "## CIS Level 1 scan (${MOLECULE_DISTRO})"
            find evidence/cis -name summary.json -print0 | xargs -0 -r python3 tools/audit_summary.py cis
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cis-${{ matrix.distro }}-${{ github.run_id }}
          path: evidence/
          retention-days: 90
          if-no-files-found: warn

      - name: Remove the test container
        if: always()
        run: molecule destroy -s audits

  docker-bench:
    name: CIS Docker Benchmark
    runs-on: ubuntu-24.04
    env:
      MOLECULE_DISTRO: ubuntu2404
      MOLECULE_DOCKER_BENCH: "true"
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          # Galaxy sometimes cuts a download short or times out, so try three times.
          for i in 1 2 3; do ansible-galaxy collection install -r requirements.yml && break; [ "$i" = 3 ] && exit 1; sleep 20; done

      - name: Deploy the hardened Docker daemon and run docker-bench-security [chk_hrd_03]
        run: |
          molecule create -s audits
          molecule prepare -s audits
          molecule converge -s audits
          molecule verify -s audits

      - name: Collect the evidence [chk_hrd_03]
        if: always()
        run: |
          mkdir -p evidence
          docker cp "audits-${MOLECULE_DISTRO}:/var/lib/compliance-evidence/." evidence/ || true
          {
            echo "## CIS Docker Benchmark"
            find evidence/docker-bench -name summary.json -print0 | xargs -0 -r python3 tools/audit_summary.py docker-bench
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-bench-${{ github.run_id }}
          path: evidence/
          retention-days: 90
          if-no-files-found: warn

      - name: Remove the test container
        if: always()
        run: molecule destroy -s audits
