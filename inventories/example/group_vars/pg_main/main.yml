---
# Cluster pg-main (postgres_clusters in group_vars/all/postgres.yml). Each cluster declares its own
# firewall rules (NET-01, NET-03, DAT-01): clients reach only HAProxy; PostgreSQL, Patroni and etcd
# only from the data zone (the other members), metrics only from the monitoring hosts. Clients in the
# mgmt zone are named hosts (Keycloak, Forgejo, GRC) plus the VPN/bastion ranges, never the whole zone (NET-02).
firewall_rules_postgres_pg_main:
  - name: pg-main-clients
    port: 5000-5001
    class: database
    sources: "{{ [network_zones.app] + network_mgmt_datastore_client_cidrs + firewall_mgmt_cidrs }}"
  - { name: pg-main-postgres, port: 5432, class: database, sources: ["{{ network_zones.data }}"] }
  # Patroni REST API (switchover, configuration): members, Prometheus and administrators only.
  - name: pg-main-patroni-api
    port: 8008
    class: admin
    sources: "{{ [network_zones.data] + monitoring_source_cidrs + firewall_mgmt_cidrs }}"
  - { name: pg-main-etcd, port: 2379-2380, class: database, sources: ["{{ network_zones.data }}"] }
  - { name: pg-main-exporter, port: 9187, class: metrics, sources: "{{ monitoring_source_cidrs }}" }
