---
# Compliance audits and change control (docs/audits.md).

# CHG-02: production changes run only from CI. Once the SSH user CA is trusted
# (ssh_hardening_trusted_user_ca_keys), the deploy account accepts only the CI's certificate
# (principal ci-deploy, signed through the OpenBao ci-deploy AppRole) and may use sudo only in such
# a session; people keep read-only logins, and the break-glass account (principal break-glass,
# admin policy only) has sudo and alerts on every login.
# Runs from anywhere but CI only stage this (CIOnlyDeploysNotEnforced fires); the first run that logs in
# with the CI's certificate enforces it, so a run from your machine cannot lock you out.
ci_only_deploys: true
# Same as ansible_user (all/main.yml), but not derived from it: a break-glass run
# (-e ansible_user=break-glass) must not retarget the CI-only settings to the break-glass account.
ci_deploy_user: deploy

# EVD-02: every host appends /var/lib/compliance-evidence weekly to the evidence repository on the
# backup servers (roles/evidence_store; credentials derive from backup_password_seed).
