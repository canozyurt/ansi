---
# Prometheus, Alertmanager, blackbox_exporter and Grafana (playbooks/monitoring.yml).
# Keep secrets out of plain text: ansible-vault encrypt_string, or look them up from the secrets manager.

# Grafana's account on the Prometheus API.
monitoring_grafana_user: grafana
monitoring_grafana_password: "{{ vault_monitoring_grafana_password }}"

prometheus_retention_days: 30
# Endpoints outside the inventory whose certificates must be watched (SEC-05).
blackbox_extra_targets: []
#  - www.example.com:443

alertmanager_smtp_smarthost: smtp.example.internal:587
alertmanager_smtp_from: alerts@example.com
alertmanager_smtp_auth_username: alerts@example.com
alertmanager_smtp_auth_password: "{{ vault_alertmanager_smtp_password }}"
alertmanager_email_to: [ops@example.com]
alertmanager_critical_email_to: [oncall@example.com]
alertmanager_webhook_url: ""
alertmanager_heartbeat_webhook_url: ""

grafana_root_url: https://grafana.example.internal
grafana_admin_password: "{{ vault_grafana_admin_password }}"
grafana_secret_key: "{{ vault_grafana_secret_key }}"
grafana_oidc_client_secret: "{{ vault_grafana_oidc_client_secret }}"

# Prometheus and Alertmanager UIs/APIs only from the VPN/bastion ranges and the monitoring hosts
# (Grafana, peers, scrapes), never the whole mgmt zone; Grafana also from the edge proxy (app zone);
# gossip only between members (NET-02, NET-03). If Wazuh sends to Alertmanager
# (monitoring_alertmanager_url), add network_siem_host_cidrs to alertmanager-https.
firewall_rules_prometheus:
  - { name: prometheus-https, port: 9090, class: admin, sources: "{{ firewall_mgmt_cidrs + monitoring_source_cidrs }}" }
firewall_rules_alertmanager:
  - { name: alertmanager-https, port: 9093, class: admin, sources: "{{ firewall_mgmt_cidrs + monitoring_source_cidrs }}" }
  - { name: alertmanager-cluster, port: 9094, class: cluster, sources: "{{ monitoring_source_cidrs }}" }
firewall_rules_blackbox_exporter:
  - { name: blackbox-exporter, port: 9115, class: metrics, sources: "{{ monitoring_source_cidrs }}" }
firewall_rules_grafana:
  - name: grafana-https
    port: 3000
    class: admin
    sources: "{{ [network_zones.app] + firewall_mgmt_cidrs + monitoring_source_cidrs }}"
