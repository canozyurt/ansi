---
openbao_hostname: bao.example.internal
openbao_pki_allowed_domains: [example.internal]
# Keep secrets out of plain text: ansible-vault encrypt_string, or look them up from the secrets manager.
openbao_oidc_client_secret: "{{ vault_openbao_oidc_client_secret }}"
# After the first run: copy these from the init output file, then move that file to offline storage.
openbao_unseal_keys: "{{ vault_openbao_unseal_keys | default([]) }}"
openbao_admin_token: "{{ vault_openbao_admin_token | default('') }}"

# Networks that reach OpenBao: every zone requests certificates and secrets (NET-01, NET-03).
openbao_client_cidrs: ["{{ network_zones.mgmt }}", "{{ network_zones.app }}", "{{ network_zones.data }}"]
# Prometheus servers (the monitoring hosts).
openbao_monitoring_cidrs: "{{ monitoring_source_cidrs }}"

firewall_rules_openbao:
  # Every zone requests certificates and secrets here; administration needs a token with an admin policy.
  - { name: openbao-api, port: 8200, class: service, sources: "{{ openbao_client_cidrs }}" }
  # Raft and request forwarding between OpenBao nodes (all in the mgmt zone); narrow to their /32s if you can.
  - { name: openbao-cluster, port: 8201, class: cluster, sources: ["{{ network_zones.mgmt }}"] }
  - { name: openbao-metrics, port: 8202, class: metrics, sources: "{{ openbao_monitoring_cidrs }}" }
