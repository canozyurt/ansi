---
# Garage cluster s3-main (NET-01, NET-03). Set garage_cluster_zone per host (rack or availability zone).
firewall_rules_garage_s3_main:
  - { name: garage-s3-main-s3, port: 3900, sources: ["{{ network_zones.app }}", "{{ network_zones.mgmt }}", "{{ network_zones.data }}"] }
  - { name: garage-s3-main-rpc, port: 3901, sources: ["{{ network_zones.data }}"] }
  - { name: garage-s3-main-metrics, port: 3904, sources: "{{ monitoring_source_cidrs }}" }
