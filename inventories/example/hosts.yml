---
# Example inventory. Copy to inventories/<your-env>/ (ignored by git) and edit.
# Zones (NET-03): mgmt = VPN, bastion, IdP and other control-plane services;
# app = application and edge services; data = databases, object storage and backups.
all:
  children:
    mgmt:
      hosts:
        mgmt-1.example.internal:
        mgmt-2.example.internal:
        mgmt-3.example.internal:
    app:
      hosts:
        app-1.example.internal:
        app-2.example.internal:
        app-3.example.internal:
    data:
      hosts:
        data-1.example.internal:
        data-2.example.internal:
        data-3.example.internal:
    keycloak:
      hosts:
        mgmt-1.example.internal:
        mgmt-2.example.internal:
        mgmt-3.example.internal:
    # Secrets, PKI and SSH CA: Raft cluster of 3.
    openbao:
      hosts:
        mgmt-1.example.internal:
        mgmt-2.example.internal:
        mgmt-3.example.internal:
    # Prometheus (2+ replicas), Alertmanager (3-node cluster), Grafana and blackbox_exporter.
    monitoring:
      hosts:
        mgmt-1.example.internal:
        mgmt-2.example.internal:
        mgmt-3.example.internal:
    # Edge proxy pair sharing the VIP (roles/edge, roles/keepalived).
    edge:
      hosts:
        app-1.example.internal:
        app-2.example.internal:
    # Backup servers in two failure domains; every host is a backup client.
    backup:
      hosts:
        data-1.example.internal:
        data-3.example.internal:
    # Public status page (Gatus): two independent instances behind the edge (roles/status_page).
    status_page:
      hosts:
        app-2.example.internal:
        app-3.example.internal:
    # GRC (CISO Assistant): one active node by design, restored from backup (roles/grc).
    grc:
      hosts:
        mgmt-2.example.internal:
    # Hosts that accept files from users (malware scanning, roles/clamav). Hosts that declare
    # clamav_upload_paths_<role> are added automatically by playbooks/security_scanning.yml.
    clamav_hosts:
      children:
        app:
    container_hosts:
      children:
        mgmt:
        app:
        data:
    # Admin access hosts sit in the mgmt network but run no containers (Docker's FORWARD policy would
    # interfere with the VPN). Set ansible_host to IP addresses so roles/dns_resolver can publish them.
    vpn:
      hosts:
        vpn-1.example.internal: { ansible_host: 10.10.0.21, wireguard_gateway_public_endpoint: vpn-1.example.com }
        vpn-2.example.internal: { ansible_host: 10.10.0.22, wireguard_gateway_public_endpoint: vpn-2.example.com }
    bastion:
      hosts:
        bastion-1.example.internal: { ansible_host: 10.10.0.31 }
        bastion-2.example.internal: { ansible_host: 10.10.0.32 }
    dns:
      hosts:
        dns-1.example.internal: { ansible_host: 10.10.0.53 }
        dns-2.example.internal: { ansible_host: 10.10.0.54 }
