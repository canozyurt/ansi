[defaults]
roles_path = ./roles
# Run record (CHG-02): who, commit, playbook, hosts and result of every run to journald; see tools/ansible-run.
callback_plugins = ./plugins/callback
callbacks_enabled = run_record
collections_path = ./collections
inventory = ./inventories/example/hosts.yml
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = False
interpreter_python = auto_silent
# Every run is logged for change evidence (CHG-02); CI ships this file to central logging.
log_path = ./ansible.log
nocows = True

[ssh_connection]
pipelining = True
