---
- name: Create the Trivy directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/trivy-scan, mode: "0750" }
    - { path: "{{ trivy_scan_reports_dir }}", mode: "0750" }
    - { path: "{{ trivy_scan_cache_dir }}", mode: "0700" }
    - { path: "{{ trivy_scan_state_file | dirname }}", mode: "0750" }
    - { path: "{{ trivy_scan_textfile_dir }}", mode: "0755" }
  loop_control:
    label: "{{ item.path }}"
  tags: [chk_hrd_05]

- name: Pull the Trivy image
  community.docker.docker_image_pull:
    name: "{{ trivy_scan_image }}"
    pull: not_present
  tags: [chk_hrd_05, chk_chg_05]

- name: Write the scanner settings
  ansible.builtin.copy:
    content: "{{ trivy_scan_config | to_nice_json }}\n"
    dest: /etc/trivy-scan/config.json
    owner: root
    group: root
    mode: "0640"
  vars:
    trivy_scan_config:
      image: "{{ trivy_scan_image }}"
      reports_dir: "{{ trivy_scan_reports_dir }}"
      retention_days: "{{ trivy_scan_retention_days | int }}"
      cache_dir: "{{ trivy_scan_cache_dir }}"
      state_file: "{{ trivy_scan_state_file }}"
      textfile_dir: "{{ trivy_scan_textfile_dir }}"
      severities: "{{ trivy_scan_severities }}"
      ignore_unfixed: "{{ trivy_scan_ignore_unfixed | bool }}"
      running_images: "{{ trivy_scan_running_images | bool }}"
      rootfs: "{{ trivy_scan_rootfs | bool }}"
      rootfs_skip_dirs: "{{ trivy_scan_rootfs_skip_dirs }}"
      extra_images: "{{ trivy_scan_extra_images }}"
      skip_db_update: "{{ trivy_scan_skip_db_update | bool }}"
      timeout: "{{ trivy_scan_timeout }}"
      memory_limit: "{{ trivy_scan_memory_limit }}"
      pids_limit: "{{ trivy_scan_pids_limit | int }}"
  tags: [chk_hrd_05]

# Proxy URLs may carry credentials: environment file, 0600, never a command line (SEC-01).
- name: Write the scanner environment
  ansible.builtin.template:
    src: trivy-scan.env.j2
    dest: /etc/trivy-scan/env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [chk_hrd_05, chk_sec_01]

- name: Install the scan script
  ansible.builtin.copy:
    src: trivy-scan
    dest: /usr/local/sbin/trivy-scan
    owner: root
    group: root
    mode: "0755"
  tags: [chk_hrd_05]

- name: Install the scan service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop: [trivy-scan.service, trivy-scan.timer]
  tags: [chk_hrd_05]

- name: Enable the weekly scan
  ansible.builtin.systemd_service:
    name: trivy-scan.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [chk_hrd_05]
