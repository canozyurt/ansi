---
galaxy_info:
  role_name: registry
  author: compliant-infra-ansible contributors
  description: Zot OCI registry with Keycloak SSO, robots, CVE scanning, signature trust stores and metrics
  license: Apache-2.0
  min_ansible_version: "2.17"
  platforms:
    - name: Debian
      versions: [bookworm]
    - name: Ubuntu
      versions: [jammy, noble]
dependencies:
  - role: versions
  # Signature check before any container is created (CHG-08).
  - role: image_verify
    image_verify_images: ["{{ registry_image }}", "{{ registry_build_base_image }}"]
  - role: rbac_model
