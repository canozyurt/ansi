---
- name: Install Python libraries the Docker and crypto modules need
  ansible.builtin.apt:
    name: [python3-requests, python3-cryptography]
    state: present

- name: Create Keycloak directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ keycloak_data_dir }}", mode: "0750" }
    - { path: "{{ keycloak_data_dir }}/tls", mode: "0750", owner: "{{ keycloak_container_uid }}" }

- name: Generate a temporary TLS key until the PKI role issues certificates
  community.crypto.openssl_privatekey:
    path: "{{ keycloak_data_dir }}/tls/tls.key"
    type: ECC
    curve: secp384r1
    owner: "{{ keycloak_container_uid }}"
    group: root
    mode: "0640"
  when: keycloak_tls_key_file | length == 0
  tags: [chk_sec_03]

- name: Generate a temporary certificate signing request
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ keycloak_data_dir }}/tls/tls.key"
    common_name: "{{ keycloak_hostname | urlsplit('hostname') }}"
    subject_alt_name:
      - "DNS:{{ keycloak_hostname | urlsplit('hostname') }}"
      - "DNS:{{ inventory_hostname }}"
      - "IP:127.0.0.1"
  register: keycloak_csr
  when: keycloak_tls_cert_file | length == 0
  changed_when: false

- name: Generate a temporary self-signed certificate
  community.crypto.x509_certificate:
    path: "{{ keycloak_data_dir }}/tls/tls.crt"
    csr_content: "{{ keycloak_csr.csr }}"
    privatekey_path: "{{ keycloak_data_dir }}/tls/tls.key"
    provider: selfsigned
    selfsigned_not_after: "+365d"
    owner: "{{ keycloak_container_uid }}"
    group: root
    mode: "0644"
  when: keycloak_tls_cert_file | length == 0
  notify: Restart keycloak
  tags: [chk_sec_03]

- name: Install the issued certificate and key
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ keycloak_data_dir }}/tls/{{ item.dest }}"
    remote_src: true
    owner: "{{ keycloak_container_uid }}"
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ keycloak_tls_cert_file }}", dest: tls.crt, mode: "0644" }
    - { src: "{{ keycloak_tls_key_file }}", dest: tls.key, mode: "0640" }
  when: keycloak_tls_cert_file | length > 0
  notify: Restart keycloak
  tags: [chk_sec_03]

- name: Prepare a version change
  ansible.builtin.import_tasks: upgrade_prepare.yml

- name: Write the Keycloak environment (contains secrets)
  ansible.builtin.template:
    src: keycloak.env.j2
    dest: "{{ keycloak_data_dir }}/keycloak.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart keycloak
  tags: [chk_sec_02]

- name: Decide how to apply a version change
  ansible.builtin.import_tasks: upgrade_apply.yml

- name: Run the Keycloak container
  community.docker.docker_container:
    name: "{{ keycloak_container_name }}"
    image: "{{ keycloak_image }}"
    command: [start]
    network_mode: host
    env_file: "{{ keycloak_data_dir }}/keycloak.env"
    volumes:
      - "{{ keycloak_data_dir }}/tls:/opt/keycloak/conf/tls:ro"
    restart_policy: unless-stopped
    memory: "{{ keycloak_memory_limit }}"
    pids_limit: 1024
    cap_drop: [ALL]
    security_opts: [no-new-privileges:true]
    labels:
      com.compliant-infra.role: keycloak
    state: started
  register: keycloak_container
  tags: [chk_hrd_02, chk_iam_01]

- name: Wait for the node to be healthy
  ansible.builtin.import_tasks: health.yml
