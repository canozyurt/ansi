---
# Login users whose password a service keeps in OpenBao (IAM-08). A user entry may name it:
#   - { name: keycloak, password: "{{ vault_keycloak_db_password }}", access: owner,
#       openbao_secret: { service: keycloak, key: db_password } }
# With secrets_backend openbao this role reads the current value from <mount>/services/<service> and applies
# it, so a rotation done by the service (roles/openbao_secrets, which also updates this role in PostgreSQL)
# is not undone by the next run here. Until the service has stored a value, the inventory password is used.
- name: Read the passwords that services keep in OpenBao
  ansible.builtin.uri:
    url: "{{ postgres_cluster_openbao_addr }}/v1/secret/data/services/{{ item.openbao_secret.service }}"
    headers:
      X-Vault-Token: "{{ postgres_cluster_openbao_token }}"
    ca_path: "{{ postgres_cluster_openbao_ca_file | default(omit, true) }}"
    status_code: [200, 404]
  loop: "{{ postgres_cluster_cfg.databases | map(attribute='users', default=[]) | flatten | selectattr('openbao_secret', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: postgres_cluster_service_secrets
  when: postgres_cluster_secrets_backend == 'openbao'
  no_log: true
  tags: [chk_iam_08, chk_sec_02]

- name: Use them for those users
  ansible.builtin.set_fact:
    postgres_cluster_cfg: "{{ postgres_cluster_cfg | combine({'databases': postgres_cluster_databases_patched}) }}"
  vars:
    postgres_cluster_service_passwords: >-
      {%- set out = {} -%}
      {%- for r in postgres_cluster_service_secrets.results | default([]) if r.status | default(0) == 200 -%}
      {%-   set value = r.json.data.data.get(r.item.openbao_secret.key) -%}
      {%-   if value -%}
      {%-     set _ = out.update({r.item.name: value}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
    postgres_cluster_databases_patched: >-
      {%- set dbs = [] -%}
      {%- for d in postgres_cluster_cfg.databases -%}
      {%-   set users = [] -%}
      {%-   for u in d.users | default([]) -%}
      {%-     set _ = users.append(u | combine({'password': postgres_cluster_service_passwords[u.name]})
                                   if u.name in postgres_cluster_service_passwords else u) -%}
      {%-   endfor -%}
      {%-   set _ = dbs.append(d | combine({'users': users})) -%}
      {%- endfor -%}
      {{ dbs }}
  when: postgres_cluster_secrets_backend == 'openbao'
  no_log: true
  tags: [chk_iam_08]
