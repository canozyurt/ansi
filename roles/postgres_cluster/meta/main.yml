---
galaxy_info:
  role_name: postgres_cluster
  author: compliant-infra-ansible contributors
  description: >-
    One highly available PostgreSQL cluster (Patroni, etcd, HAProxy, pgBackRest, postgres_exporter);
    included once per entry of postgres_clusters
  license: Apache-2.0
  min_ansible_version: "2.17"
  platforms:
    - name: Debian
      versions: [bookworm]
    - name: Ubuntu
      versions: [jammy, noble]
dependencies:
  - role: versions
  # Signature check before any container is created (CHG-08).
  - role: image_verify
    image_verify_images:
      - "{{ postgres_cluster_image }}"
      - "{{ postgres_cluster_image_base }}"
      - "{{ postgres_cluster_etcd_image }}"
      - "{{ postgres_cluster_haproxy_image }}"
      - "{{ postgres_cluster_exporter_image }}"
