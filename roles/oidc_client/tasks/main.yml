---
- name: Register the OIDC client
  when: oidc_client_enabled | bool
  run_once: true
  tags: [chk_iam_01, chk_iam_09]
  block:
    - name: Check the client parameters
      ansible.builtin.assert:
        that:
          - oidc_client_id | length > 0
          - oidc_client_keycloak_url is match('^https://')
          - oidc_client_public | bool or oidc_client_secret | length >= 32
          - oidc_client_redirect_uris | length > 0
        fail_msg: >-
          oidc_client needs an id, an https Keycloak URL, redirect URIs and a client secret of
          32+ characters from the secrets manager or Ansible Vault.
        quiet: true

    - name: Create or update the client in Keycloak
      community.general.keycloak_client:
        auth_keycloak_url: "{{ oidc_client_keycloak_url }}"
        auth_realm: master
        auth_username: "{{ oidc_client_admin_user }}"
        auth_password: "{{ oidc_client_admin_password }}"
        validate_certs: "{{ oidc_client_validate_certs }}"
        realm: "{{ oidc_client_realm }}"
        client_id: "{{ oidc_client_id }}"
        name: "{{ oidc_client_name }}"
        protocol: openid-connect
        public_client: "{{ oidc_client_public | bool }}"
        secret: "{{ omit if oidc_client_public | bool else oidc_client_secret }}"
        client_authenticator_type: client-secret
        standard_flow_enabled: true
        implicit_flow_enabled: false
        direct_access_grants_enabled: false
        service_accounts_enabled: false
        frontchannel_logout: true
        root_url: "{{ oidc_client_root_url | default(omit, true) }}"
        redirect_uris: "{{ oidc_client_redirect_uris }}"
        web_origins: ["+"]
        attributes:
          pkce.code.challenge.method: "{{ 'S256' if oidc_client_pkce | bool else '' }}"
          post.logout.redirect.uris: "{{ oidc_client_post_logout_redirect_uris | join('##') }}"
        protocol_mappers: >-
          {{ [{'name': 'default-roles', 'protocol': 'openid-connect', 'protocolMapper': 'oidc-usermodel-realm-role-mapper',
               'config': {'claim.name': 'roles', 'multivalued': 'true', 'jsonType.label': 'String', 'id.token.claim': 'true',
                          'access.token.claim': 'true', 'userinfo.token.claim': 'true'}},
              {'name': 'groups', 'protocol': 'openid-connect', 'protocolMapper': 'oidc-group-membership-mapper',
               'config': {'claim.name': 'groups', 'full.path': 'false', 'id.token.claim': 'true', 'access.token.claim': 'true',
                          'userinfo.token.claim': 'true'}}]
             + oidc_client_extra_protocol_mappers }}
        state: present
      no_log: true
