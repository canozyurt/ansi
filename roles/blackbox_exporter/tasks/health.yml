---
- name: Wait until blackbox_exporter answers over TLS with authentication
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ blackbox_exporter_port }}/-/healthy"
    url_username: "{{ blackbox_exporter_web_user }}"
    url_password: "{{ blackbox_exporter_web_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: blackbox_exporter_ready
  until: blackbox_exporter_ready.status == 200
  retries: 30
  delay: 2
  no_log: true
  tags: [chk_log_05]
