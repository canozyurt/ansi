---
# With serial (playbooks/upgrade.yml) only the current batch has facts; the configuration needs the
# address of every cluster node.
- name: Gather network facts of every cluster node
  ansible.builtin.setup:
    gather_subset: [network]
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ wazuh_indexer_cluster_hosts }}"
  run_once: true
  when: hostvars[item].ansible_facts.default_ipv4 is not defined
