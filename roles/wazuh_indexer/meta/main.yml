---
galaxy_info:
  role_name: wazuh_indexer
  author: compliant-infra-ansible contributors
  description: Wazuh indexer (OpenSearch) cluster with TLS, OIDC role mapping, audit log, ISM retention and S3 snapshots
  license: Apache-2.0
  min_ansible_version: "2.17"
  platforms:
    - name: Debian
      versions: [bookworm]
    - name: Ubuntu
      versions: [jammy, noble]
dependencies:
  - role: versions
  # Signature check before any container is created (CHG-08).
  - role: image_verify
    image_verify_images: ["{{ wazuh_indexer_image }}"]
