---
# One certificate per node for AMQPS, the management UI/API, the Prometheus endpoint and Erlang
# distribution. Peers verify it against ca-bundle.crt: the organisation CA, the internal PKI CA, or,
# with temporary self-signed certificates, the bundle of every member's certificate (SEC-03).
- name: Get the node certificate (internal PKI, supplied files, or temporary self-signed)
  ansible.builtin.include_role:
    name: tls_cert
  vars:
    tls_cert_name: "rabbitmq-{{ rabbitmq_cluster_cfg.name }}"
    tls_cert_dir: "{{ rabbitmq_cluster_dir }}/tls"
    tls_cert_owner: "{{ rabbitmq_cluster_uid }}"
    tls_cert_group: "{{ rabbitmq_cluster_gid }}"
    tls_cert_dir_mode: "0750"
    tls_cert_key_mode: "0600"
    tls_cert_common_name: "{{ rabbitmq_cluster_my_address }}"
    tls_cert_alt_names: >-
      {{ ([rabbitmq_cluster_my_address, inventory_hostname, 'localhost']
          + ([rabbitmq_cluster_cfg.management_url | urlsplit('hostname')] if rabbitmq_cluster_cfg.management_url | length > 0 else [])
          + rabbitmq_cluster_cfg.tls_alt_names) | unique }}
    tls_cert_ip_sans: "{{ ['127.0.0.1', rabbitmq_cluster_node_ip] | unique }}"
    tls_cert_src_cert: "{{ rabbitmq_cluster_cfg.tls_cert_file }}"
    tls_cert_src_key: "{{ rabbitmq_cluster_cfg.tls_key_file }}"
  tags: [chk_sec_03]

- name: Note whether the node certificate changed
  ansible.builtin.set_fact:
    rabbitmq_cluster_cert_changed: "{{ tls_cert_changed | bool }}"
    rabbitmq_cluster_cert_source: "{{ tls_cert_source }}"

- name: Check that a CA is known for organisation-supplied certificates
  ansible.builtin.assert:
    that: rabbitmq_cluster_cert_source != 'file' or rabbitmq_cluster_cfg.tls_ca_file | length > 0
    fail_msg: RabbitMQ cluster {{ rabbitmq_cluster_cfg.name }} uses supplied certificate files; set tls_ca_file (the CA bundle on the hosts) in its entry.
    quiet: true

- name: Read the member certificates
  ansible.builtin.slurp:
    src: "{{ rabbitmq_cluster_dir }}/tls/tls.crt"
  delegate_to: "{{ item }}"
  loop: "{{ rabbitmq_cluster_hosts }}"
  register: rabbitmq_cluster_member_certs
  when: rabbitmq_cluster_cert_source == 'selfsigned'

- name: Read the CA certificate
  ansible.builtin.slurp:
    src: >-
      {{ rabbitmq_cluster_cfg.tls_ca_file if rabbitmq_cluster_cert_source == 'file'
         else (pki_openbao_ca_file | default('', true) or '/usr/local/share/ca-certificates/compliant-infra-ca.crt') }}
  register: rabbitmq_cluster_ca_cert
  when: rabbitmq_cluster_cert_source != 'selfsigned'

- name: Write the CA bundle
  ansible.builtin.copy:
    content: "{{ (rabbitmq_cluster_member_certs.results | map(attribute='content') | map('b64decode') | map('trim') | join('\n'))
      if rabbitmq_cluster_cert_source == 'selfsigned' else (rabbitmq_cluster_ca_cert.content | b64decode | trim) }}\n"
    dest: "{{ rabbitmq_cluster_dir }}/tls/ca-bundle.crt"
    owner: "{{ rabbitmq_cluster_uid }}"
    group: "{{ rabbitmq_cluster_gid }}"
    mode: "0644"
  register: rabbitmq_cluster_bundle
  tags: [chk_sec_03]
