---
# Application users' passwords from OpenBao (IAM-08). With secrets_backend openbao every application user
# gets its own secret at <mount>/services/rabbitmq-<instance>-<user> (key "password"): seeded once from the
# inventory value if one is set, otherwise generated, and rotated every rabbitmq_cluster_app_password_rotate_days by
# playbooks/rotate_secrets.yml. The policy svc-rabbitmq-<instance>-<user> reads only that secret; attach it to the
# application's own AppRole so the application reads its password at runtime (every read is audited).
# This role then applies the value (a hash) to RabbitMQ. vault-file: inventory passwords as before.
- name: Keep each application user's password in OpenBao
  ansible.builtin.include_role:
    name: openbao_secrets
  vars:
    openbao_secrets_backend: "{{ rabbitmq_cluster_secrets_backend }}"
    openbao_secrets_service: "rabbitmq-{{ rabbitmq_cluster_cfg.name }}-{{ rabbitmq_cluster_app_user.name }}"
    openbao_secrets_items:
      - name: password
        seed: "{{ rabbitmq_cluster_app_user.password | default('') }}"
        rotate_days: "{{ rabbitmq_cluster_app_password_rotate_days }}"
    openbao_secrets_agent: false
    openbao_secrets_manage_host: "{{ rabbitmq_cluster_hosts | select('in', ansible_play_hosts) | first }}"
  loop: "{{ rabbitmq_cluster_cfg.vhosts | map(attribute='users', default=[]) | flatten }}"
  loop_control:
    loop_var: rabbitmq_cluster_app_user
    label: "{{ rabbitmq_cluster_app_user.name }}"
  when: rabbitmq_cluster_secrets_backend == 'openbao'
  tags: [chk_iam_08, chk_sec_02]

- name: Use the passwords from OpenBao for the application users
  ansible.builtin.set_fact:
    rabbitmq_cluster_cfg: "{{ rabbitmq_cluster_cfg | combine(rabbitmq_cluster_users_patch, recursive=true) }}"
  vars:
    rabbitmq_cluster_users_patch: >-
      {%- set vhosts = [] -%}
      {%- for v in rabbitmq_cluster_cfg.vhosts -%}
      {%-   set users = [] -%}
      {%-   for u in v.users | default([]) -%}
      {%-     set _ = users.append(u | combine({'password': openbao_secrets_all['rabbitmq-' ~ rabbitmq_cluster_cfg.name ~ '-' ~ u.name].password})) -%}
      {%-   endfor -%}
      {%-   set _ = vhosts.append(v | combine({'users': users})) -%}
      {%- endfor -%}
      {{ {'vhosts': vhosts} }}
  when: rabbitmq_cluster_secrets_backend == 'openbao'
  no_log: true
  tags: [chk_iam_08]
