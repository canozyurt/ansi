---
galaxy_info:
  role_name: forgejo
  author: compliant-infra-ansible contributors
  description: Forgejo source control with OIDC login, protected branches with required reviews, Actions, backup and active/passive failover
  license: Apache-2.0
  min_ansible_version: "2.17"
  platforms:
    - name: Debian
      versions: [bookworm]
    - name: Ubuntu
      versions: [jammy, noble]
dependencies:
  - role: versions
  # Signature check before any container is created (CHG-08).
  - role: image_verify
    image_verify_images: ["{{ forgejo_image }}"]
