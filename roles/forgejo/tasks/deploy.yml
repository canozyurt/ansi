---
- name: Install Python libraries the Docker and crypto modules need
  ansible.builtin.apt:
    name: [python3-requests, python3-cryptography]
    state: present

- name: Install the dump and restart helpers
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop: [forgejo-backup-dump, forgejo-restart-if-running]
  tags: [chk_bck_01]

- name: Create the configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ forgejo_config_dir }}", owner: root, mode: "0755" }
    - { path: "{{ forgejo_config_dir }}/conf", owner: "{{ forgejo_container_uid }}", mode: "0700" }
    - { path: "{{ forgejo_config_dir }}/secrets", owner: root, mode: "0700" }
  loop_control:
    label: "{{ item.path }}"

- name: Create the data, repository and dump directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ forgejo_container_uid }}"
    group: "{{ forgejo_container_uid }}"
    mode: "0750"
  loop:
    - "{{ forgejo_data_dir }}"
    - "{{ forgejo_repo_dir }}"
    - "{{ forgejo_dump_dir }}"
  tags: [chk_bck_01]

# The image's entrypoint keeps these at 0700.
- name: Create the custom directory the configuration is mounted into
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ forgejo_container_uid }}"
    group: "{{ forgejo_container_uid }}"
    mode: "0700"
  loop:
    - "{{ forgejo_data_dir }}/custom"
    - "{{ forgejo_data_dir }}/custom/conf"

- name: Get the TLS certificate (internal PKI, supplied files, or temporary self-signed)
  ansible.builtin.include_role:
    name: tls_cert
  vars:
    tls_cert_name: forgejo
    tls_cert_dir: "{{ forgejo_config_dir }}/tls"
    tls_cert_owner: "{{ forgejo_container_uid }}"
    tls_cert_common_name: "{{ forgejo_root_url | urlsplit('hostname') }}"
    tls_cert_src_cert: "{{ forgejo_tls_cert_file }}"
    tls_cert_src_key: "{{ forgejo_tls_key_file }}"
  tags: [chk_sec_03]

- name: Restart Forgejo when its certificate changed
  ansible.builtin.debug:
    msg: The TLS certificate changed; Forgejo restarts to load it.
  changed_when: tls_cert_changed | bool
  notify: Restart forgejo

- name: Note where the configuration template is
  ansible.builtin.set_fact:
    forgejo_app_ini_template: "{{ role_path }}/templates/app.ini.j2"

- name: Keep Forgejo's secrets in OpenBao and render app.ini into tmpfs
  ansible.builtin.include_role:
    name: openbao_secrets
  vars:
    openbao_secrets_backend: "{{ forgejo_secrets_backend }}"
    openbao_secrets_service: forgejo
    openbao_secrets_items:
      - name: db_password
        seed: "{{ forgejo_db_password }}"
        rotate_days: "{{ forgejo_secret_rotate_days if forgejo_db_postgres | length > 0 else 0 }}"
        postgres: "{{ forgejo_db_postgres if forgejo_db_postgres | length > 0 else omit }}"
      - { name: secret_key, seed: "{{ forgejo_secret_key }}", length: 64, rotate_days: 0 }
      - { name: internal_token, seed: "{{ forgejo_internal_token }}", length: 64, rotate_days: "{{ forgejo_secret_rotate_days }}" }
      - { name: jwt_secret, seed: "{{ forgejo_jwt_secret }}", length: 43, rotate_days: "{{ forgejo_secret_rotate_days }}" }
      - { name: lfs_jwt_secret, seed: "{{ forgejo_lfs_jwt_secret }}", length: 43, rotate_days: "{{ forgejo_secret_rotate_days }}" }
      - { name: s3_secret_key, source: inventory, seed: "{{ forgejo_s3_secret_key }}" }
      - { name: cache_password, source: inventory, seed: "{{ forgejo_cache_password }}" }
      - { name: metrics_token, source: inventory, seed: "{{ forgejo_metrics_token }}" }
    openbao_secrets_files:
      - name: app.ini
        content: >-
          {{ lookup('ansible.builtin.template', forgejo_app_ini_template, template_vars={
               'forgejo_db_password': openbao_secrets_refs.db_password,
               'forgejo_secret_key': openbao_secrets_refs.secret_key,
               'forgejo_internal_token': openbao_secrets_refs.internal_token,
               'forgejo_jwt_secret': openbao_secrets_refs.jwt_secret,
               'forgejo_lfs_jwt_secret': openbao_secrets_refs.lfs_jwt_secret,
               'forgejo_s3_secret_key': openbao_secrets_refs.s3_secret_key if forgejo_s3_secret_key | length > 0 else '',
               'forgejo_cache_password': openbao_secrets_refs_urlquery.cache_password if forgejo_cache_password | length > 0 else '',
               'forgejo_metrics_token': openbao_secrets_refs.metrics_token}) }}
    openbao_secrets_uid: "{{ forgejo_container_uid }}"
    openbao_secrets_on_change_container: "{{ forgejo_container_name }}"
    openbao_secrets_on_change: ["/usr/local/sbin/forgejo-restart-if-running {{ forgejo_container_name }}"]
    openbao_secrets_manage_host: "{{ forgejo_cluster_hosts | select('in', ansible_play_hosts) | first }}"
  tags: [chk_iam_08, chk_sec_02]

- name: Note where Forgejo reads its configuration
  ansible.builtin.set_fact:
    forgejo_secrets_runtime: "{{ openbao_secrets_active | bool }}"
    forgejo_conf_mount: >-
      {{ '/run/compliant-secrets/forgejo' if openbao_secrets_active | bool else forgejo_config_dir ~ '/conf' }}

- name: Write the Forgejo configuration (contains secrets; vault-file backend)
  ansible.builtin.template:
    src: app.ini.j2
    dest: "{{ forgejo_config_dir }}/conf/app.ini"
    owner: "{{ forgejo_container_uid }}"
    group: "{{ forgejo_container_uid }}"
    mode: "0600"
  no_log: true
  notify: Restart forgejo
  when: not forgejo_secrets_runtime | bool
  tags: [chk_sec_02, chk_iam_01, chk_chg_01]

- name: Remove the on-disk configuration once OpenBao Agent renders it into tmpfs
  ansible.builtin.file:
    path: "{{ forgejo_config_dir }}/conf/app.ini"
    state: absent
  when: forgejo_secrets_runtime | bool
  tags: [chk_sec_02]

- name: Read the running Forgejo container
  community.docker.docker_container_info:
    name: "{{ forgejo_container_name }}"
  register: forgejo_current

- name: Prepare a version change
  ansible.builtin.import_tasks: upgrade.yml

# active_passive: the failover service starts Forgejo only on the node holding the VIP, so Ansible
# creates the container everywhere but starts it only where it already runs.
- name: Run the Forgejo container
  community.docker.docker_container:
    name: "{{ forgejo_container_name }}"
    image: "{{ forgejo_image }}"
    user: "{{ forgejo_container_uid }}:{{ forgejo_container_uid }}"
    network_mode: host
    env:
      GITEA_TEMP: /var/lib/gitea/tmp
      TMPDIR: /var/lib/gitea/tmp
    volumes:
      - "{{ forgejo_data_dir }}:/var/lib/gitea"
      - "{{ forgejo_repo_dir }}:/var/lib/gitea/repositories"
      # The directory, not the file: the agent replaces app.ini atomically (new inode).
      - "{{ forgejo_conf_mount }}:/var/lib/gitea/custom/conf:ro"
      - "{{ forgejo_config_dir }}/tls:/etc/forgejo/tls:ro"
      - "{{ forgejo_dump_dir }}:/backup"
      # The host trust store (with the internal CA) for Keycloak, S3 and webhooks.
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    restart_policy: "{{ 'no' if forgejo_ha_mode == 'active_passive' else 'unless-stopped' }}"
    memory: "{{ forgejo_memory_limit }}"
    pids_limit: 2048
    cap_drop: [ALL]
    security_opts: [no-new-privileges:true]
    labels:
      com.compliant-infra.role: forgejo
    state: >-
      {{ 'started' if forgejo_ha_mode != 'active_passive' or forgejo_current.container.State.Running | default(false)
         else 'present' }}
  register: forgejo_container
  tags: [chk_hrd_02, chk_iam_01]
