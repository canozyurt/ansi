---
- name: Check required settings
  ansible.builtin.assert:
    that:
      - wazuh_dashboard_indexer_password | length >= 16
      - wazuh_dashboard_api_password | length >= 8
      - wazuh_dashboard_public_url is match('^https://')
      - not wazuh_dashboard_oidc_enabled | bool or wazuh_dashboard_oidc_client_secret | length >= 32
      - (wazuh_dashboard_tls_cert_file | length > 0) == (wazuh_dashboard_tls_key_file | length > 0)
    fail_msg: >-
      Set the dashboard's indexer password (16+), the API password, an https public URL and the OIDC client
      secret (32+ characters), all from Ansible Vault or the secrets manager.
    quiet: true
  no_log: true

- name: Require at least two dashboards behind the edge proxy (HA-01)
  ansible.builtin.assert:
    that: wazuh_dashboard_cluster_hosts | length >= wazuh_dashboard_min_nodes or wazuh_dashboard_allow_single_node | bool
    fail_msg: >-
      The Wazuh dashboard needs at least {{ wazuh_dashboard_min_nodes }} nodes (found {{ wazuh_dashboard_cluster_hosts | length }}).
      Set wazuh_dashboard_allow_single_node only for labs and tests.
    quiet: true
  tags: [chk_ha_01]

- name: Register the dashboard as an OIDC client in Keycloak
  ansible.builtin.include_role:
    name: oidc_client
  vars:
    oidc_client_id: "{{ wazuh_dashboard_oidc_client_id }}"
    oidc_client_name: Wazuh dashboard (SIEM)
    oidc_client_secret: "{{ wazuh_dashboard_oidc_client_secret }}"
    oidc_client_root_url: "{{ wazuh_dashboard_public_url }}"
    oidc_client_redirect_uris: ["{{ wazuh_dashboard_public_url }}/auth/openid/login"]
    oidc_client_post_logout_redirect_uris: ["{{ wazuh_dashboard_public_url }}/*"]
    oidc_client_enabled: "{{ wazuh_dashboard_oidc_enabled | bool and wazuh_dashboard_oidc_register_client | bool }}"
  tags: [chk_iam_01, chk_iam_09]

- name: Deploy the dashboard
  ansible.builtin.import_tasks: deploy.yml
