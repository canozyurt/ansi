---
- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure persistent, bounded journald storage
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/50-compliance.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
  tags: [chk_log_01]
