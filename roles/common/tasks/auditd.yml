---
- name: Configure auditd
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd
  tags: [chk_log_01]

- name: Install audit rules
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/50-compliance.rules
    owner: root
    group: root
    mode: "0640"
  notify: Load audit rules
  tags: [chk_log_01, chk_iam_07]

- name: Enable and start auditd
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started
  when: common_auditd_manage_service | bool
  tags: [chk_log_01]
