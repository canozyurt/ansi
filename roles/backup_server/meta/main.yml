---
galaxy_info:
  role_name: backup_server
  author: compliant-infra-ansible contributors
  description: Append-only restic rest-server with server-side retention and optional S3 copy
  license: Apache-2.0
  min_ansible_version: "2.17"
  platforms:
    - name: Debian
      versions: [bookworm]
    - name: Ubuntu
      versions: [jammy, noble]
dependencies:
  - role: versions
  # Signature check before any container is created (CHG-08).
  - role: image_verify
    image_verify_images: ["{{ backup_server_image }}"]
