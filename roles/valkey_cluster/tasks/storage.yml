---
# SEC-04: Valkey does not encrypt its RDB and AOF files. The data directory must sit on an encrypted
# block device (LUKS/dm-crypt) or on a volume the provider encrypts (attested by the operator).
- name: Create the instance directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ valkey_cluster_dir }}", mode: "0755" }
    - { path: "{{ valkey_cluster_data_dir }}", owner: "{{ valkey_cluster_uid }}", group: "{{ valkey_cluster_gid }}", mode: "0700" }
    - { path: "{{ valkey_cluster_dir }}/conf", owner: "{{ valkey_cluster_uid }}", group: "{{ valkey_cluster_gid }}", mode: "0700" }
    - { path: "{{ valkey_cluster_dir }}/sentinel", owner: "{{ valkey_cluster_uid }}", group: "{{ valkey_cluster_gid }}", mode: "0700" }
    - { path: "{{ valkey_cluster_dir }}/backup", mode: "0700" }
    - { path: "{{ valkey_cluster_instance_secrets_dir }}", mode: "0700" }
    - { path: "{{ valkey_cluster_textfile_dir }}", mode: "0755" }
  loop_control:
    label: "{{ item.path }}"

- name: Find the block devices under the data directory
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      src=$(findmnt -n -o SOURCE --target {{ valkey_cluster_data_dir | quote }} | head -n1 | sed 's/\[.*\]$//');
      echo "source=$src";
      lsblk -n -s -o TYPE "$src" 2>/dev/null | tr -d ' ' | sort -u | tr '\n' ' ' || true
    executable: /bin/bash
  register: valkey_cluster_storage
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [chk_sec_04]

- name: Note whether the data directory is encrypted
  ansible.builtin.set_fact:
    valkey_cluster_data_encrypted: "{{ 'crypt' in (valkey_cluster_storage.stdout_lines | last | default('')).split() }}"
  tags: [chk_sec_04]

- name: Require encrypted storage for the data directory
  ansible.builtin.assert:
    that: valkey_cluster_data_encrypted | bool or valkey_cluster_storage_encryption_attested | bool
    fail_msg: >-
      {{ valkey_cluster_data_dir }} ({{ valkey_cluster_storage.stdout_lines | first | default('unknown source') }}) is not on a dm-crypt
      (LUKS) device. Move it to an encrypted volume, or set valkey_cluster_storage_encryption_attested when the
      provider encrypts the volume.
    quiet: true
  when: valkey_cluster_require_encrypted_storage | bool
  tags: [chk_sec_04]

- name: Publish the storage encryption state as a metric
  ansible.builtin.copy:
    content: |
      # HELP datastore_data_dir_encrypted 1 if the data directory is on a dm-crypt (LUKS) device.
      # TYPE datastore_data_dir_encrypted gauge
      datastore_data_dir_encrypted{product="valkey",cluster="{{ valkey_cluster_cfg.name }}"} {{ 1 if valkey_cluster_data_encrypted | bool else 0 }}
      # HELP datastore_data_dir_encryption_attested 1 if the operator attests provider-side volume encryption.
      # TYPE datastore_data_dir_encryption_attested gauge
      datastore_data_dir_encryption_attested{product="valkey",cluster="{{ valkey_cluster_cfg.name }}"} {{
      1 if valkey_cluster_storage_encryption_attested | bool else 0 }}
    dest: "{{ valkey_cluster_textfile_dir }}/valkey-{{ valkey_cluster_cfg.name }}-storage.prom"
    owner: root
    group: root
    mode: "0644"
  tags: [chk_sec_04]
