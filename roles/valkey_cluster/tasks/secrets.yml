---
# Application users' passwords from OpenBao (IAM-08). With secrets_backend openbao every application user
# gets its own secret at <mount>/services/valkey-<instance>-<user> (key "password"): seeded once from the
# inventory value if one is set, otherwise generated, and rotated every valkey_cluster_app_password_rotate_days by
# playbooks/rotate_secrets.yml. The policy svc-valkey-<instance>-<user> reads only that secret; attach it to the
# application's own AppRole so the application reads its password at runtime (every read is audited).
# This role then applies the value (a hash) to Valkey. vault-file: inventory passwords as before.
- name: Keep each application user's password in OpenBao
  ansible.builtin.include_role:
    name: openbao_secrets
  vars:
    openbao_secrets_backend: "{{ valkey_cluster_secrets_backend }}"
    openbao_secrets_service: "valkey-{{ valkey_cluster_cfg.name }}-{{ valkey_cluster_app_user.name }}"
    openbao_secrets_items:
      - name: password
        seed: "{{ valkey_cluster_app_user.password | default('') }}"
        rotate_days: "{{ valkey_cluster_app_password_rotate_days }}"
    openbao_secrets_agent: false
    openbao_secrets_manage_host: "{{ valkey_cluster_hosts | select('in', ansible_play_hosts) | first }}"
  loop: "{{ valkey_cluster_cfg.users }}"
  loop_control:
    loop_var: valkey_cluster_app_user
    label: "{{ valkey_cluster_app_user.name }}"
  when: valkey_cluster_secrets_backend == 'openbao'
  tags: [chk_iam_08, chk_sec_02]

- name: Use the passwords from OpenBao for the application users
  ansible.builtin.set_fact:
    valkey_cluster_cfg: "{{ valkey_cluster_cfg | combine(valkey_cluster_users_patch, recursive=true) }}"
  vars:
    valkey_cluster_users_patch: >-
      {%- set users = [] -%}
      {%- for u in valkey_cluster_cfg.users -%}
      {%-   set _ = users.append(u | combine({'password': openbao_secrets_all['valkey-' ~ valkey_cluster_cfg.name ~ '-' ~ u.name].password})) -%}
      {%- endfor -%}
      {{ {'users': users} }}
  when: valkey_cluster_secrets_backend == 'openbao'
  no_log: true
  tags: [chk_iam_08]
