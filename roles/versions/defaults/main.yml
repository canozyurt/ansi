---
# Single source of truth for every upstream version this repo deploys (CHG-05).
#
# Maintainers choose each version by hand once they judge the upstream release
# stable, and bump it here in a reviewed pull request. CI then tests a fresh install
# and the upgrade from versions_upgrade_from before the bump can merge.
# Organisations upgrade by moving to a new release tag of this repository and
# running playbooks/upgrade.yml. See docs/upgrades.md.
#
# Override a single image in the inventory only as a documented exception;
# the release bundle is what CI has tested together.

versions_images:
  keycloak: docker.io/keycloak/keycloak:26.8.0
  # Client tools for pre-upgrade database dumps; must be >= the server major version.
  postgres_client: docker.io/library/postgres:18.6-alpine
  # Monitoring and alerting (playbooks/monitoring.yml)
  node_exporter: docker.io/prom/node-exporter:v1.12.1
  prometheus: docker.io/prom/prometheus:v3.15.0
  alertmanager: docker.io/prom/alertmanager:v0.34.1
  blackbox_exporter: docker.io/prom/blackbox-exporter:v0.28.0
  grafana: docker.io/grafana/grafana:13.2.3

# What the previous release of this repository deployed. CI installs these first
# and upgrades to versions_images, so every release proves its upgrade path.
# Update this block when cutting a release.
versions_upgrade_from:
  keycloak: docker.io/keycloak/keycloak:26.7.5
