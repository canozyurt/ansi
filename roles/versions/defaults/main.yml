---
# Single source of truth for every upstream version this repo deploys (CHG-05).
#
# Maintainers choose each version by hand once they judge the upstream release
# stable, and bump it here in a reviewed pull request. CI then tests a fresh install
# and the upgrade from versions_upgrade_from before the bump can merge.
# Organisations upgrade by moving to a new release tag of this repository and
# running playbooks/upgrade.yml. See docs/upgrades.md.
#
# Override a single image in the inventory only as a documented exception;
# the release bundle is what CI has tested together.

versions_images:
  keycloak: docker.io/keycloak/keycloak:26.8.0
  # Secrets, PKI and SSH CA (roles/openbao)
  openbao: docker.io/openbao/openbao:2.7.1
  # Client tools for pre-upgrade database dumps; must be >= the server major version.
  postgres_client: docker.io/library/postgres:18.6-alpine
  # Monitoring and alerting (playbooks/monitoring.yml)
  node_exporter: docker.io/prom/node-exporter:v1.12.1
  prometheus: docker.io/prom/prometheus:v3.15.0
  alertmanager: docker.io/prom/alertmanager:v0.34.1
  blackbox_exporter: docker.io/prom/blackbox-exporter:v0.28.0
  grafana: docker.io/grafana/grafana:13.2.3
  # SSO in front of UIs without native OIDC (roles/oauth2_proxy): oauth2-proxy (MIT), distroless image.
  oauth2_proxy: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
  # Edge proxy (roles/edge): HAProxy LTS branch.
  haproxy: docker.io/library/haproxy:3.4.6-alpine
  # WAF agent: Coraza SPOA with the embedded OWASP CRS (0.9.0 ships CRS 4.25.0). Upstream image.
  coraza_spoa: ghcr.io/corazawaf/coraza-spoa:0.9.0
  # Toolchain for edge_waf_build (builds the same coraza-spoa version from the Go module proxy).
  coraza_spoa_builder: docker.io/library/golang:1.26.8-alpine
  # Backup repository server (roles/backup_server)
  rest_server: docker.io/restic/rest-server:0.14.0
  # Source control and CI/CD (playbooks/delivery.yml). Forgejo 15 is the LTS branch; rootless image.
  forgejo: codeberg.org/forgejo/forgejo:15.0.9-rootless
  forgejo_runner: data.forgejo.org/forgejo/runner:12.10.1
  # Default job image for the runner's "docker" label.
  forgejo_runner_job: docker.io/library/node:24.21.0-trixie
  # Public status page and synthetic checks (roles/status_page)
  gatus: docker.io/twinproduction/gatus:v5.37.0
  # GRC and compliance evidence (roles/grc): CISO Assistant Community Edition (AGPL-3.0 images)
  ciso_assistant_backend: ghcr.io/intuitem/ciso-assistant-community/backend:v4.1.0
  ciso_assistant_frontend: ghcr.io/intuitem/ciso-assistant-community/frontend:v4.1.0
  # Vulnerability scanner (roles/trivy_scan). Pinned by digest too: it runs as root with the
  # Docker socket, so a re-pushed tag must not change what runs.
  trivy: docker.io/aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  # PostgreSQL product playbook (roles/postgres_cluster). The server image is built on each host from
  # this Ubuntu LTS base plus the pinned packages and Patroni below (versions_postgres).
  postgres_base: docker.io/library/ubuntu:resolute-20260927
  etcd: gcr.io/etcd-development/etcd:v3.6.15
  postgres_exporter: docker.io/prometheuscommunity/postgres-exporter:v0.20.1
  # SIEM (Wazuh 4.x, GPLv2). Indexer, manager, dashboard and agent move together.
  wazuh_indexer: docker.io/wazuh/wazuh-indexer:4.14.8
  wazuh_manager: docker.io/wazuh/wazuh-manager:4.14.8
  wazuh_dashboard: docker.io/wazuh/wazuh-dashboard:4.14.8
  # OCI registry (roles/registry): Zot, full build (UI, search/CVE, trust, metrics).
  zot: ghcr.io/project-zot/zot:v2.1.21
  # Base for registry_build (the same Zot release binary on Debian; the upstream image is distroless Debian).
  zot_build_base: docker.io/library/debian:13.7-slim
  # Product playbooks: Valkey (playbooks/valkey.yml), RabbitMQ (playbooks/rabbitmq.yml), Garage (playbooks/garage.yml)
  valkey: docker.io/valkey/valkey:9.1.2-alpine
  redis_exporter: docker.io/oliver006/redis_exporter:v1.93.0
  rabbitmq: docker.io/library/rabbitmq:4.3.6-alpine
  garage: docker.io/dxflrs/garage:v2.4.1
  # S3 client for Garage bucket export and deletion (roles/data_lifecycle, DAT-02).
  rclone: docker.io/rclone/rclone:1.71.1
  # Weekly TLS scan of every endpoint (roles/tls_scan, SEC-03). Upstream image of testssl.sh (GPLv2).
  # Upstream publishes only the moving 3.2 tag (no 3.2.x tags; checked 2026-10-11), so it is pinned
  # by the digest of its multi-arch index.
  testssl: ghcr.io/testssl/testssl.sh:3.2@sha256:51918b1e954df0acee8c08d3ad5ce306710e4fefe49ed0e0f92728ecf9e7ff34

# Host packages installed from upstream repositories (pinned, held).
versions_packages:
  # Must match the Wazuh manager version above (agents may not be newer than the manager).
  wazuh_agent: 4.14.8-1

# Host binaries installed outside the package manager, verified by SHA-256.
versions_tools:
  restic:
    version: 0.19.1
    url: https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_{arch}.bz2
    sha256:
      amd64: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
      arm64: a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465
  # Zot release binary for registry_build (same release as versions_images.zot).
  zot:
    version: 2.1.21
    url: https://github.com/project-zot/zot/releases/download/v2.1.21/zot-linux-{arch}
    sha256:
      amd64: 8751cc0daf739634835a3bd8206e3094c84d552e2c462e4a4baf80f40dd92685
      arm64: 49e1f948af8e5c6ed5c803bad4508cf7af37be6c15b7fb2840109900b916eb48

  # Upstream SCAP content for roles/cis_audit where the release's packages lack the data stream
  # (Debian 12 has no CIS profile in ssg-debian, Ubuntu 22.04 has no ssg packages, Ubuntu 24.04 has
  # no ubuntu2404 content). SHA-256 of the release zip; its SHA-512 matches the .sha512 published
  # next to it on the release page.
  scap_security_guide:
    version: 0.1.76
    url: https://github.com/ComplianceAsCode/content/releases/download/v0.1.76/scap-security-guide-0.1.76.zip
    sha256: 5a30a4bf868859c5130378d99cc09027ad1d9a7b4988d21751e84a597bb01627

  # CIS Docker Benchmark checks for roles/docker_bench. SHA-256 of the tag archive, recorded on the
  # test runner on 2026-10-11.
  docker_bench_security:
    version: 1.6.0
    url: https://github.com/docker/docker-bench-security/archive/refs/tags/v1.6.0.tar.gz
    sha256: 7ff647e773c02fceec8d82d83aeccb68d7bcb9cd49ef1dfeb577ba3f1c135d4e

# PostgreSQL server image recipe (roles/postgres_cluster): Ubuntu archive packages pinned to exact
# versions (PostgreSQL 18 is in main, with Canonical security maintenance) and Patroni from PyPI,
# verified by SHA-256. A change here produces a new image tag, which only playbooks/upgrade.yml applies.
versions_postgres:
  major: 18
  packages:
    postgresql-18: 18.6-0ubuntu0.26.04.1
    postgresql-client-18: 18.6-0ubuntu0.26.04.1
    postgresql-18-pgaudit: 18.0-2
    pgbackrest: 2.58.0-1
  patroni:
    version: 4.1.5
    url: https://files.pythonhosted.org/packages/63/cb/0ba365e95d648a0592de0fb1a0168cff26a3cf57930d74d88b188b5f9462/patroni-4.1.5-py3-none-any.whl
    sha256: 7aad8c1539e6c51c269a8005169dd54ddc7668437b7900fa6099d7894e224c84

# What the previous release of this repository deployed. CI installs these first
# and upgrades to versions_images, so every release proves its upgrade path.
# Rewritten by tools/release.py bump-upgrade-from <tag> after each release (docs/releasing.md).
versions_upgrade_from:
  keycloak: docker.io/keycloak/keycloak:26.7.5
  openbao: docker.io/openbao/openbao:2.7.0
  postgres_client: docker.io/library/postgres:18.6-alpine
  node_exporter: docker.io/prom/node-exporter:v1.12.0
  prometheus: docker.io/prom/prometheus:v3.14.0
  alertmanager: docker.io/prom/alertmanager:v0.34.0
  blackbox_exporter: docker.io/prom/blackbox-exporter:v0.27.0
  grafana: docker.io/grafana/grafana:13.2.2
  oauth2_proxy: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
  haproxy: docker.io/library/haproxy:3.4.5-alpine
  coraza_spoa: ghcr.io/corazawaf/coraza-spoa:0.8.0
  coraza_spoa_builder: docker.io/library/golang:1.26.8-alpine
  rest_server: docker.io/restic/rest-server:0.13.0
  forgejo: codeberg.org/forgejo/forgejo:15.0.8-rootless
  forgejo_runner: data.forgejo.org/forgejo/runner:12.10.0
  forgejo_runner_job: docker.io/library/node:24.21.0-trixie
  gatus: docker.io/twinproduction/gatus:v5.36.0
  ciso_assistant_backend: ghcr.io/intuitem/ciso-assistant-community/backend:v4.0.9
  ciso_assistant_frontend: ghcr.io/intuitem/ciso-assistant-community/frontend:v4.0.9
  trivy: docker.io/aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  postgres_base: docker.io/library/ubuntu:resolute-20260912
  etcd: gcr.io/etcd-development/etcd:v3.6.14
  postgres_exporter: docker.io/prometheuscommunity/postgres-exporter:v0.20.0
  wazuh_indexer: docker.io/wazuh/wazuh-indexer:4.14.7
  wazuh_manager: docker.io/wazuh/wazuh-manager:4.14.7
  wazuh_dashboard: docker.io/wazuh/wazuh-dashboard:4.14.7
  zot: ghcr.io/project-zot/zot:v2.1.20
  zot_build_base: docker.io/library/debian:13.7-slim
  valkey: docker.io/valkey/valkey:9.1.1-alpine
  redis_exporter: docker.io/oliver006/redis_exporter:v1.92.1
  rabbitmq: docker.io/library/rabbitmq:4.3.5-alpine
  garage: docker.io/dxflrs/garage:v2.4.0
  rclone: docker.io/rclone/rclone:1.71.1
  testssl: ghcr.io/testssl/testssl.sh:3.2@sha256:51918b1e954df0acee8c08d3ad5ce306710e4fefe49ed0e0f92728ecf9e7ff34

# The PostgreSQL server image recipe of the previous release (same shape as versions_postgres).
# Empty until the first release that includes the PostgreSQL product playbook; tools/release.py
# bump-upgrade-from copies versions_postgres here. molecule/postgres-upgrade is skipped while it is empty.
versions_postgres_upgrade_from:
  major: 18
  packages:
    postgresql-18: 18.6-0ubuntu0.26.04.1
    postgresql-client-18: 18.6-0ubuntu0.26.04.1
    postgresql-18-pgaudit: 18.0-2
    pgbackrest: 2.58.0-1
  patroni:
    version: 4.1.5
    url: https://files.pythonhosted.org/packages/63/cb/0ba365e95d648a0592de0fb1a0168cff26a3cf57930d74d88b188b5f9462/patroni-4.1.5-py3-none-any.whl
    sha256: 7aad8c1539e6c51c269a8005169dd54ddc7668437b7900fa6099d7894e224c84

# Images that keep their upstream reference when image_registry_mirror is set (CHG-08, roles/versions
# tasks): the registry cannot serve its own first pull. Pin them by digest if you can.
versions_mirror_exclude: [zot, zot_build_base]
