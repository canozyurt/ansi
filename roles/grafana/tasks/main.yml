---
- name: Check required settings
  ansible.builtin.assert:
    that:
      - grafana_admin_password | length >= 16
      - grafana_secret_key | length >= 32
      - grafana_prometheus_password | length >= 16
      - grafana_metrics_password | length >= 16
      - grafana_root_url is match('^https://')
      - grafana_prometheus_hosts | length > 0
      - not (grafana_oidc_enabled | bool) or grafana_oidc_client_secret | length >= 32
      - not (grafana_oidc_enabled | bool) or grafana_oidc_keycloak_url is match('^https://')
    fail_msg: >-
      Set grafana_admin_password (16+), grafana_secret_key (32+), monitoring_grafana_password and
      monitoring_scrape_password (16+), an https grafana_root_url, at least one Prometheus host, and with
      SSO an https Keycloak URL and grafana_oidc_client_secret (32+). Keep secrets in Vault or OpenBao.
    quiet: true
  no_log: true

- name: Require a highly available deployment (HA-01)
  ansible.builtin.assert:
    that: grafana_cluster_hosts | length >= grafana_min_nodes or grafana_allow_single_node | bool
    fail_msg: >-
      Grafana needs at least {{ grafana_min_nodes }} nodes (found {{ grafana_cluster_hosts | length }}).
      Set monitoring_allow_single_node only for labs and tests.
    quiet: true
  tags: [chk_ha_01]

- name: Register Grafana as an OIDC client in Keycloak
  ansible.builtin.include_role:
    name: oidc_client
  vars:
    oidc_client_enabled: "{{ grafana_oidc_enabled }}"
    oidc_client_id: "{{ grafana_oidc_client_id }}"
    oidc_client_name: Grafana
    oidc_client_secret: "{{ grafana_oidc_client_secret }}"
    oidc_client_keycloak_url: "{{ grafana_oidc_keycloak_url }}"
    oidc_client_realm: "{{ grafana_oidc_realm }}"
    oidc_client_root_url: "{{ grafana_root_url }}"
    oidc_client_redirect_uris: ["{{ grafana_root_url }}/login/generic_oauth"]
    oidc_client_post_logout_redirect_uris: ["{{ grafana_root_url }}/login"]
  when: grafana_oidc_enabled | bool
  tags: [chk_iam_01, chk_iam_09]

- name: Deploy Grafana
  ansible.builtin.import_tasks: deploy.yml

- name: Wait for the node to be healthy
  ansible.builtin.import_tasks: health.yml
