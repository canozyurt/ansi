---
galaxy_info:
  role_name: grafana
  author: compliant-infra-ansible contributors
  description: Stateless Grafana nodes with Keycloak SSO, provisioned Prometheus datasources and dashboards
  license: Apache-2.0
  min_ansible_version: "2.17"
  platforms:
    - name: Debian
      versions: [bookworm]
    - name: Ubuntu
      versions: [jammy, noble]
dependencies:
  - role: versions
  # Signature check before any container is created (CHG-08).
  - role: image_verify
    image_verify_images: ["{{ grafana_image }}"]
  - role: rbac_model
