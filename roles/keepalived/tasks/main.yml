---
- name: Require at least two VRRP peers (HA-01)
  ansible.builtin.assert:
    that: keepalived_peers | length >= keepalived_min_nodes or keepalived_allow_single_node | bool
    fail_msg: >-
      keepalived needs at least {{ keepalived_min_nodes }} peers (found {{ keepalived_peers | length }}).
      Set keepalived_allow_single_node only for labs and tests.
    quiet: true
  tags: [chk_ha_01]

- name: Check the VRRP instances
  ansible.builtin.assert:
    that:
      - item.vips | length > 0
      - item.virtual_router_id | int >= 1 and item.virtual_router_id | int <= 255
      - item.vips | select('match', '^[0-9a-fA-F:.]+/[0-9]{1,3}$') | list | length == item.vips | length
    fail_msg: "Each VRRP instance needs VIPs in CIDR form and a router id 1-255: {{ item }}"
    quiet: true
  loop: "{{ keepalived_instances }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install keepalived and curl for the health check
  ansible.builtin.apt:
    name: ["{{ keepalived_package }}", curl]
    state: present
  tags: [chk_ha_01]

- name: Create the unprivileged user that runs the health check
  ansible.builtin.user:
    name: "{{ keepalived_script_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /nonexistent

- name: Create the script and textfile directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /usr/local/libexec/keepalived
    - "{{ keepalived_textfile_dir }}"

- name: Install the health check and state notification scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/libexec/keepalived/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [check_edge, notify_state]
  notify: Reload keepalived

- name: Write the keepalived configuration (contains the VRRP password when set)
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0600"
    validate: keepalived --config-test --use-file %s
  no_log: "{{ keepalived_auth_pass | length > 0 }}"
  notify: Reload keepalived
  tags: [chk_ha_01]

- name: Start keepalived and enable it at boot
  ansible.builtin.service:
    name: keepalived
    state: started
    enabled: true
  tags: [chk_ha_01]
