---
galaxy_info:
  role_name: prometheus
  author: compliant-infra-ansible contributors
  description: Highly available Prometheus with a scrape catalog, TLS probes and compliance alert rules
  license: Apache-2.0
  min_ansible_version: "2.17"
  platforms:
    - name: Debian
      versions: [bookworm]
    - name: Ubuntu
      versions: [jammy, noble]
dependencies:
  - role: versions
  # Signature check before any container is created (CHG-08).
  - role: image_verify
    image_verify_images: ["{{ prometheus_image }}"]
