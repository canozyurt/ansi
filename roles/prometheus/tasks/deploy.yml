---
- name: Install Python libraries the Docker and crypto modules need
  ansible.builtin.apt:
    name: [python3-requests, python3-cryptography]
    state: present

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ prometheus_container_uid }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ prometheus_data_dir }}", mode: "0750" }
    - { path: "{{ prometheus_data_dir }}/config", mode: "0750" }
    - { path: "{{ prometheus_data_dir }}/config/rules", mode: "0750" }
    - { path: "{{ prometheus_data_dir }}/config/secrets", owner: "{{ prometheus_container_uid }}", mode: "0700" }
    - { path: "{{ prometheus_data_dir }}/data", owner: "{{ prometheus_container_uid }}", mode: "0750" }

- name: Get the TLS certificate (internal PKI, supplied files, or temporary self-signed)
  ansible.builtin.include_role:
    name: tls_cert
  vars:
    tls_cert_name: prometheus
    tls_cert_dir: "{{ prometheus_data_dir }}/config/tls"
    tls_cert_owner: "{{ prometheus_container_uid }}"
    tls_cert_common_name: "{{ prometheus_external_url | urlsplit('hostname') }}"
    tls_cert_alt_names: ["{{ inventory_hostname }}"]
    tls_cert_src_cert: "{{ prometheus_tls_cert_file }}"
    tls_cert_src_key: "{{ prometheus_tls_key_file }}"
  tags: [chk_sec_03]

- name: Restart Prometheus when its certificate changed
  ansible.builtin.debug:
    msg: The TLS certificate changed; Prometheus restarts to load it.
  changed_when: tls_cert_changed | bool
  notify: Restart prometheus

- name: Write the web configuration (TLS and basic auth, no anonymous access)
  ansible.builtin.include_role:
    name: prometheus_web_config
  vars:
    prometheus_web_config_path: "{{ prometheus_data_dir }}/config/web.yml"
    prometheus_web_config_container_tls_dir: /etc/prometheus/tls
    prometheus_web_config_owner: "{{ prometheus_container_uid }}"
    prometheus_web_config_group: "{{ prometheus_container_uid }}"
    prometheus_web_config_users: "{{ prometheus_web_users | combine(prometheus_web_users_extra) }}"
  tags: [chk_sec_03, chk_iam_01]

- name: Write the scrape credentials
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ prometheus_data_dir }}/config/secrets/{{ item.key }}"
    owner: "{{ prometheus_container_uid }}"
    group: "{{ prometheus_container_uid }}"
    mode: "0400"
  loop: "{{ prometheus_secret_files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    prometheus_token_jobs: "{{ prometheus_jobs | selectattr('bearer_token', 'defined') | list }}"
    prometheus_secret_files: >-
      {{ dict([('scrape_password', prometheus_scrape_password)]
         + (prometheus_token_jobs | map(attribute='name') | map('regex_replace', '$', '.token')
            | zip(prometheus_token_jobs | map(attribute='bearer_token')) | list)) }}
  no_log: true
  notify: Reload prometheus
  tags: [chk_sec_02]

- name: Write the alert rules
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ prometheus_data_dir }}/config/rules/{{ item }}"
    owner: root
    group: "{{ prometheus_container_uid }}"
    mode: "0640"
    variable_start_string: "[["
    variable_end_string: "]]"
    block_start_string: "[%"
    block_end_string: "%]"
    validate: >-
      docker run --rm --network=none --user=0:0 --entrypoint=/bin/promtool --volume=%s:/rules.yml:ro
      {{ prometheus_image }} check rules /rules.yml
  loop: [platform.yml, compliance.yml]
  notify: Reload prometheus
  tags: [chk_log_05, chk_log_03, chk_log_06, chk_sec_05, chk_hrd_04, chk_bck_01, chk_bck_03]

- name: Write the rules registered by other roles
  ansible.builtin.copy:
    content: "{{ {'groups': prometheus_extra_rule_groups} | to_nice_yaml(indent=2, width=1000) }}"
    dest: "{{ prometheus_data_dir }}/config/rules/extra.yml"
    owner: root
    group: "{{ prometheus_container_uid }}"
    mode: "0640"
    validate: >-
      docker run --rm --network=none --user=0:0 --entrypoint=/bin/promtool --volume=%s:/rules.yml:ro
      {{ prometheus_image }} check rules /rules.yml
  vars:
    prometheus_extra_rule_groups: >-
      {{ prometheus_alert_rules_extra + (query('ansible.builtin.varnames', '^prometheus_rules_.+')
         | map('extract', vars) | flatten) }}
  notify: Reload prometheus
  tags: [chk_log_05]

- name: Write the Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_data_dir }}/config/prometheus.yml"
    owner: root
    group: "{{ prometheus_container_uid }}"
    mode: "0640"
  notify: Reload prometheus
  tags: [chk_log_05, chk_sec_05]

- name: Run the Prometheus container
  community.docker.docker_container:
    name: "{{ prometheus_container_name }}"
    image: "{{ prometheus_image }}"
    command: "{{ prometheus_args + prometheus_retention_size_args }}"
    network_mode: host
    user: "{{ prometheus_container_uid }}:{{ prometheus_container_uid }}"
    volumes:
      - "{{ prometheus_data_dir }}/config:/etc/prometheus:ro"
      - "{{ prometheus_data_dir }}/data:/prometheus"
      # The host trust store holds the internal CA (tls_cert), so target certificates verify.
      - /etc/ssl/certs:/etc/ssl/certs:ro
    read_only: true
    restart_policy: unless-stopped
    memory: "{{ prometheus_memory_limit }}"
    pids_limit: 1024
    cap_drop: [ALL]
    security_opts: [no-new-privileges:true]
    labels:
      com.compliant-infra.role: prometheus
    state: started
  vars:
    prometheus_args:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time={{ prometheus_retention_days | int }}d
      - --web.config.file=/etc/prometheus/web.yml
      - --web.listen-address=:{{ prometheus_port }}
      - --web.external-url={{ prometheus_external_url }}
    prometheus_retention_size_args: >-
      {{ ['--storage.tsdb.retention.size=' ~ prometheus_retention_size] if prometheus_retention_size | length > 0 else [] }}
  register: prometheus_container
  tags: [chk_hrd_02, chk_log_05]
