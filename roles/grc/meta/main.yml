---
galaxy_info:
  role_name: grc
  author: compliant-infra-ansible contributors
  description: CISO Assistant Community Edition (GRC, compliance evidence) with OIDC, TLS and backups
  license: Apache-2.0
  min_ansible_version: "2.17"
  platforms:
    - name: Debian
      versions: [bookworm]
    - name: Ubuntu
      versions: [jammy, noble]
dependencies:
  - role: versions
  # Signature check before any container is created (CHG-08).
  - role: image_verify
    image_verify_images: ["{{ grc_backend_image }}", "{{ grc_frontend_image }}", "{{ grc_proxy_image }}", "{{ grc_postgres_client_image }}"]
  - role: rbac_model
