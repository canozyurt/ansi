---
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-s]
  - repo: local
    hooks:
      - id: checklist
        name: compliance checklist
        entry: python3 tools/checklist.py check
        language: system
        pass_filenames: false
        files: ^(compliance/|roles/|playbooks/|molecule/|\.github/)
      - id: vault-check
        name: vault_* values are encrypted (SEC-01)
        entry: python3 tools/vault_check.py
        language: system
        pass_filenames: false
        files: \.ya?ml$
      - id: pins
        name: versions, collections and downloads are pinned (CHG-05)
        entry: python3 tools/pins.py --quiet
        language: system
        pass_filenames: false
        files: ^(roles/|playbooks/|inventories/|requirements|\.github/|\.pre-commit-config\.yaml)
      - id: container-policy
        name: container policy (HRD-02)
        entry: python3 tools/container_policy.py
        language: system
        pass_filenames: false
        files: ^(roles/|compliance/container-policy\.yml)
      - id: inventory-lint
        name: inventories keep environments apart (CHG-04)
        entry: python3 tools/inventory_lint.py
        language: system
        pass_filenames: false
        files: ^inventories/
      - id: tool-registry
        name: adopted tools are reviewed (EVD-04)
        entry: python3 tools/tool_registry.py
        language: system
        pass_filenames: false
        files: ^(roles/versions/|compliance/tools\.yml)
