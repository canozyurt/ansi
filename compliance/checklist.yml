---
# Machine-readable compliance checklist.
# Human view: the "Compliance checklist" tab of the scope doc.
#
# status: not_started | designed | implemented | verified
# Tasks that contribute to an item carry the tag chk_<id> (e.g. chk_iam_06 for IAM-06).
# A person sets the status; tools/checklist.py fails CI when the status claims more than the code backs:
#   implemented -> needs at least one tagged task in roles/ or playbooks/
#   verified    -> additionally needs a tagged task in a Molecule verify playbook
#
# Control references: SOC 2 = 2017 Trust Services Criteria, iso27001 = ISO/IEC 27001:2022 Annex A,
# iso27017 = ISO/IEC 27017:2015 (CLD.* controls; ext.* = guidance on 27002:2013 controls).
# Mappings are a first pass and must be confirmed against the standards.

domains:
  IAM: "Identity and access"
  SEC: "Secrets and cryptography"
  LOG: "Logging and monitoring"
  HRD: "Hardening and vulnerabilities"
  NET: "Network"
  BCK: "Backup and recovery"
  HA: "Availability and disaster recovery"
  CHG: "Change management"
  DAT: "Data and cloud customer duties"
  EVD: "Evidence and governance"

requirements:
  - id: IAM-01
    requirement: "Every web UI, API admin and host login authenticates through the central IdP (OIDC/SAML/LDAP); the only local account is a sealed break-glass account"
    controls:
      soc2: [CC6.1]
      iso27001: ["5.15", "5.16", "8.5"]
      iso27017: []
    check: "Molecule test: local login disabled; break-glass use raises an alert"
    status: not_started
  - id: IAM-02
    requirement: "MFA required for all users; phishing-resistant MFA (WebAuthn) for admins"
    controls:
      soc2: [CC6.1]
      iso27001: ["8.5"]
      iso27017: []
    check: "IdP policy export checked in CI and weekly"
    status: not_started
  - id: IAM-03
    requirement: "Access granted only through IdP groups mapped to roles; no per-user grants"
    controls:
      soc2: [CC6.3]
      iso27001: ["5.15", "5.18", "8.3"]
      iso27017: []
    check: "Config test: authorization rules reference groups only"
    status: designed
    progress: "Role model and group mapping validated by roles/rbac_model; service roles consume rbac_model_role_groups as they are added."
  - id: IAM-04
    requirement: "Disabling a user in the directory removes all access (web sessions, SSH, VPN) within 24 hours"
    controls:
      soc2: [CC6.2, CC6.3]
      iso27001: ["5.18"]
      iso27017: []
    check: "Integration test: disable a test user, assert every service denies it"
    status: not_started
  - id: IAM-05
    requirement: "Access review report (users, groups, admins) produced every quarter"
    controls:
      soc2: [CC6.2]
      iso27001: ["5.18"]
      iso27017: []
    check: "Scheduled job stores the report as evidence"
    status: not_started
  - id: IAM-06
    requirement: "SSH allows no passwords and no direct root login; admins use short-lived certificates"
    controls:
      soc2: [CC6.1]
      iso27001: ["8.2", "8.5"]
      iso27017: []
    check: "CIS benchmark scan; sshd config test"
    status: designed
    progress: "Done: no passwords, no root, key/cert only, modern crypto (roles/ssh_hardening). Remaining: SSH CA for short-lived certificates."
  - id: IAM-07
    requirement: "Privileged sessions are recorded and logged centrally"
    controls:
      soc2: [CC6.1, CC7.2]
      iso27001: ["8.2", "8.15"]
      iso27017: ["CLD.12.1.5"]
    check: "Test: an admin session appears in the SIEM"
    status: not_started
  - id: IAM-08
    requirement: "Services use short-lived or rotated credentials from the secrets manager; no shared static passwords"
    controls:
      soc2: [CC6.1]
      iso27001: ["5.17"]
      iso27017: []
    check: "Secrets manager audit: every credential has a rotation policy"
    status: not_started
  - id: IAM-09
    requirement: "Every service deploys the default roles (platform-admin, security-admin, operator, developer, auditor, member) mapped to its native permissions; organizations only assign groups to roles"
    controls:
      soc2: [CC6.1, CC6.3]
      iso27001: ["5.3", "5.15", "5.18", "8.2"]
      iso27017: []
    check: "Integration test: a test user in each role gets exactly the permissions in the role matrix"
    status: designed
    progress: "Default roles defined in roles/rbac_model; per-service mappings come with each service role."
  - id: SEC-01
    requirement: "No secrets in git, inventories or images"
    controls:
      soc2: [CC6.1]
      iso27001: ["5.17", "8.4"]
      iso27017: []
    check: "Secret scanning (e.g. gitleaks) in CI and on images"
    status: not_started
  - id: SEC-02
    requirement: "Services read secrets at runtime from the secrets manager; every read is audited"
    controls:
      soc2: [CC6.1]
      iso27001: ["5.17", "8.24"]
      iso27017: []
    check: "Molecule test: no plaintext secrets on disk; audit log enabled"
    status: not_started
  - id: SEC-03
    requirement: "All traffic, internal included, uses TLS 1.2 or newer with weak ciphers disabled"
    controls:
      soc2: [CC6.7]
      iso27001: ["8.20", "8.24"]
      iso27017: []
    check: "TLS scanner (e.g. testssl.sh) against every endpoint weekly"
    status: not_started
  - id: SEC-04
    requirement: "Data at rest is encrypted: disks, databases, backups and object storage"
    controls:
      soc2: [CC6.1, C1.1]
      iso27001: ["8.24"]
      iso27017: []
    check: "Host facts check for LUKS or provider encryption; service config tests"
    status: not_started
  - id: SEC-05
    requirement: "Certificates renew automatically; an alert fires 14 days before any expiry"
    controls:
      soc2: [CC6.7]
      iso27001: ["8.24"]
      iso27017: []
    check: "Monitoring rule plus expiry scan"
    status: not_started
  - id: SEC-06
    requirement: "Encryption keys have a defined rotation period that is enforced"
    controls:
      soc2: [CC6.1]
      iso27001: ["8.24"]
      iso27017: ["ext. 10.1.2"]
    check: "Secrets manager key metadata checked weekly"
    status: not_started
  - id: LOG-01
    requirement: "Every host and service ships auth, admin, audit and application logs to central logging"
    controls:
      soc2: [CC7.2]
      iso27001: ["8.15"]
      iso27017: ["CLD.12.4.5"]
    check: "Molecule test of the agent; SIEM shows a recent event per host"
    status: designed
    progress: "Done: persistent journald, auditd rules, Docker audit rules. Remaining: log shipping to central logging."
  - id: LOG-02
    requirement: "Logs are tamper-evident, access-restricted and kept 12 months (at least 90 days searchable)"
    controls:
      soc2: [CC7.2]
      iso27001: ["8.15"]
      iso27017: []
    check: "Retention and access policy config test"
    status: not_started
  - id: LOG-03
    requirement: "All clocks sync to the same time source; drift raises an alert"
    controls:
      soc2: [CC7.2]
      iso27001: ["8.17"]
      iso27017: []
    check: "chrony check in monitoring"
    status: designed
    progress: "Done: chrony with common sources, clock changes logged. Remaining: drift alert in monitoring."
  - id: LOG-04
    requirement: "Security events (failed logins, privilege use, file changes, intrusions) alert the on-call with a severity"
    controls:
      soc2: [CC7.2, CC7.3]
      iso27001: ["8.16"]
      iso27017: []
    check: "Test event generated in CI must produce an alert"
    status: not_started
  - id: LOG-05
    requirement: "Every service has health metrics, uptime checks and capacity alerts"
    controls:
      soc2: [A1.1, CC7.2]
      iso27001: ["8.6", "8.16"]
      iso27017: []
    check: "CI asserts each role registers scrape targets and alert rules"
    status: not_started
  - id: LOG-06
    requirement: "A log source or agent going silent raises an alert"
    controls:
      soc2: [CC7.2]
      iso27001: ["8.16"]
      iso27017: []
    check: "Monitoring rule: missing heartbeat"
    status: not_started
  - id: HRD-01
    requirement: "Hosts pass the CIS Level 1 benchmark for their Debian/Ubuntu version; exceptions are documented"
    controls:
      soc2: [CC6.8, CC7.1]
      iso27001: ["8.9"]
      iso27017: ["CLD.9.5.2"]
    check: "OpenSCAP or ansible-lockdown audit in CI and weekly"
    status: designed
    progress: "Done: CIS L1 subset (sysctl, modules, core dumps, sudo, accounts, services). Remaining: full benchmark scan (OpenSCAP) in CI."
  - id: HRD-02
    requirement: "Containers run as non-root from pinned, signed images with minimal base and read-only filesystem where possible"
    controls:
      soc2: [CC7.1, CC8.1]
      iso27001: ["8.9", "8.19"]
      iso27017: []
    check: "Policy check of compose files; image signature verification"
    status: not_started
  - id: HRD-03
    requirement: "Container hosts pass the CIS Docker benchmark"
    controls:
      soc2: [CC6.8]
      iso27001: ["8.9"]
      iso27017: ["CLD.9.5.2"]
    check: "docker-bench-security in CI and weekly"
    status: designed
    progress: "Done: daemon.json hardening, socket permissions, audit rules. Remaining: docker-bench-security run in CI."
  - id: HRD-04
    requirement: "Security patches applied within 14 days for critical and 30 days for high severity"
    controls:
      soc2: [CC7.1]
      iso27001: ["8.8"]
      iso27017: []
    check: "Patch-age report from hosts and images"
    status: designed
    progress: "Done: unattended security upgrades. Remaining: patch-age report against the 14/30-day SLA."
  - id: HRD-05
    requirement: "Hosts and images are scanned for vulnerabilities weekly; findings are tracked to closure"
    controls:
      soc2: [CC7.1]
      iso27001: ["8.8"]
      iso27017: []
    check: "Scanner results stored as evidence; open findings past due alert"
    status: not_started
  - id: HRD-06
    requirement: "File integrity monitoring and host intrusion detection run on every host"
    controls:
      soc2: [CC6.8, CC7.1]
      iso27001: ["8.7", "8.16"]
      iso27017: []
    check: "Agent status check in SIEM"
    status: not_started
  - id: NET-01
    requirement: "Every host firewall denies inbound by default; only declared ports are open"
    controls:
      soc2: [CC6.6]
      iso27001: ["8.20"]
      iso27017: []
    check: "External port scan compared to the declared list"
    status: implemented
    progress: "Default-deny nftables with declared ports and published container ports (roles/firewall); verified in Molecule."
  - id: NET-02
    requirement: "SSH, admin UIs and databases are reachable only through the VPN or bastion"
    controls:
      soc2: [CC6.6]
      iso27001: ["8.20", "8.22"]
      iso27017: ["CLD.13.1.4"]
    check: "Port scan from the internet finds no management ports"
    status: designed
    progress: "Done: SSH only from firewall_mgmt_cidrs. Remaining: admin UIs and databases as services are added."
  - id: NET-03
    requirement: "Management, application and data networks are separated; traffic between them is allowed by explicit rule"
    controls:
      soc2: [CC6.6]
      iso27001: ["8.22"]
      iso27017: ["CLD.9.5.1"]
    check: "Firewall rule test between zones"
    status: designed
    progress: "Zones defined in the inventory; inter-zone rules come with the service roles."
  - id: NET-04
    requirement: "Public endpoints sit behind the reverse proxy with security headers, rate limits and WAF rules"
    controls:
      soc2: [CC6.6]
      iso27001: ["8.20"]
      iso27017: []
    check: "Header and WAF test against each public URL"
    status: not_started
  - id: BCK-01
    requirement: "Every stateful service has an automated, encrypted backup with an off-site copy"
    controls:
      soc2: [A1.2, CC9.1]
      iso27001: ["8.13"]
      iso27017: []
    check: "CI asserts each stateful role defines a backup job; backup age alert"
    status: not_started
  - id: BCK-02
    requirement: "Backups are immutable (append-only) for their retention period"
    controls:
      soc2: [A1.2]
      iso27001: ["8.13"]
      iso27017: []
    check: "Test: deleting a backup with service credentials fails"
    status: not_started
  - id: BCK-03
    requirement: "Restores are tested automatically at least monthly and timed against the RTO"
    controls:
      soc2: [A1.3]
      iso27001: ["8.13", "5.30"]
      iso27017: []
    check: "Restore job result stored as evidence"
    status: not_started
  - id: BCK-04
    requirement: "Each service declares an RTO and RPO, and its backup schedule meets the RPO"
    controls:
      soc2: [A1.2]
      iso27001: ["5.30"]
      iso27017: []
    check: "Lint check: RTO/RPO variables set and consistent with schedule"
    status: not_started
  - id: HA-01
    requirement: "Every Core service runs on 3 or more nodes (or 2 plus a witness) with automatic failover"
    controls:
      soc2: [A1.1, A1.2]
      iso27001: ["8.14"]
      iso27017: []
    check: "CI test kills a node and asserts the service keeps working"
    status: not_started
  - id: HA-02
    requirement: "Each service has a DR runbook, and a DR drill runs every year"
    controls:
      soc2: [A1.3, CC9.1]
      iso27001: ["5.29", "5.30"]
      iso27017: []
    check: "Drill report stored as evidence"
    status: not_started
  - id: CHG-01
    requirement: "All changes go through a pull request with at least one approval on a protected main branch"
    controls:
      soc2: [CC8.1]
      iso27001: ["8.32"]
      iso27017: []
    check: "Branch protection settings exported and checked"
    status: not_started
  - id: CHG-02
    requirement: "Production changes run only from CI, with each run logged (who, what, when)"
    controls:
      soc2: [CC8.1]
      iso27001: ["8.32", "8.15"]
      iso27017: []
    check: "CI run logs shipped to SIEM; host denies ad-hoc Ansible runs"
    status: not_started
  - id: CHG-03
    requirement: "Drift from the declared state is detected and alerted"
    controls:
      soc2: [CC7.1, CC8.1]
      iso27001: ["8.9"]
      iso27017: []
    check: "Scheduled check-mode run; any change counts as drift"
    status: not_started
  - id: CHG-04
    requirement: "Dev, test and production use separate inventories, and production data is never copied to test"
    controls:
      soc2: [CC8.1]
      iso27001: ["8.31", "8.33"]
      iso27017: []
    check: "Inventory lint; no production hosts in test groups"
    status: not_started
  - id: CHG-05
    requirement: "Collections, roles and images are pinned, scanned and listed in an SBOM"
    controls:
      soc2: [CC7.1, CC8.1]
      iso27001: ["8.8", "8.19"]
      iso27017: []
    check: "CI generates the SBOM and fails on unpinned dependencies"
    status: not_started
  - id: CHG-06
    requirement: "Every role has Molecule tests on all supported OS versions, including its checklist items"
    controls:
      soc2: [CC8.1]
      iso27001: ["8.29"]
      iso27017: []
    check: "CI matrix; coverage report of checklist IDs"
    status: not_started
  - id: DAT-01
    requirement: "Each product instance gets its own database or bucket and credentials"
    controls:
      soc2: [C1.1]
      iso27001: ["8.3"]
      iso27017: ["CLD.9.5.1"]
    check: "Product playbook test: no shared credentials between instances"
    status: not_started
  - id: DAT-02
    requirement: "Each data service has export and secure-deletion playbooks that produce deletion evidence"
    controls:
      soc2: [C1.2]
      iso27001: ["8.10"]
      iso27017: ["CLD.8.1.5"]
    check: "Test: export then delete a sample dataset"
    status: not_started
  - id: DAT-03
    requirement: "A shared-responsibility matrix states what the repo, the company and the hosting provider own"
    controls:
      soc2: [CC9.2]
      iso27001: ["5.23"]
      iso27017: ["CLD.6.3.1"]
    check: "Document review each release"
    status: not_started
  - id: EVD-01
    requirement: "Every checklist item maps to tasks and tests; Core items without a test fail CI"
    controls:
      soc2: [CC4.1]
      iso27001: ["5.36"]
      iso27017: []
    check: "CI coverage check"
    status: not_started
  - id: EVD-02
    requirement: "Evidence from every run is stored for 12 months in tamper-evident storage"
    controls:
      soc2: [CC4.1]
      iso27001: ["5.33"]
      iso27017: []
    check: "Evidence store retention test"
    status: not_started
  - id: EVD-03
    requirement: "An asset inventory with an owner per asset is generated from inventory and agents"
    controls:
      soc2: [CC6.1]
      iso27001: ["5.9"]
      iso27017: []
    check: "Weekly report; asset without owner fails"
    status: not_started
  - id: EVD-04
    requirement: "Every adopted tool's free edition covers SSO, audit logs and HA under an OSI licence"
    controls:
      soc2: []
      iso27001: []
      iso27017: []
    project_rule: true
    check: "Reviewed in the pull request that adds the tool"
    status: not_started
