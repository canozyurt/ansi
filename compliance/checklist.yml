---
# Machine-readable compliance checklist.
# Human view: the "Compliance checklist" tab of the scope doc.
#
# status: not_started | designed | implemented | verified
# Tasks that contribute to an item carry the tag chk_<id> (e.g. chk_iam_06 for IAM-06).
# A person sets the status; tools/checklist.py fails CI when the status claims more than the code backs:
#   implemented -> needs at least one tagged task in roles/ or playbooks/, or a tagged CI step in .github/workflows/
#   verified    -> additionally needs a tagged task in a Molecule verify playbook
# core: true marks Core items (identity, secrets, logging/monitoring, hardening, network, backup, change).
# They need a tagged Molecule verify task: CI fails for a Core item marked verified without one and warns
# for one marked implemented (tools/checklist.py --strict-core makes that an error; see EVD-01).
#
# Control references: SOC 2 = 2017 Trust Services Criteria, iso27001 = ISO/IEC 27001:2022 Annex A,
# iso27017 = ISO/IEC 27017:2015 (CLD.* controls; ext.* = guidance on 27002:2013 controls).
# Mappings are a first pass and must be confirmed against the standards.

domains:
  IAM: "Identity and access"
  SEC: "Secrets and cryptography"
  LOG: "Logging and monitoring"
  HRD: "Hardening and vulnerabilities"
  NET: "Network"
  BCK: "Backup and recovery"
  HA: "Availability and disaster recovery"
  CHG: "Change management"
  DAT: "Data and cloud customer duties"
  EVD: "Evidence and governance"
  INC: "Incident management"

requirements:
  - id: IAM-01
    requirement: "Every web UI, API admin and host login authenticates through the central IdP (OIDC/SAML/LDAP); the only local account is a sealed break-glass account"
    core: true
    controls:
      soc2: [CC6.1]
      iso27001: ["5.15", "5.16", "8.5"]
      iso27017: []
    check: "Molecule test: local login disabled; break-glass use raises an alert"
    status: implemented
    progress: "Every UI logs in through Keycloak (docs/sso-matrix.md): Grafana generic OAuth, OpenBao OIDC auth method, Prometheus and Alertmanager behind oauth2-proxy (roles/oauth2_proxy, pinned v7.12.0, PKCE, roles claim checked; basic auth kept for machines and break-glass), Wazuh dashboard, RabbitMQ, Forgejo, GRC and the registry via OIDC, SSH via OpenBao SSH CA certificates. Local logins are break-glass only. Central break-glass alert: one break_glass_accounts list feeds SIEM rules 100121-100123 (decoded logins, application login lines, OpenBao root token) forwarded to Alertmanager. Earlier tested parts: SIEM dashboard redirect and mapping. The new SSO wiring and alert rules are not tested (no Molecule run)."
  - id: IAM-02
    requirement: "MFA required for all users; phishing-resistant MFA (WebAuthn) for admins"
    core: true
    controls:
      soc2: [CC6.1]
      iso27001: ["8.5"]
      iso27017: []
    check: "IdP policy export checked in CI and weekly"
    status: implemented
    progress: "Keycloak browser flow forces WebAuthn for privileged roles and TOTP for everyone else; verified by molecule/keycloak. Remaining: weekly policy export check."
  - id: IAM-03
    requirement: "Access granted only through IdP groups mapped to roles; no per-user grants"
    core: true
    controls:
      soc2: [CC6.3]
      iso27001: ["5.15", "5.18", "8.3"]
      iso27017: []
    check: "Config test: authorization rules reference groups only"
    status: implemented
    progress: "tools/rbac_lint.py runs in CI (step chk_iam_03): every role-mapping variable must name rbac_model roles, group assignments map groups (no e-mails), and per-user constructs fail (allow lists of e-mails/users, role expressions on login/e-mail, OpenBao roles bound to a user claim, userpass/entity grants, per-user Keycloak role mappings, named sudoers lines, literal users lists); exceptions need a reason in compliance/rbac-lint-allow.yml. Self-tests in tools/tests/test_identity_gates.py pass. oauth2-proxy admits roles from rbac_model capabilities only. Runs clean on the repo (static check; services not tested)."
  - id: IAM-04
    requirement: "Disabling a user in the directory removes all access (web sessions, SSH, VPN) within 24 hours"
    core: true
    controls:
      soc2: [CC6.2, CC6.3]
      iso27001: ["5.18"]
      iso27017: []
    check: "Integration test: disable a test user, assert every service denies it"
    status: implemented
    progress: "Disabling a user in Keycloak ends access within a day: VPN peers are tied to Keycloak users by wireguard-idp-sync (timer every 15 min, service account with view-users only; peers of missing/disabled users or users without a required role are removed and kept out by the minute check; the deny list is kept and VpnIdpSyncFailing alerts when Keycloak is unreachable); sessions capped at session_max_hours 24 by asserts (Keycloak SSO and offline sessions, OpenBao OIDC tokens and SSH certificates, Grafana, oauth2-proxy refresh every 5 min); SSH certificates 8 h. Earlier tested: VPN peer expiry. playbooks/test_offboarding.yml (disable one user, assert VPN, new logins, refresh token, old sessions and token lifetimes) is written, not run. Sync script logic checked on sample files only (not tested on a gateway)."
  - id: IAM-05
    requirement: "Access review report (users, groups, admins) produced every quarter"
    core: true
    controls:
      soc2: [CC6.2]
      iso27001: ["5.18"]
      iso27017: []
    check: "Scheduled job stores the report as evidence"
    status: implemented
    progress: "roles/access_review (playbooks/audits.yml): quarterly timer on every host writes CSV+JSON evidence under /var/lib/compliance-evidence/access-review/<quarter>/ - local accounts (shell, password/lock state, groups, sudo, SSH principals and keys) on every host; on the first Keycloak node users, groups, role assignments, admins, last login, disabled, stale and service accounts from the Keycloak admin API through a read-only client-credentials service account (roles/keycloak creates it when keycloak_access_review_client_secret is set), plus VPN peers with owner and expiry. Registered with backup_register and uploaded to the evidence store; AccessReviewOverdue alerts when a report is older than 100 days; playbooks/access_review.yml runs it on demand and collects a bundle. Classification checked on sample data; nothing run against Keycloak (not tested)."
  - id: IAM-06
    requirement: "SSH allows no passwords and no direct root login; admins use short-lived certificates"
    core: true
    controls:
      soc2: [CC6.1]
      iso27001: ["8.2", "8.5"]
      iso27017: []
    check: "CIS benchmark scan; sshd config test"
    status: implemented
    progress: "No passwords, no root, key/cert only (ssh_hardening); OpenBao SSH CA (8 h certs) trusted; principals platform-admin/operator mapped to accounts (roles/admin_login, roles/bastion); bastion refuses passwords, plain keys and other principals (tested). Remaining: ssh_hardening_allow_authorized_keys: false fleet-wide once the CA is rolled out (break-glass only)."
  - id: IAM-07
    requirement: "Privileged sessions are recorded and logged centrally"
    core: true
    controls:
      soc2: [CC6.1, CC7.2]
      iso27001: ["8.2", "8.15"]
      iso27017: ["CLD.12.1.5"]
    check: "Test: an admin session appears in the SIEM"
    status: implemented
    progress: "auditd execve rules for auid>=1000 (key session_cmd), pam_tty_audit for root sessions, sudo I/O logs, sshd logs the cert key ID and the jump target (roles/session_audit, roles/bastion; rules loaded and checked with auditctl -l in Molecule). Remaining: test that a session reaches the SIEM (depends on the SIEM agent shipping audit.log). Done: audit.log and journald ship to the SIEM through the Wazuh agent (collection configured; molecule/siem tests journald end to end, not a session_cmd audit record specifically)."
  - id: IAM-08
    requirement: "Services use short-lived or rotated credentials from the secrets manager; no shared static passwords"
    core: true
    controls:
      soc2: [CC6.1]
      iso27001: ["5.17"]
      iso27017: []
    check: "Secrets manager audit: every credential has a rotation policy"
    status: implemented
    progress: "roles/openbao_secrets keeps service secrets in OpenBao KV (services/<service>): generated (or seeded once from the vault), rotated every rotate_days by playbooks/rotate_secrets.yml (database passwords applied to PostgreSQL first, OIDC client secrets re-registered), per-service read-only policy and host-bound AppRole; rotation report and metrics with ServiceSecretRotationOverdue alert. Migrated: Keycloak, Grafana, Forgejo, GRC, oauth2-proxy, VPN sync client, Valkey and RabbitMQ application users, PostgreSQL service users. Still static in Ansible Vault (docs/secrets.md): OpenBao's own material, Wazuh internal users, Patroni/etcd, Garage, backup repository and Prometheus machine accounts. Fallback secrets_backend vault-file (example inventory default for the first install). Earlier tested: PostgreSQL dynamic users against an OpenBao dev server. The new role is not tested."
  - id: IAM-09
    requirement: "Every service deploys the default roles (platform-admin, security-admin, operator, developer, auditor, member) mapped to its native permissions; organizations only assign groups to roles"
    core: true
    controls:
      soc2: [CC6.1, CC6.3]
      iso27001: ["5.3", "5.15", "5.18", "8.2"]
      iso27017: []
    check: "Integration test: a test user in each role gets exactly the permissions in the role matrix"
    status: implemented
    progress: "compliance/role-matrix.yml states each default role's access in 13 services; tools/role_matrix.py (CI step chk_iam_09) checks it against the mapping variables in the code and that every mapping variable has a row (self-tests pass). playbooks/test_role_matrix.yml (one throwaway user per role through group iam-test-<role>, real TOTP/WebAuthn second factor via tools/sso_probe.py, observed access compared with the matrix, report kept as evidence) is written, not run. Earlier: SIEM role mappings tested."
  - id: SEC-01
    requirement: "No secrets in git, inventories or images"
    core: true
    controls:
      soc2: [CC6.1]
      iso27001: ["5.17", "8.4"]
      iso27017: []
    check: "Secret scanning (e.g. gitleaks) in CI and on images"
    status: implemented
    progress: "CI (.github/workflows/ci.yml, lint job): gitleaks v8.28.0 over the whole git history with .gitleaks.toml (default rules; allowlist only for test-only-* Molecule values, Jinja references and obvious placeholders), also as a pre-commit hook; tools/vault_check.py fails on plain-text vault_* values or unencrypted *vault*.yml vars files outside inventories/example (also for operators' private inventory repos); images job: Trivy --scanners vuln,secret on every pinned image, gated by tools/trivy_gate.py (secrets fail unless waived). Gate scripts self-tested on sample files (tools/tests); the CI jobs have not run yet (not tested). docs/supply-chain.md."
  - id: SEC-02
    requirement: "Services read secrets at runtime from the secrets manager; every read is audited"
    core: true
    controls:
      soc2: [CC6.1]
      iso27001: ["5.17", "8.24"]
      iso27017: []
    check: "Molecule test: no plaintext secrets on disk; audit log enabled"
    status: implemented
    progress: "Services read secrets at runtime: OpenBao Agent (pinned openbao image, one per service and host, AppRole bound to the host) renders them into tmpfs (/run/compliant-secrets, 0400, service uid) and a path unit restarts the service on change; every read is in OpenBao's audit log (audit devices verified by molecule/openbao). Roles remove their old on-disk copies; playbooks/verify_secrets_on_disk.yml scans /etc and /opt for any OpenBao-managed value and keeps a report as evidence. Fallback secrets_backend vault-file (0600 files) stays for labs and the first install. The agent, rendering and scan are not tested."
  - id: SEC-03
    requirement: "All traffic, internal included, uses TLS 1.2 or newer with weak ciphers disabled"
    core: true
    controls:
      soc2: [CC6.7]
      iso27001: ["8.20", "8.24"]
      iso27017: []
    check: "TLS scanner (e.g. testssl.sh) against every endpoint weekly"
    status: implemented
    progress: "Keycloak serves TLS 1.2+ only, no plain HTTP (tested). Remaining: issued certs from PKI. Edge terminates TLS 1.2+ (Mozilla intermediate) and re-encrypts to backends verified against the internal CA (tested). Unbound serves DNS-over-TLS on 853 and forwards upstream over DoT. SIEM: SIEM: TLS 1.2+ on indexer (9200/9300), manager API, enrollment and dashboard; node certificates from a dedicated SIEM CA (roles/wazuh_certs), HTTP certificates from tls_cert when the internal PKI is set. Valkey: TLS 1.2+ only for clients, replication and Sentinel, plaintext port disabled (tested single node). RabbitMQ: AMQPS, management and Prometheus over TLS only, Erlang distribution and CLI tools over TLS (peer verification with CA-signed certificates; encrypted but unverified with temporary self-signed ones) (not tested). Garage: S3 API and metrics through an HAProxy TLS sidecar, plaintext listeners on loopback, RPC encrypted with the cluster secret (not tested). Weekly TLS scan (roles/tls_scan, monitoring hosts): testssl.sh container against every https scrape target, every edge hostname and extra (STARTTLS) endpoints; JSON evidence under /var/lib/compliance-evidence/tls/, per-target metrics and alerts for protocols below TLS 1.2, weak or obsolete ciphers, certificate problems and missed scans (parser checked on a sample report; not run, not tested)."
  - id: SEC-04
    requirement: "Data at rest is encrypted: disks, databases, backups and object storage"
    core: true
    controls:
      soc2: [CC6.1, C1.1]
      iso27001: ["8.24"]
      iso27017: []
    check: "Host facts check for LUKS or provider encryption; service config tests"
    status: implemented
    progress: "roles/disk_encryption in the baseline checks every data path (encrypted_mounts_required: /var/lib/docker, /opt, /srv, /var/backups) for a dm-crypt layer under it or a declared provider encryption (disk_encryption_provider, an attestation with evidence), exports disk_encryption_mount_protected/_dmcrypt metrics (DataMountNotEncrypted alert) and fails the run when disk_encryption_enforce is true (set in the example inventory); optional clevis binding of existing LUKS volumes to Tang and/or TPM2. docs/disk-encryption.md covers provider encryption, LUKS at build time and clevis/tang/TPM. Not tested. Backups are encrypted client-side by restic (AES-256, tested: no plaintext in the repository). PostgreSQL: pgBackRest repositories encrypted (aes-256-cbc, tested: no plaintext in the repository); the role checks for a dm-crypt device under the data directory, warns or fails, and exports postgres_data_dir_encrypted (PostgresDataNotEncrypted alert); LUKS itself is a host prerequisite. Valkey, RabbitMQ, Garage: same dm-crypt check and datastore_data_dir_encrypted metric with *DataNotEncrypted alerts; LUKS is a host prerequisite; Garage applications may add SSE-C per object (Valkey tested single node; RabbitMQ and Garage not tested)."
  - id: SEC-05
    requirement: "Certificates renew automatically; an alert fires 14 days before any expiry"
    core: true
    controls:
      soc2: [CC6.7]
      iso27001: ["8.24"]
      iso27017: []
    check: "Monitoring rule plus expiry scan"
    status: implemented
    progress: "Done: tls_cert renews 30 days before expiry; blackbox_exporter probes every https catalog endpoint plus blackbox_extra_targets and CertificateExpiringSoon fires under 14 days. Remaining: expiry scan of certificates not served on a network port. OpenBao root and intermediate CA with role server (90-day EC certs, auto-tidy) and the ansible-pki AppRole that tls_cert uses (molecule/openbao)."
  - id: SEC-06
    requirement: "Encryption keys have a defined rotation period that is enforced"
    core: true
    controls:
      soc2: [CC6.1]
      iso27001: ["8.24"]
      iso27017: ["ext. 10.1.2"]
    check: "Secrets manager key metadata checked weekly"
    status: implemented
    progress: "OpenBao transit keys rotate automatically every 90 days and cannot be deleted or exported (molecule/openbao). Remaining: weekly key-metadata evidence job; CA and seal key rotation runbooks."
  - id: LOG-01
    requirement: "Every host and service ships auth, admin, audit and application logs to central logging"
    core: true
    controls:
      soc2: [CC7.2]
      iso27001: ["8.15"]
      iso27017: ["CLD.12.4.5"]
    check: "Molecule test of the agent; SIEM shows a recent event per host"
    status: implemented
    progress: "Done: persistent journald, auditd rules, Docker audit rules, Keycloak login and admin events as JSON logs.  Edge access and WAF logs are JSON in journald. OpenBao audit log to stdout and a file. PostgreSQL: pgaudit (DDL, role) plus connection/disconnection logging to journald, Patroni and etcd JSON logs (tested). SIEM: Wazuh agent on every host ships journald (all container output, sshd/sudo/PAM), /var/log/audit/audit.log and the auth log to a 3-node manager cluster; events are indexed in a 3-node indexer (alerts, plus archives when enabled). Tested: a logger marker is searchable in wazuh-archives-* (molecule/siem)."
  - id: LOG-02
    requirement: "Logs are tamper-evident, access-restricted and kept 12 months (at least 90 days searchable)"
    core: true
    controls:
      soc2: [CC7.2]
      iso27001: ["8.15"]
      iso27017: []
    check: "Retention and access policy config test"
    status: implemented
    progress: "SIEM: ISM policy: searchable 90 days, read-only after that, deleted at 365 days (both variables) on wazuh-alerts/archives/security-auditlog; security-plugin audit log (REST, logins, config changes) on; anonymous access refused. Optional nightly S3 snapshots when wazuh_s3_* are set (not tested)."
  - id: LOG-03
    requirement: "All clocks sync to the same time source; drift raises an alert"
    core: true
    controls:
      soc2: [CC7.2]
      iso27001: ["8.17"]
      iso27017: []
    check: "chrony check in monitoring"
    status: implemented
    progress: "Done: chrony with common sources, clock changes logged; node_exporter timex metrics with ClockNotSynchronised and ClockDrift (>50 ms) alerts."
  - id: LOG-04
    requirement: "Security events (failed logins, privilege use, file changes, intrusions) alert the on-call with a severity"
    core: true
    controls:
      soc2: [CC7.2, CC7.3]
      iso27001: ["8.16"]
      iso27017: []
    check: "Test event generated in CI must produce an alert"
    status: implemented
    progress: "SIEM: Rules at level >= 10 go to Alertmanager through a custom integration (custom-alertmanager); optional e-mail. Test event: logger compliant-infra-siem-test <x> raises rule 100100 (level 12); tested to reach the alerts index and a stand-in Alertmanager. Remaining: test against the real Alertmanager."
  - id: LOG-05
    requirement: "Every service has health metrics, uptime checks and capacity alerts"
    core: true
    controls:
      soc2: [A1.1, CC7.2]
      iso27001: ["8.6", "8.16"]
      iso27017: []
    check: "CI asserts each role registers scrape targets and alert rules"
    status: implemented
    progress: "Done: node_exporter on every host, Prometheus scrape catalog with availability, capacity and pipeline alerts, Grafana dashboards. Remaining: each new service role registers its endpoint and rules."
  - id: LOG-06
    requirement: "A log source or agent going silent raises an alert"
    core: true
    controls:
      soc2: [CC7.2]
      iso27001: ["8.16"]
      iso27017: []
    check: "Monitoring rule: missing heartbeat"
    status: implemented
    progress: "Done: LogShipperNotRunning on the wazuh-agent unit and LogShipperSilent on log_shipper_last_ack_timestamp_seconds. Remaining: the SIEM agent must export that metric. SIEM: Agent textfile metrics every minute: wazuh_agent_connected, wazuh_agent_last_keepalive_timestamp_seconds and log_shipper_last_ack_timestamp_seconds (the existing LogShipperSilent alert); manager metrics wazuh_manager_up and wazuh_manager_agents{status}; rule 100110 (level 10) on the manager when an agent disconnects. Tested in molecule/siem."
  - id: HRD-01
    requirement: "Hosts pass the CIS Level 1 benchmark for their Debian/Ubuntu version; exceptions are documented"
    core: true
    controls:
      soc2: [CC6.8, CC7.1]
      iso27001: ["8.9"]
      iso27017: ["CLD.9.5.2"]
    check: "OpenSCAP or ansible-lockdown audit in CI and weekly"
    status: implemented
    progress: "Done: CIS L1 subset (sysctl, modules, core dumps, sudo, accounts, services). roles/cis_audit: weekly OpenSCAP CIS Level 1 scan on every host (distribution SCAP content on Debian 12 and Ubuntu 22.04; Debian has no CIS profile in SSG, so ANSSI minimal there plus the Wazuh SCA CIS policy), evidence (XCCDF/ARF/HTML/summary) under /var/lib/compliance-evidence/cis/, textfile metrics and alerts on score drops, rule regressions and missed runs; exceptions in docs/cis-exceptions.md count as excepted. CI: .github/workflows/audits.yml runs the scan on a baselined test container per release (molecule/audits). Parser checked on a sample results file; scans not run (not tested). Remaining: record the SHA-256 of the scap-security-guide release in roles/versions (needed for Ubuntu 24.04, which refuses to scan until then)."
  - id: HRD-02
    requirement: "Containers run as non-root from pinned, signed images with minimal base and read-only filesystem where possible"
    core: true
    controls:
      soc2: [CC7.1, CC8.1]
      iso27001: ["8.9", "8.19"]
      iso27017: []
    check: "Policy check of compose files; image signature verification"
    status: implemented
    progress: "tools/container_policy.py (CI and pre-commit) checks every docker_container task that defines a container: image from versions_images, cap_drop ALL, no-new-privileges, explicit user, read_only, memory and pids limits, not privileged, no host network; exceptions need a reason (inline '# policy-exception:' or compliance/container-policy.yml). Fixed: explicit user for OpenBao and Keycloak. Justified exceptions: host networking project-wide (host nftables is the only filter), read_only for Keycloak, Wazuh indexer/dashboard/manager, user for the Wazuh manager (s6 init). Container settings verified in Molecule for Keycloak and others; the new explicit users are not tested. Signed images: CHG-08 (registry-check-signature)."
  - id: HRD-03
    requirement: "Container hosts pass the CIS Docker benchmark"
    core: true
    controls:
      soc2: [CC6.8]
      iso27001: ["8.9"]
      iso27017: ["CLD.9.5.2"]
    check: "docker-bench-security in CI and weekly"
    status: implemented
    progress: "Done: daemon.json hardening, socket permissions, audit rules. roles/docker_bench: weekly docker-bench-security run on container hosts, JSON evidence under /var/lib/compliance-evidence/docker-bench/, textfile metrics, alerts on WARN results outside the documented exceptions (docs/cis-exceptions.md) and on missed runs; CI job in .github/workflows/audits.yml (molecule/audits with Docker). Parser checked on a sample log; not run (not tested). Remaining: record docker-bench-security's SHA-256 in roles/versions; until then the role and the CI job refuse to run (or use docker_bench_local_src with a reviewed copy)."
  - id: HRD-04
    requirement: "Security patches applied within 14 days for critical and 30 days for high severity"
    core: true
    controls:
      soc2: [CC7.1]
      iso27001: ["8.8"]
      iso27017: []
    check: "Patch-age report from hosts and images"
    status: implemented
    progress: "Done: unattended security upgrades; textfile metrics for pending security updates, their age and reboot-required, with SecurityUpdatesOverdue (>14 days) and RebootRequiredTooLong (>7 days) alerts; rolling reboot playbook. Remaining: 30-day SLA for high severity (apt has no severity), container images."
  - id: HRD-05
    requirement: "Hosts and images are scanned for vulnerabilities weekly; findings are tracked to closure"
    core: true
    controls:
      soc2: [CC7.1]
      iso27001: ["8.8"]
      iso27017: []
    check: "Scanner results stored as evidence; open findings past due alert"
    status: implemented
    progress: "Done: weekly Trivy scan (roles/trivy_scan) of every running container image and the host root filesystem on container hosts for HIGH/CRITICAL; JSON reports kept 90 days and backed up, journald summary per image, metrics per severity, CriticalVulnerabilityOverdue alert when a CRITICAL finding stays open 14 days; offline DB mirror. Remaining: findings tracked in a ticketing system with risk acceptances; hosts outside container_hosts. SIEM: Wazuh vulnerability detection on every host's package inventory (CTI feed, needs outbound HTTPS to cti.wazuh.com); enabled state tested, findings not (no feed in CI)."
  - id: HRD-06
    requirement: "File integrity monitoring and host intrusion detection run on every host"
    core: true
    controls:
      soc2: [CC6.8, CC7.1]
      iso27001: ["8.7", "8.16"]
      iso27017: []
    check: "Agent status check in SIEM"
    status: implemented
    progress: "SIEM: Wazuh FIM on /etc (real time), /usr/bin, /usr/sbin, /boot and service config files under /opt (hashes only, no diffs), rootcheck and the CIS Ubuntu/Debian SCA policy on every agent; remote commands refused on agents; active response off by default. Tested: FIM change on /etc raises an alert, CIS SCA ran."
  - id: HRD-07
    requirement: "Malware scanning on hosts that accept files, with current signatures"
    core: true
    controls:
      soc2: [CC6.8]
      iso27001: ["8.7"]
      iso27017: []
    check: "Signature age and scan results per host in monitoring; infected files and outdated signatures alert"
    status: implemented
    progress: "Done: ClamAV (roles/clamav) on clamav_hosts with freshclam, a clamd socket for upload scanning, weekly scheduled scan of upload directories, /home and /tmp, findings in journald, metrics and alerts (signatures > 48h, infected files, no scan for 8 days); optional on-access scanning. Remaining: product roles declare clamav_upload_paths_<role> and scan uploads through the socket."
  - id: NET-01
    requirement: "Every host firewall denies inbound by default; only declared ports are open"
    core: true
    controls:
      soc2: [CC6.6]
      iso27001: ["8.20"]
      iso27017: []
    check: "External port scan compared to the declared list"
    status: implemented
    progress: "Default-deny nftables with declared ports and published container ports (roles/firewall); verified in Molecule."
  - id: NET-02
    requirement: "SSH, admin UIs and databases are reachable only through the VPN or bastion"
    core: true
    controls:
      soc2: [CC6.6]
      iso27001: ["8.20", "8.22"]
      iso27017: ["CLD.13.1.4"]
    check: "Port scan from the internet finds no management ports"
    status: implemented
    progress: "SSH on every host only from bastion + VPN (+ gateway NAT addresses, automation runner); bastion SSH from the VPN only; the VPN routes into the mgmt zone only; tested in molecule/access. Edge: non-public services and Keycloak admin paths answer only edge_admin_cidrs (tested). Every firewall rule now carries a class; admin UIs/APIs and data stores allow only firewall_mgmt_cidrs plus named client hosts (group_vars/all/network.yml: monitoring, SIEM, control-plane data store clients) or declared client zones, never any or the whole mgmt zone (fixed: Prometheus, Alertmanager, Grafana, Keycloak, GRC, Wazuh indexer/API, Patroni API, PostgreSQL/Valkey/Garage clients, registry, status page, metrics ports). roles/firewall refuses admin/database rules open to any or the mgmt zone; tools/firewall_audit.py checks the rendered rule set of the example inventory in CI (.github/workflows/network.yml) and generates docs/network.md. Audit run locally on the example inventory; its unit tests (tools/tests) are written, not run; firewall changes not tested on hosts (not tested)."
  - id: NET-03
    requirement: "Management, application and data networks are separated; traffic between them is allowed by explicit rule"
    core: true
    controls:
      soc2: [CC6.6]
      iso27001: ["8.22"]
      iso27017: ["CLD.9.5.1"]
    check: "Firewall rule test between zones"
    status: implemented
    progress: "Zones as data: inventory groups mgmt/app/data (network_zone in group_vars/<zone>/zone.yml; vpn, bastion, dns in mgmt), CIDRs in network_zones, host addresses in group_vars/all/network.yml, allowed flows (service, port, from, to) in compliance/zone-flows.yml. tools/firewall_audit.py renders every host rule from the example inventory and fails on a source in another zone without a declared flow, on sources outside or spanning zones and on hosts outside their zone; port matrix in docs/network.md. CI job .github/workflows/network.yml runs the audit and tools/tests (fixture inventory with known violations); the audit was run locally, the tests are written but not run, no host-level firewall test between zones yet (not tested)."
  - id: NET-04
    requirement: "Public endpoints sit behind the reverse proxy with security headers, rate limits and WAF rules"
    core: true
    controls:
      soc2: [CC6.6]
      iso27001: ["8.20"]
      iso27017: []
    check: "Header and WAF test against each public URL"
    status: implemented
    progress: "Edge HAProxy (roles/edge): HTTPS only with redirect, HSTS and security headers with per-service CSP, per-IP and per-service rate limits (429), Coraza WAF with OWASP CRS 4.25 blocking at PL1 with per-service exclusions; asserted in molecule/edge. Remaining: weekly external header/WAF scan of each real public URL."
  - id: BCK-01
    requirement: "Every stateful service has an automated, encrypted backup with an off-site copy"
    core: true
    controls:
      soc2: [A1.2, CC9.1]
      iso27001: ["8.13"]
      iso27017: []
    check: "CI asserts each stateful role defines a backup job; backup age alert"
    status: implemented
    progress: "restic on every host backs up each backup_register declaration plus /etc to 2+ append-only rest-servers (independent encrypted copies); optional nightly restic copy to S3 (untested); BackupRPOExceeded/BackupFailed alerts in monitoring; tested in molecule/backup. Remaining: CI check that every stateful role registers a backup. OpenBao Raft snapshots registered via backup_register. PostgreSQL: pgBackRest with continuous WAL archiving, weekly full and daily differential backups to encrypted S3/posix repositories, metrics under the backup role's names (tested with a posix repository). SIEM: SIEM manager state, SIEM CA and indexer security config registered with backup_register. Valkey: BGSAVE plus RDB copy registered with backup_register (tested single node). RabbitMQ: definitions export registered with backup_register; messages are transient by design (not tested). Garage: metadata snapshot registered with backup_register; objects rely on replication factor 3 (not tested)."
  - id: BCK-02
    requirement: "Backups are immutable (append-only) for their retention period"
    core: true
    controls:
      soc2: [A1.2]
      iso27001: ["8.13"]
      iso27017: []
    check: "Test: deleting a backup with service credentials fails"
    status: implemented
    progress: "rest-server --append-only and --private-repos; retention runs only on the server; molecule/backup proves client forget/prune and HTTP DELETE get 403. Remaining: Object Lock on the S3 copy is recommended, not enforced."
  - id: BCK-03
    requirement: "Restores are tested automatically at least monthly and timed against the RTO"
    core: true
    controls:
      soc2: [A1.3]
      iso27001: ["8.13", "5.30"]
      iso27017: []
    check: "Restore job result stored as evidence"
    status: implemented
    progress: "Monthly timer restores the latest snapshot of each declaration from each server, runs its verify_command, times it against the RTO and writes metrics (RestoreTestOverdue, RestoreSlowerThanRTO alerts); playbooks/restore.yml for manual restores; tested. Remaining: archive results as audit evidence. PostgreSQL: monthly pgBackRest restore into a scratch container with database checks, timed against the RTO (tested)."
  - id: BCK-04
    requirement: "Each service declares an RTO and RPO, and its backup schedule meets the RPO"
    core: true
    controls:
      soc2: [A1.2]
      iso27001: ["5.30"]
      iso27017: []
    check: "Lint check: RTO/RPO variables set and consistent with schedule"
    status: implemented
    progress: "backup_register requires RPO/RTO; the backup role derives the timer from the smallest RPO (at least daily) and asserts it meets it. Remaining: CI lint across roles."
  - id: HA-01
    requirement: "Every Core service runs on 3 or more nodes (or 2 plus a witness) with automatic failover"
    controls:
      soc2: [A1.1, A1.2]
      iso27001: ["8.14"]
      iso27017: []
    check: "CI test kills a node and asserts the service keeps working"
    status: implemented
    progress: "playbooks/ha_drill.yml with roles/ha_drill: a drill per HA service (ha_drill_<service>: openbao, keycloak, monitoring, edge, registry, status page, forgejo and runners, mail relay, backup servers, SIEM, DNS, bastion, VPN, PostgreSQL, Valkey, RabbitMQ, Garage) checks every node, stops the leader/primary/VIP holder, probes the service and a write from a survivor, restores the node, writes JSON evidence to /var/lib/compliance-evidence/ha-drill/ and metrics (HADrillFailed). Nightly workflow .github/workflows/nightly-ha.yml runs 3-node molecule scenarios keycloak-ha, openbao-ha and postgres-ha with the drill in verify (written, not run). GRC is one node by documented exception (docs/dr/grc.md). Not tested. Per service: Keycloak clusters over JDBC_PING and refuses fewer than 3 nodes outside lab mode. Edge: 2+ nodes, keepalived VRRP moves the VIP when HAProxy or the WAF fails; failover tested. Monitoring: 2+ Prometheus, 3 Alertmanager. OpenBao: Raft, 3+ nodes, standbys upgraded before the active node. PostgreSQL: Patroni + 3-member etcd per cluster, HAProxy on every node routing to the leader, rolling replacement with switchover; single-node tested only. SIEM: 3-node indexer (1 replica), manager cluster (1 master + workers, agents fail over across the list), dashboard on every SIEM node; refuses fewer than 3 (2 for dashboards) outside lab mode. Only a single node was tested. Valkey: primary plus replicas with 3 Sentinels per instance, rolling replacement with Sentinel failover; single node tested only. RabbitMQ: 3-node clusters, quorum queues by default, pause_minority, rolling restarts (not tested). Garage: 3 nodes, replication factor 3 across zones, layout applied by Ansible (not tested)."
  - id: HA-02
    requirement: "Each service has a DR runbook, and a DR drill runs every year"
    controls:
      soc2: [A1.3, CC9.1]
      iso27001: ["5.29", "5.30"]
      iso27017: []
    check: "Drill report stored as evidence"
    status: implemented
    progress: "docs/dr/<service>.md runbooks for 16 services and docs/dr/README.md with the rebuild order, dependencies and RTOs. playbooks/dr_drill.yml (roles/dr_drill) restores each service's latest backup into an encrypted scratch directory, verifies it with the service's tools in containers without network (PostgreSQL full pgBackRest restore with verify_sql, valkey-check-rdb, RabbitMQ import into a scratch broker, git fsck of Forgejo repositories, OpenBao snapshot checksums, each declaration's verify_command), checks backup age against the RPO and time against the RTO, writes a JSON report to /var/lib/compliance-evidence/dr-drill/ and metrics; DRDrillOverdue fires after 13 months without a successful drill (DRDrillNeverRan, DRDrillFailed, DRDrillSlowerThanRTO too). tools/release.py check fails CI when a drilled service has no runbook. Not tested."
  - id: CHG-01
    requirement: "All changes go through a pull request with at least one approval on a protected main branch"
    core: true
    controls:
      soc2: [CC8.1]
      iso27001: ["8.32"]
      iso27017: []
    check: "Branch protection settings exported and checked"
    status: implemented
    progress: "roles/forgejo org_setup creates organisations and repositories with main protected (no direct/force push, 1+ approval, stale approvals dismissed, rejected reviews and status checks block, admins included), checks each rule against the policy and exports it to JSON evidence; molecule/forgejo proves the settings and that a direct push to main is rejected. Remaining: archive the evidence file in the evidence store (EVD-02)."
  - id: CHG-02
    requirement: "Production changes run only from CI, with each run logged (who, what, when)"
    core: true
    controls:
      soc2: [CC8.1]
      iso27001: ["8.32", "8.15"]
      iso27017: []
    check: "CI run logs shipped to SIEM; host denies ad-hoc Ansible runs"
    status: implemented
    progress: "Forgejo Actions runners (roles/forgejo_runner) and deploy pipeline. Run records: the run_record callback (ansible.cfg) and tools/ansible-run log who (CI actor/user), commit, playbook, limit, tags, check mode and per-host results to journald on the controller and on every host touched (identifier ansible-run, SIEM rule 100130). ci_only_deploys (example inventory: true): the deploy account accepts only certificates with the ci-deploy principal (signed through the OpenBao ci-deploy AppRole, which can only sign that role and read the vault password; tools/ci-openbao-login), static keys removed, sudo allowed only in a session that logged in with that certificate (pam_exec check, refusals are SIEM rule 100131); people lose sudo; break-glass account with alerting (SIEM 100120, BreakGlassLogin). Runs outside CI only stage it; the first run that logs in with the CI certificate enforces it, so a run from the control machine cannot lock itself out (ci_only_deploys_enforced, CIOnlyDeploysNotEnforced). docs/audits.md. Not tested."
  - id: CHG-03
    requirement: "Drift from the declared state is detected and alerted"
    core: true
    controls:
      soc2: [CC7.1, CC8.1]
      iso27001: ["8.9"]
      iso27017: []
    check: "Scheduled check-mode run; any change counts as drift"
    status: implemented
    progress: "Scheduled check-mode run of site.yml through tools/ansible-run: .github/workflows/drift.yml and .forgejo/workflows/drift.yml (daily, deploy runner, ci-deploy AppRole). playbooks/run_record.yml writes ansible_drift_changed_tasks / failed / last-check timestamp per host (textfile collector); DriftDetected, DriftCheckFailed and DriftCheckNotRun alerts; tools/drift_report.py fails the job and lists drifted hosts (checked on sample records). Not run (not tested)."
  - id: CHG-04
    requirement: "Dev, test and production use separate inventories, and production data is never copied to test"
    core: true
    controls:
      soc2: [CC8.1]
      iso27001: ["8.31", "8.33"]
      iso27017: []
    check: "Inventory lint; no production hosts in test groups"
    status: implemented
    progress: "tools/inventory_lint.py (CI lint job and pre-commit): every inventory sets inventory_environment (production|staging|test|dev; not 'environment', a reserved Ansible keyword), no host or ansible_host in two inventories, and no production backup/S3 target, restore source or host referenced from a non-production inventory. Layout and limits in docs/inventories.md; inventories/example declares production. Self-tested on sample inventories; real inventories live outside this repo, so operators must run it in their inventory repo's CI (not tested there)."
  - id: CHG-05
    requirement: "Collections, roles and images are pinned, scanned and listed in an SBOM"
    core: true
    controls:
      soc2: [CC7.1, CC8.1]
      iso27001: ["8.8", "8.19"]
      iso27017: []
    check: "CI generates the SBOM and fails on unpinned dependencies"
    status: implemented
    progress: "Collections, Python tools, packages and downloads pinned and checked by tools/pins.py (CI and pre-commit; fails on floating/missing tags, inexact versions, get_url without checksum, CI downloads without sha256sum). images job: syft v1.18.1 SBOM (SPDX JSON) of every versions_images entry and of the repo, Trivy (digest-pinned from roles/versions) scan failing on CRITICAL unless waived with reason and expiry in compliance/vuln-waivers.yml; SBOMs and reports kept as a CI artifact (90 days). Rule: image:tag@sha256 (docs/supply-chain.md); only trivy has a digest so far, the other 30 images warn until digests are added from registry output. GitHub Actions are tag-pinned (warning). CI jobs not run yet (not tested)."
  - id: CHG-06
    requirement: "Every role has Molecule tests on all supported OS versions, including its checklist items"
    core: true
    controls:
      soc2: [CC8.1]
      iso27001: ["8.29"]
      iso27017: []
    check: "CI matrix; coverage report of checklist IDs"
    status: implemented
    progress: "Every service scenario takes its platform image from MOLECULE_DISTRO; CI runs each scenario on debian12, ubuntu2204 and ubuntu2404 (matrix, molecule-services job); molecule/default already covered all three. tools/checklist.py coverage lists roles without a scenario (none today) and checklist items without a tagged verify task, published in the CI job summary. Debian 12 and Ubuntu 22.04 runs of the service scenarios have never executed (tests on hold), so OS-specific failures are possible (not tested)."
  - id: CHG-07
    requirement: "Upgrades ship as tested release bundles: pinned versions, a CI-tested path from the previous release, a backup first, one node at a time with health gates"
    core: true
    controls:
      soc2: [CC8.1, A1.2]
      iso27001: ["8.32", "8.13", "8.8"]
      iso27017: []
    check: "Molecule upgrade scenario per stateful service installs the previous release and upgrades it"
    status: implemented
    progress: "Every service that runs a pinned version has a play in playbooks/upgrade.yml with a backup first and one node at a time behind health gates, and a Molecule upgrade scenario that installs versions_upgrade_from and runs that playbook: OpenBao, Keycloak, PostgreSQL, Valkey, RabbitMQ, Garage, SIEM (indexer S3 snapshot, manager archive, agents), registry, backup server, Forgejo and runners, edge, status page and GRC, monitoring (13 *-upgrade scenarios, all in the CI matrix). tools/release.py check fails when a role reading roles/versions has no upgrade play or scenario (UPGRADE_COVERAGE, UPGRADE_EXEMPT with reasons); tools/release.py cut is the tag pre-flight, including the first release v0.1.0 with no earlier tag (docs/releasing.md); it never tags. Scenarios without a previous release of their service are skipped with a notice until bump-upgrade-from after a release; ready today: keycloak, openbao, siem (from upstream predecessor versions). No scenario has run and no release has been tagged (not tested)."
  - id: CHG-08
    requirement: "Images deployed come from the internal registry, are scanned for vulnerabilities and carry a trusted signature"
    core: true
    controls:
      soc2: [CC7.1, CC8.1]
      iso27001: ["8.8", "8.19", "8.32"]
      iso27017: []
    check: "Registry trust store holds the CI signing keys; registry-check-signature fails under enforce for an unsigned image"
    status: implemented
    progress: "roles/registry: Zot with Trivy CVE scanning, cosign/notation trust stores and registry-check-signature; the unsigned-image refusal passed in molecule/registry. CI: .github/workflows/images.yml and .forgejo/workflows/images.yml run tools/image_mirror.py (crane copy into <mirror>/<upstream path>, digest pins enforced, syft SPDX SBOM as a signed cosign attestation, cosign signature with an OpenBao transit key via hashivault:// or a CI secret key; pinned crane/cosign/syft via go install). image_registry_mirror (group_vars/all/images.yml) is applied once in roles/versions (tasks rewrite versions_images, so no service role changed); roles/image_verify (meta dependency of every container role) logs in to the mirror and runs registry-check-signature for each image before containers are created when image_signature_policy is enforce, keeping results under /var/lib/compliance-evidence/image-signatures. Mirror dry run checked locally; workflows, mirror pulls and the check on hosts not run (not tested). Not covered: Forgejo Actions job images pulled by the runner."
  - id: DAT-01
    requirement: "Each product instance gets its own database or bucket and credentials"
    controls:
      soc2: [C1.1]
      iso27001: ["8.3"]
      iso27017: ["CLD.9.5.1"]
    check: "Product playbook test: no shared credentials between instances"
    status: implemented
    progress: "PostgreSQL product playbook (postgres_clusters): each instance has its own containers, ports, data directory, etcd with a per-cluster CA, pgBackRest stanza and passphrase, firewall rule variable and credentials; the role fails when a secret is shared between instances; per-database owner/rw/ro roles with CONNECT revoked from PUBLIC; tested in molecule/postgres with two clusters. Valkey (valkey_clusters): own containers, ports, data directory, ACL users and secrets per instance, the role fails on a shared secret; application ACL users limited to their key prefix; tested single node in molecule/valkey. RabbitMQ (rabbitmq_clusters): own Erlang cookie, admin, vhosts and per-application users limited to their vhost, guest and undeclared users removed (not tested). Garage (garage_clusters): own RPC secret, admin and metrics tokens, imported per-application keys that cannot create buckets and only reach granted buckets (not tested)."
  - id: DAT-02
    requirement: "Each data service has export and secure-deletion playbooks that produce deletion evidence"
    controls:
      soc2: [C1.2]
      iso27001: ["8.10"]
      iso27017: ["CLD.8.1.5"]
    check: "Test: export then delete a sample dataset"
    status: implemented
    progress: "playbooks/data_export.yml and playbooks/data_delete.yml (roles/data_lifecycle) for PostgreSQL (database), Valkey (key pattern), RabbitMQ (vhost), Garage (bucket) and Forgejo (organisation, user or repository). Export: plaintext only in a root-only staging directory on the encrypted volume, packaged as a CMS (AES-256) archive to the data owner's certificate with a manifest of every file's SHA-256 (dl-package checked on sample files). Delete: typed confirmation (DELETE:<service>/<instance>:<scope>), request reference, requester, approver and reason; refuses while the inventory still declares the scope and without an export (or the requester's recorded decision); checks the scope is gone afterwards and writes a JSON deletion certificate with its SHA-256, the method, the export reference and the backup-expiry date from the restic and pgBackRest retention. Evidence under /var/lib/compliance-evidence/data-export and data-deletion, backed up. Not tested against running services."
  - id: DAT-03
    requirement: "A shared-responsibility matrix states what the repo, the company and the hosting provider own"
    controls:
      soc2: [CC9.2]
      iso27001: ["5.23"]
      iso27017: ["CLD.6.3.1"]
    check: "Document review each release"
    status: implemented
    progress: "docs/shared-responsibility.md: repo, company and provider responsibilities for the seven ISO 27017 CLD controls, the extended guidance (ext. 10.1.2 key management, backup, event reporting, location) and by layer. Reviewed each release (docs/releasing.md checklist); tools/release.py check (CI) fails when a CLD control, or a checklist item mapped to one, is missing from it."
  - id: EVD-01
    requirement: "Every checklist item maps to tasks and tests; Core items without a test fail CI"
    controls:
      soc2: [CC4.1]
      iso27001: ["5.36"]
      iso27017: []
    check: "CI coverage check"
    status: implemented
    progress: "checklist.yml marks Core items (core: true: IAM, SEC, LOG, HRD, NET, BCK, CHG). tools/checklist.py check fails CI when a Core item marked verified has no tagged Molecule verify task and warns for Core items marked implemented without one; --strict-core makes that blocking. Not blocking for implemented yet because tests are on hold: Core items moved to implemented without a verify task (SEC-01, CHG-04, CHG-05, CHG-06 here, and others in parallel work) would break CI; switch on --strict-core when Molecule runs again. CI workflow steps tagged chk_* now count as implementation evidence. tools/evidence_export.py exports item evidence (verified in molecule/governance)."
  - id: EVD-02
    requirement: "Evidence from every run is stored for 12 months in tamper-evident storage"
    controls:
      soc2: [CC4.1]
      iso27001: ["5.33"]
      iso27017: []
    check: "Evidence store retention test"
    status: implemented
    progress: "CISO Assistant (roles/grc) holds evidence with a 12-month audit log. Evidence store: dedicated restic repository on every append-only rest-server (roles/backup_server, evidence login that can append but not delete); roles/evidence_store uploads /var/lib/compliance-evidence from every host weekly (EvidenceUploadStale); the servers keep every evidence snapshot 13 months and run a weekly retention check (oldest kept evidence and one snapshot per calendar month over 12 months; EvidenceRetentionViolated, EvidenceRetentionCheckNotRun), whose verdict is itself evidence. Audit roles register their directories with backup_register. Retention logic checked on sample snapshot listings; not run (not tested). Remaining: CI artifacts (drift records, CI scans) are kept 90 days in CI, not yet uploaded to the store."
  - id: EVD-03
    requirement: "An asset inventory with an owner per asset is generated from inventory and agents"
    controls:
      soc2: [CC6.1]
      iso27001: ["5.9"]
      iso27017: []
    check: "Weekly report; asset without owner fails"
    status: implemented
    progress: "SIEM: Wazuh syscollector inventory (hardware, OS, packages, ports, processes) from every host hourly, labelled with owner and inventory groups. Tested: the OS inventory of the test host is in the manager. Remaining: laptops (docs/siem-endpoints.md, Phase 2)."
  - id: EVD-04
    requirement: "Every adopted tool's free edition covers SSO, audit logs and HA under an OSI licence"
    controls:
      soc2: []
      iso27001: []
      iso27017: []
    project_rule: true
    check: "Reviewed in the pull request that adds the tool"
    status: implemented
    progress: "compliance/tools.yml lists every adopted tool (all roles/versions entries plus tool-like distribution packages) with SPDX licence, OSI status and SSO/audit log/HA (yes/no/n.a. with notes) and documented exceptions: Grafana OSS and Forgejo have no audit log, Prometheus has basic auth only behind the edge and no audit log, Valkey, RabbitMQ and Garage have no audit log, CISO Assistant is single-node, WireGuard has no SSO, OpenSSH's licence is not OSI-listed. tools/tool_registry.py fails CI when a versions entry has no tools.yml entry or a 'no' lacks an exception. Licence and edition facts are a desk review, to be re-checked on major bumps (not tested)."
  - id: INC-01
    requirement: "Incidents follow a documented process with severity, timeline and postmortem; records kept 12 months"
    controls:
      soc2: [CC7.3, CC7.4, CC7.5]
      iso27001: ["5.24", "5.25", "5.26", "5.27"]
      iso27017: []
    check: "Incident issues carry severity, timeline and a linked postmortem; tracker retention reviewed yearly"
    status: implemented
    progress: "docs/incident-response.md: severities, roles, alert-to-incident flow, templates, status page comms, 12-month retention. roles/forgejo org_setup provisions the incident tracker (forgejo_incident_tracker_*: platform/incidents in the example) with branch protection, labels incident, sev1-sev4, postmortem-needed, postmortem, security, and the docs/templates issue templates in .forgejo/ISSUE_TEMPLATE (later changes as a pull request); settings exported as evidence. forgejo-incident-export.timer exports all incident issues monthly to /var/lib/compliance-evidence/incidents (append-only backup) with metrics; alerts for stale export, records deleted inside retention, overdue postmortems and the yearly retention review (group_vars/monitoring/incidents.yml). Export script checked against a stub API locally; role tasks and alerts not run (not tested)."
