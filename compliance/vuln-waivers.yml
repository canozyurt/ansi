# here. Each waiver needs:
#   id:       CVE/GHSA id, or the Trivy secret rule id
#   image:    optional; repository (with or without tag) the waiver is limited to
#   package:  optional; package name the waiver is limited to
#   reason:   why the finding is not exploitable here or why it cannot be fixed yet
#   expires:  YYYY-MM-DD, at most 180 days ahead; an expired waiver fails CI
#   approved_by: who accepted the risk (security-admin role)
# Example:
#   - id: CVE-2026-00000
#     image: docker.io/library/haproxy
#     package: libexample
