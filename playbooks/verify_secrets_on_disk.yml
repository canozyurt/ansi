---
# SEC-02 check (written, not yet run): no file under /etc or /opt holds a secret that OpenBao manages;
# rendered secrets belong in tmpfs (/run/compliant-secrets). Scans every host that runs an OpenBao Agent and
# keeps a report (paths and key names only) under /var/lib/compliance-evidence/secrets-on-disk/.
#
#   ansible-playbook -i ../inventories/<env> playbooks/verify_secrets_on_disk.yml
- name: Scan for stored copies of runtime secrets
  hosts: container_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Scan /etc and /opt
      ansible.builtin.include_role:
        name: openbao_secrets
        tasks_from: verify
      when: secrets_backend | default('vault-file') == 'openbao'
      tags: [chk_sec_02]
