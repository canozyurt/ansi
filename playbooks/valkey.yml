---
# Valkey product playbook (docs/product-playbooks.md). Deploys every entry of valkey_clusters: each is
# an independent Valkey instance (primary, replicas, 3 Sentinels, redis_exporter) on the hosts of its
# own inventory group, with its own containers, ports, data directories, ACL users and backups (DAT-01).
#
#   ansible-playbook -i inventories/<company> playbooks/valkey.yml [-e valkey_only=cache-main]
#
# The "valkey" group must contain every instance group (see inventories/example/hosts.yml).
# Version changes are refused here; they go through playbooks/upgrade.yml.

- name: Deploy the Valkey instances
  hosts: valkey
  become: true
  tasks:
    - name: Deploy each instance this host belongs to
      ansible.builtin.include_role:
        name: valkey_cluster
      loop: >-
        {{ valkey_clusters | default([]) | selectattr('group', 'in', group_names)
           | selectattr('name', 'in', (valkey_only | default('')).split(',') if valkey_only | default('') | length > 0
                                      else valkey_clusters | default([]) | map(attribute='name') | list)
           | list }}
      loop_control:
        loop_var: valkey_cluster
        label: "{{ valkey_cluster.name }}"
