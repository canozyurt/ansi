---
# Full deployment. Run from CI only (CHG-02); use --check --diff for the weekly audit run (CHG-03).
# On new hosts run playbooks/bootstrap.yml first (docs/first-deploy.md).
- name: Stop a first deploy that has not run bootstrap.yml
  hosts: bastion
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require the SSH user CA key in the inventory (IAM-06)
      ansible.builtin.assert:
        that: ssh_hardening_trusted_user_ca_keys | default([]) | length > 0
        fail_msg: >-
          ssh_hardening_trusted_user_ca_keys is empty, so the bastion cannot be deployed and this run would stop
          half-way. On new hosts run playbooks/bootstrap.yml first and put the SSH CA key it writes to
          .openbao-init/ into the inventory (docs/first-deploy.md).
        quiet: true
      tags: [always]

- name: Validate the organization role model
  ansible.builtin.import_playbook: rbac.yml

- name: Apply the host baseline
  ansible.builtin.import_playbook: baseline.yml

- name: Prepare container hosts
  ansible.builtin.import_playbook: container_hosts.yml

- name: Deploy secrets management, the internal PKI and the SSH CA
  ansible.builtin.import_playbook: secrets.yml
  vars:
    openbao_oidc_deferred: true  # Keycloak SSO is connected by identity.yml, once Keycloak exists

- name: Set up admin access (VPN, bastion, session recording, DNS; needs the SSH CA key from bootstrap.yml)
  ansible.builtin.import_playbook: access.yml

- name: Deploy the outbound mail relays (Keycloak and Alertmanager send through them)
  ansible.builtin.import_playbook: mail_relay.yml

- name: Deploy the identity provider (and connect OpenBao to it)
  ansible.builtin.import_playbook: identity.yml

- name: Deploy monitoring and alerting
  ansible.builtin.import_playbook: monitoring.yml

- name: Deploy the container registry (needs Keycloak for SSO; served through the edge)
  ansible.builtin.import_playbook: registry.yml

- name: Deploy the edge proxy, WAF and VIP failover
  ansible.builtin.import_playbook: edge.yml

- name: Deploy backups
  ansible.builtin.import_playbook: backup.yml

- name: Deploy malware and vulnerability scanning
  ansible.builtin.import_playbook: security_scanning.yml

- name: Deploy the status page and the GRC tool
  ansible.builtin.import_playbook: governance.yml

- name: Deploy source control, CI/CD and change approval
  ansible.builtin.import_playbook: delivery.yml

- name: Deploy central logging and the SIEM
  ansible.builtin.import_playbook: siem.yml

- name: Deploy the scheduled compliance audits and the evidence store
  ansible.builtin.import_playbook: audits.yml
