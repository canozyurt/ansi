---
# PostgreSQL product playbook (docs/product-playbooks.md). Deploys every entry of postgres_clusters:
# each is an independent Patroni cluster on the hosts of its own inventory group, with its own
# containers, ports, data directories, credentials, certificates, etcd and backups (DAT-01).
#
#   ansible-playbook -i ../inventories/<env> playbooks/postgres.yml [-e postgres_only=pg-main]
#
# The "postgres" group must contain every cluster group (see inventories/example/hosts.yml).
# Version changes are refused here; they go through playbooks/upgrade.yml.

- name: Deploy the PostgreSQL clusters
  hosts: postgres
  become: true
  tasks:
    - name: Deploy each cluster this host belongs to
      ansible.builtin.include_role:
        name: postgres_cluster
      loop: >-
        {{ postgres_clusters | default([]) | selectattr('group', 'in', group_names)
           | selectattr('name', 'in', (postgres_only | default('')).split(',') if postgres_only | default('') | length > 0
                                      else postgres_clusters | default([]) | map(attribute='name') | list)
           | list }}
      loop_control:
        loop_var: postgres_cluster
        label: "{{ postgres_cluster.name }}"
