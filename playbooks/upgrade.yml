---
# Applies a new release of this repository to running hosts (docs/upgrades.md).
#
#   git checkout vX.Y.Z
#   ansible-playbook -i ../inventories/<env> playbooks/upgrade.yml
#   ansible-playbook -i ../inventories/<env> playbooks/site.yml    # only if upgrade.yml succeeded
#
# Every service is upgraded one node at a time; the run stops at the first node that
# does not come back healthy. Services back up their data before a version change.
#
# This playbook changes versions and applies the upgraded services' roles, nothing else. The rest of
# the release (baseline and hardening, the other roles, roles new in this release) comes from
# site.yml, which refuses to change versions, so it runs second. A release is applied only when both
# have run from the same tag. CI runs them as two steps of one job (docs/upgrades.md).

- name: Check OpenBao is healthy and order its nodes for the upgrade
  hosts: openbao
  become: true
  gather_facts: false
  tasks:
    - name: Every OpenBao node is unsealed and in the cluster
      ansible.builtin.include_role:
        name: openbao
        tasks_from: health
      when: not (upgrade_skip_preflight | default(false) | bool)
      tags: [chk_chg_07]

    - name: Find the active node
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ openbao_api_port | default(8200) }}/v1/sys/leader"
        validate_certs: false
      register: upgrade_openbao_leader
      failed_when: false

    - name: Upgrade the standbys first and the active node last
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: openbao_upgrade_order
      loop: >-
        {{ ansible_play_hosts | reject('in', upgrade_openbao_active) | list
           + ansible_play_hosts | select('in', upgrade_openbao_active) | list }}
      vars:
        upgrade_openbao_active: >-
          {{ ansible_play_hosts | map('extract', hostvars, 'upgrade_openbao_leader')
             | map(attribute='json', default={}) | map(attribute='is_self', default=false)
             | zip(ansible_play_hosts) | selectattr(0) | map(attribute=1) | list }}
      run_once: true
      changed_when: false
      tags: [chk_chg_07]

- name: Upgrade OpenBao one node at a time (snapshot first, unseal after each restart)
  hosts: openbao_upgrade_order
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: openbao

- name: Check the identity provider is healthy before upgrading
  hosts: keycloak
  become: true
  gather_facts: false
  tasks:
    - name: Every Keycloak node is ready
      ansible.builtin.include_role:
        name: keycloak
        tasks_from: health
      when: not (upgrade_skip_preflight | default(false) | bool)
      tags: [chk_chg_07]

- name: Upgrade the identity provider one node at a time
  hosts: keycloak
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: keycloak

- name: Find the hosts that run node_exporter and the SIEM agent
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Look for the node_exporter configuration and the agent's control script
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/opt/node_exporter/web.yml, /var/ossec/bin/wazuh-control]
      register: upgrade_installed

    - name: Upgrade only what this host runs (a release upgrades, it does not install)
      ansible.builtin.group_by:
        key: "{{ item.0 }}"
      loop: "{{ ['upgrade_node_exporter', 'upgrade_wazuh_agent'] | zip(upgrade_installed.results) | selectattr('1.stat.exists') | list }}"
      loop_control:
        label: "{{ item.0 }}"
      changed_when: false
      tags: [chk_chg_07]

- name: Upgrade node_exporter in batches
  hosts: upgrade_node_exporter
  become: true
  serial: "20%"
  roles:
    - role: node_exporter

- name: Upgrade monitoring one node at a time (the other replicas keep scraping and alerting)
  hosts: monitoring
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: blackbox_exporter
    - role: alertmanager
    - role: prometheus
    - role: grafana
    - role: oauth2_proxy
      when: oauth2_proxy_instances | default([]) | length > 0
  post_tasks:
    - name: Wait until Alertmanager, Prometheus and Grafana on this node are healthy before the next one
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: health
      loop: [alertmanager, prometheus, grafana]
      tags: [chk_chg_07]

- name: Upgrade the edge one node at a time (the VIP moves to the other node meanwhile)
  hosts: edge
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: edge
    - role: keepalived

- name: Upgrade the container registry one instance at a time (the edge sends traffic to the others)
  hosts: registry
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: registry

- name: Upgrade the status page one node at a time (the edge sends traffic to the other node)
  hosts: status_page
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: status_page

- name: Upgrade the GRC tool (the role dumps the database before the new version migrates it)
  hosts: grc
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: grc
      vars:
        grc_upgrade_allowed: true

- name: Upgrade Forgejo one node at a time (dumps first; active/active stops the other nodes)
  hosts: forgejo
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: forgejo

- name: Upgrade the Forgejo Actions runners one at a time
  hosts: forgejo_runner
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: forgejo_runner

- name: Upgrade the PostgreSQL clusters (minor versions; replicas first, then a switchover)
  hosts: postgres
  become: true
  max_fail_percentage: 0
  vars:
    # Each cluster's first node takes a differential backup, then replaces one member at a time:
    # replicas first, a switchover away from the leader, then the former leader (CHG-07, HA-01).
    postgres_cluster_upgrade: true
  tasks:
    - name: Upgrade each cluster this host belongs to
      ansible.builtin.include_role:
        name: postgres_cluster
      loop: "{{ postgres_clusters | default([]) | selectattr('group', 'in', group_names) | list }}"
      loop_control:
        loop_var: postgres_cluster
        label: "{{ postgres_cluster.name }}"
      tags: [chk_chg_07]

- name: Back up and upgrade the Valkey instances
  hosts: valkey
  become: true
  max_fail_percentage: 0
  vars:
    # The role replaces one member at a time itself (replicas first, a Sentinel failover, then the former primary), CHG-07 and HA-01.
    valkey_cluster_upgrade: true
  tasks:
    - name: Snapshot every instance (BGSAVE and copy of the RDB) before the new version (BCK-01)
      ansible.builtin.command: "/usr/local/sbin/valkey-{{ item.name }}-backup"
      loop: "{{ valkey_clusters | default([]) | selectattr('group', 'in', group_names) | list }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      tags: [chk_chg_07, chk_bck_01]

    - name: Upgrade each cluster this host belongs to
      ansible.builtin.include_role:
        name: valkey_cluster
      loop: "{{ valkey_clusters | default([]) | selectattr('group', 'in', group_names) | list }}"
      loop_control:
        loop_var: valkey_cluster
        label: "{{ valkey_cluster.name }}"
      tags: [chk_chg_07]

- name: Back up and upgrade the RabbitMQ clusters
  hosts: rabbitmq
  become: true
  max_fail_percentage: 0
  vars:
    # The role replaces one member at a time itself (one node at a time, each back in the cluster before the next), CHG-07 and HA-01.
    rabbitmq_cluster_upgrade: true
  tasks:
    - name: Export the definitions of every cluster before the new version (BCK-01)
      ansible.builtin.command: "/usr/local/sbin/rabbitmq-{{ item.name }}-backup"
      loop: "{{ rabbitmq_clusters | default([]) | selectattr('group', 'in', group_names) | list }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      tags: [chk_chg_07, chk_bck_01]

    - name: Upgrade each cluster this host belongs to
      ansible.builtin.include_role:
        name: rabbitmq_cluster
      loop: "{{ rabbitmq_clusters | default([]) | selectattr('group', 'in', group_names) | list }}"
      loop_control:
        loop_var: rabbitmq_cluster
        label: "{{ rabbitmq_cluster.name }}"
      tags: [chk_chg_07]

- name: Back up and upgrade the Garage clusters
  hosts: garage
  become: true
  max_fail_percentage: 0
  vars:
    # The role replaces one member at a time itself (one node at a time, waiting for a healthy cluster in between), CHG-07 and HA-01.
    garage_cluster_upgrade: true
  tasks:
    - name: Snapshot the metadata of every cluster before the new version (BCK-01)
      ansible.builtin.command: "/usr/local/sbin/garage-{{ item.name }}-backup"
      loop: "{{ garage_clusters | default([]) | selectattr('group', 'in', group_names) | list }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      tags: [chk_chg_07, chk_bck_01]

    - name: Upgrade each cluster this host belongs to
      ansible.builtin.include_role:
        name: garage_cluster
      loop: "{{ garage_clusters | default([]) | selectattr('group', 'in', group_names) | list }}"
      loop_control:
        loop_var: garage_cluster
        label: "{{ garage_cluster.name }}"
      tags: [chk_chg_07]

- name: Check every backup server is healthy before upgrading
  hosts: backup
  become: true
  gather_facts: false
  tasks:
    - name: Every rest-server answers (the others keep a full copy while one is upgraded)
      ansible.builtin.include_role:
        name: backup_server
        tasks_from: health
      when: not (upgrade_skip_preflight | default(false) | bool)
      tags: [chk_chg_07]

- name: Upgrade the backup servers one at a time (off-site copy first when configured)
  hosts: backup
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: backup_server

- name: Check the SIEM is healthy before upgrading
  hosts: siem
  become: true
  gather_facts: false
  tasks:
    - name: The indexer cluster is available
      ansible.builtin.include_role:
        name: wazuh_indexer
        tasks_from: health
      when: not (upgrade_skip_preflight | default(false) | bool)
      tags: [chk_chg_07]

    - name: Snapshot the indices to S3 before the first node changes version (BCK-01)
      ansible.builtin.include_role:
        name: wazuh_indexer
        tasks_from: upgrade_backup
      tags: [chk_chg_07, chk_bck_01]

- name: Upgrade the SIEM indexer one node at a time
  hosts: siem
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: wazuh_indexer

- name: Upgrade the SIEM manager one node at a time
  hosts: siem
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: wazuh_manager

- name: Upgrade the SIEM dashboard one node at a time
  hosts: siem
  become: true
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: wazuh_dashboard

- name: Upgrade the SIEM agents in batches (after the managers)
  hosts: upgrade_wazuh_agent
  become: true
  serial: "20%"
  roles:
    - role: wazuh_agent

- name: Remind the operator that the release is not fully applied yet
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Next step is site.yml from the same tag
      ansible.builtin.debug:
        msg: >-
          Versions are upgraded. Now run playbooks/site.yml from this tag with the same inventory to
          apply the rest of the release (baseline, hardening, configuration, new roles). See docs/upgrades.md.
