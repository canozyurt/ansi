---
# Rotates service secrets kept in OpenBao (IAM-08, SEC-02) and updates the services that use them.
# Needs secrets_backend: openbao. Run it on a schedule from CI (weekly is enough: each key rotates when its
# age reaches its rotate_days, default secret_rotation_days = 90):
#
#   ansible-playbook -i inventories/<env> playbooks/rotate_secrets.yml
#   ansible-playbook -i inventories/<env> playbooks/rotate_secrets.yml -e '{"openbao_secrets_force_rotate": ["grafana/*"]}'
#
# For each service, roles/openbao_secrets writes the new value to OpenBao (check-and-set), applies database
# passwords to PostgreSQL first (SCRAM verifier only), re-registers OIDC client secrets in Keycloak and
# restarts the service's OpenBao Agent, which renders the new files; the path unit then restarts the service
# (clustered services one node after another). Application users of Valkey and RabbitMQ get the new hash;
# the applications pick the new password up from OpenBao. The last play writes the rotation report.
- name: Check the backend
  hosts: openbao[0]
  gather_facts: false
  tasks:
    - name: Rotation needs the OpenBao backend
      ansible.builtin.assert:
        that: secrets_backend | default('vault-file') == 'openbao'
        fail_msg: secrets_backend is vault-file; rotate the inventory (Ansible Vault) values by hand instead (docs/secrets.md).
        quiet: true
      tags: [chk_iam_08]

- name: Rotate the identity provider's secrets
  ansible.builtin.import_playbook: identity.yml
  vars:
    openbao_secrets_rotate: true

- name: Rotate Grafana's and the oauth2-proxy secrets
  ansible.builtin.import_playbook: monitoring.yml
  vars:
    openbao_secrets_rotate: true

- name: Rotate the VPN IdP sync client's secret
  ansible.builtin.import_playbook: access.yml
  vars:
    openbao_secrets_rotate: true

- name: Rotate the GRC tool's secrets
  ansible.builtin.import_playbook: governance.yml
  vars:
    openbao_secrets_rotate: true

- name: Rotate Forgejo's secrets
  ansible.builtin.import_playbook: delivery.yml
  vars:
    openbao_secrets_rotate: true

- name: Rotate the Valkey application users' passwords
  ansible.builtin.import_playbook: valkey.yml
  vars:
    openbao_secrets_rotate: true

- name: Rotate the RabbitMQ application users' passwords
  ansible.builtin.import_playbook: rabbitmq.yml
  vars:
    openbao_secrets_rotate: true

- name: Report the rotation state of every service secret
  hosts: openbao[0]
  become: true
  gather_facts: false
  tasks:
    - name: Write the rotation report and metrics
      ansible.builtin.include_role:
        name: openbao_secrets
        tasks_from: report
      tags: [chk_iam_08]
