---
# Example: copy to .forgejo/workflows/drift.yml in YOUR deployment repository (the private repository
# that holds your inventories, see docs/inventories.md), not in compliant-infra-ansible itself.
# Setup, runners, variables and secrets: docs/ci.md. What the job does: examples/ci/github/drift.yml.
#
# Drift detection (CHG-03) on Forgejo Actions. Runs on the deploy runners (roles/forgejo_runner, label
# "deploy") in the Ansible tool image, pinned by digest in the repository variable ANSIBLE_RUNNER_IMAGE
# (registry/.../ansible-runner:<tag>@sha256:<digest>; ansible-core, the pinned collections, git, curl,
# jq, openssh-client). The playbooks come from the compliant-infra-ansible release pinned in
# compliant-infra.ref.
name: drift

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: deploy
    container:
      image: ${{ vars.ANSIBLE_RUNNER_IMAGE }}
    timeout-minutes: 120
    env:
      INVENTORY: ${{ github.workspace }}/${{ vars.ANSIBLE_INVENTORY || 'inventories/production' }}
      PLATFORM_REPO: ${{ vars.COMPLIANT_INFRA_REPO || 'https://github.com/canozyurt/ansi.git' }}
      PLATFORM_DIR: ${{ github.workspace }}/.platform
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned compliant-infra-ansible release
        run: |
          ref=$(grep -v '^#' compliant-infra.ref | head -n 1 | tr -d '[:space:]')
          [ -n "$ref" ] || { echo "compliant-infra.ref names no release"; exit 1; }
          git clone --quiet --filter=blob:none --no-checkout "$PLATFORM_REPO" "$PLATFORM_DIR"
          git -C "$PLATFORM_DIR" -c advice.detachedHead=false checkout "$ref"

      - name: Log in to OpenBao (vault password, CI SSH certificate) [chk_chg_02]
        id: login
        working-directory: .platform
        env:
          BAO_ADDR: ${{ vars.BAO_ADDR }}
          BAO_CACERT: ${{ vars.BAO_CACERT }}
          BAO_ROLE_ID: ${{ vars.BAO_DEPLOY_ROLE_ID }}
          BAO_SECRET_ID: ${{ secrets.BAO_DEPLOY_SECRET_ID }}
        run: echo "opts=$(tools/ci-openbao-login "$RUNNER_TEMP/ci-auth")" >> "$GITHUB_OUTPUT"

      - name: Check-mode run of site.yml with a run record [chk_chg_03]
        working-directory: .platform
        env:
          ANSIBLE_RUN_RECORD_DIR: ${{ runner.temp }}/run-record
        run: |
          set -o pipefail  # the playbook's exit code, not tee's
          tools/ansible-run playbooks/site.yml -i "$INVENTORY" --check --diff ${{ steps.login.outputs.opts }} \
            | tee "$RUNNER_TEMP/drift.log"

      - name: Report drift (fails when a host drifted) [chk_chg_03]
        if: always() && steps.login.outcome == 'success'
        working-directory: .platform
        run: python3 tools/drift_report.py "$(ls -1 "$RUNNER_TEMP"/run-record/*.json | tail -n 1)"

      - name: Remove the credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/ci-auth"
